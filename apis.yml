apis:
- name: byrd Fulfillment API
  description: >-
    REST API to create and manage products, deliveries (inbound stock),
    shipments (outbound orders), and returns across byrd's European fulfillment
    network. JWT bearer auth; JSON over HTTPS (TLS 1.2+); resources versioned in
    the URL path (v2 auth/user, v3 shipments; documented API version 3.1).
