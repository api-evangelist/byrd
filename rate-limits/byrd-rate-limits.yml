rate_limits:
  - scope: login
    limit_count: 5
    window: 1m
    per: IP or User-Agent
    endpoint: POST https://api.getbyrd.com/v2/login
    notes: Cache and reuse JWTs rather than re-authenticating per request.
  - scope: write (products/deliveries/shipments)
    guidance: One call per entity is sufficient for most scenarios; contact byrd if you anticipate sustained volumes above ~10 calls/second.
  - scope: polling (tracking data, stocks, delivery/return updates)
    guidance: Download once per hour; poll no more frequently than every 5 minutes.
