            width:
              type: number
              minimum: 0.1
              description: Width in cm; `null` when unknown.
              nullable: true
            length:
              type: number
              minimum: 0.1
              description: Length in cm; `null` when unknown.
              nullable: true
            weight:
              type: number
              minimum: 0.001
              description: Weight in kg; `null` when unknown.
              nullable: true
          description: Dimensions and weight of one unit of the product; missing values are taken from the product, and the weight stored on the product always replaces the one sent.
          nullable: true
        customs:
          type: object
          properties:
            origin_country_code:
              type: string
              pattern: ^[A-Z]{2}$
              description: Country the product was made in (ISO 3166-1 alpha-2), for example `CN`.
