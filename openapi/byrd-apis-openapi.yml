          readOnly: true
          description: 'B2B configuration of the shipment: the B2B template it uses and your answers to it; `null` for B2C shipments.'
          allOf:
          - $ref: '#/components/schemas/B2BConfig'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the shipment has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/Checkpoints'
        container_code:
          type: string
          description: Code of the warehouse container the picked items are kept in until the shipment is packed.
