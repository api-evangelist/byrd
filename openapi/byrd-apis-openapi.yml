          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        type:
          type: string
          description: 'Kind of document.


            - `printable_label`: return label to print and attach to the parcel (PDF).

            - `qr_code`: QR code from the carrier, for example to hand in the parcel without a printed label (PNG).'
        data_type:
          type: string
          description: 'File format of the document.


            - `pdf`: PDF file.

            - `png`: PNG image.'
      required:
