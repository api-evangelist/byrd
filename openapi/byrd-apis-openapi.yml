          description: Customs details of the product; `null` when not provided.
          nullable: true
        height:
          type: number
          minimum: 0
          description: Height of one unit of the item, in cm.
          nullable: true
        length:
          type: number
          minimum: 0
          description: Length of one unit of the item, in cm.
          nullable: true
        lotNumber:
          type: string
          description: Lot the product must be picked from. If not set, byrd picks by the FIFO principle.
          nullable: true
        pictureID:
          type: string
          format: uuid
          nullable: true
        variantID:
          type: string
          description: ID of the product variant in your shop system.
          nullable: true
        weight:
          type: number
          minimum: 0
          description: Weight of one unit of the item, in kg.
          nullable: true
        width:
          type: number
          minimum: 0
          description: Width of one unit of the item, in cm.
          nullable: true
        price:
          type: object
          properties:
            value:
              type: number
              description: Amount, as a string with two decimals separated by a dot.
            currency:
              type: string
              pattern: ^[A-Z]{3}$
              description: Currency (ISO 4217 code, e.g. `EUR`).
            taxFactor:
              type: number
              readOnly: true
              description: Tax factor of the price, for example `1.19` for 19% VAT; `null` when not set.
              nullable: true
          required:
          - currency
          - value
          description: Retail price of one unit, used for customs documents and insurance; multiplied by `amount` on customs documents.
          nullable: true
        dangerousGoods:
          readOnly: true
          description: Dangerous goods the product contains; `null` when it contains none.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItemDangerousGoods'
          nullable: true
        productID:
          type: string
          description: ID of the product in your shop system.
          nullable: true
      required:
      - amount
      title: Shipment item
    ShipmentItemDangerousGoods:
      type: object
      properties:
        UNNumber:
          type: string
          description: UN number identifying the dangerous good.
        quantity:
          type: number
          description: Quantity of the dangerous good in one unit of the product, in the unit defined for its UN number.
      required:
      - UNNumber
      - quantity
      additionalProperties: false
      title: Shipment item dangerous goods
    ItemsAnnounced:
