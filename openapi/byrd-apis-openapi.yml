        code:
          type: string
          description: Unique three-letter code of the warehouse.
          example: TST
        name:
          type: string
          description: Name of the warehouse.
        legalName:
          type: string
          readOnly: true
          description: Legal name of the company operating the warehouse; `null` when not set.
        displayName:
          type: string
          description: Name of the warehouse as shown in the byrd dashboard, usually based on its location.
        countryCode:
          type: string
          readOnly: true
          description: Country the warehouse is in (ISO 3166-1 alpha-2).
          example: DE
      required:
      - code
      - displayName
      - name
      title: Lot warehouse details warehouse
    LotUpdate:
