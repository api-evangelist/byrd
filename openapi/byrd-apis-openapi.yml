        grs:
          type: boolean
          default: false
          readOnly: true
          description: Whether the product complies with the Global Recycled Standard (GRS), as set on the product.
        required:
          type: boolean
          readOnly: true
          description: Whether the item has to be in the shipment for it to be sent; `false` for optional supplementary products, such as flyers, that can be left out.
        description:
          type: string
          description: Description of the product, used on customs documents; taken from the product when not sent.
          nullable: true
        sku:
