          additionalProperties: {}
        directComplete:
          type: boolean
          readOnly: true
          description: Whether the warehouse may use the simplified picking process for your shipments, skipping barcode scans when picking.
        brandingEnabled:
          type: boolean
          readOnly: true
          description: Whether the warehouse adds your branding items to all your shipments.
        localities:
