openapi: 3.0.0
info:
  description: The byrd APIs for managing products, inbound deliveries, shipments and returns.
  contact:
    email: info@getbyrd.com
    name: General company contact
    url: https://getbyrd.com/kontakt/
  license:
    name: Copyright byrd technologies GmbH
  termsOfService: https://getbyrd.com/agb/
  version: '20260924'
  title: byrd APIs
servers:
- description: Production server
  url: https://api.getbyrd.com/
security:
- tokenAuth: []
paths:
  /v2/auth:
    get:
      operationId: authapiv2_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Authentication
      description: 'Returns the account details of the user the access token was issued

        to.


        '
      summary: Get your own user
  /v2/b2b_config/{b2b_config_id}:
    get:
      operationId: b2bconfigapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/B2BConfigDetail'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Account
      description: 'Returns the B2B configuration of one of your B2B shipments with its

        template, translated into `lang` (English by default).'
      x-byrd-roles:
      - admin
      - customer
      - operator
      - warehouse_support
      - service
      parameters:
      - in: query
        name: lang
        description: Language of the translated template texts, as a two-letter code (ISO 639-1), e.g. `de`. Defaults to `en`; texts missing in that language are returned in English.
        schema:
          type: string
          default: en
          pattern: ^[A-Za-z]{2}$
          nullable: true
        required: false
      - name: b2b_config_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the B2B configuration (UUID).
      summary: Get a B2B configuration
  /v2/b2b_config_templates:
    get:
      operationId: b2bconfigtemplateapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/B2BConfigTemplate'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Account
      description: 'Returns the latest version of each B2B template enabled for your

        account, translated into `lang`, with the warehouses you can use it

        in. Use its `key`, `id` and `customerInputSchema` to create a B2B

        shipment; see the Listing B2B config templates guide.'
      x-byrd-roles:
      - admin
      - warehouse
      - customer
      - operator
      - customer_support
      - warehouse_support
      - service
      parameters:
      - in: query
        name: lang
        description: Language of the translated template texts, as a two-letter code (ISO 639-1), e.g. `de`. Defaults to `en`; texts missing in that language are returned in English.
        schema:
          type: string
          default: en
          pattern: ^[A-Za-z]{2}$
          nullable: true
        required: false
      - in: query
        name: user_id
        description: ID of the customer whose templates to list (UUID). Ignored for customers, who always get their own templates.
        schema:
          type: string
          format: uuid
          nullable: true
        required: false
      summary: List B2B templates
  /v2/export/user/{user_id}/returns:
    get:
      operationId: returnsexportapi_get
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Undefined'
      tags:
      - Account
      description: 'Returns a CSV file with one row per returned item of your returns

        whose shipment''s `range_type` date falls between `start_date` and

        `end_date`. Use your own user ID in the path.'
      x-byrd-roles:
      - admin
      - customer
      - operator
      - customer_support
      - service
      parameters:
      - in: query
        name: start_date
        description: First day of the export period (YYYY-MM-DD, inclusive). Defaults to 30 days before `end_date`. The period can be at most 365 days.
        schema:
          type: string
          format: date
        required: false
      - in: query
        name: end_date
        description: Last day of the export period (YYYY-MM-DD, inclusive). Defaults to today and cannot be in the future.
        schema:
          type: string
          format: date
        required: false
      - in: query
        name: range_type
        description: 'Shipment date that `start_date` and `end_date` apply to. Defaults to `returned-date`.


          - `returned-date`: when the shipment was returned

          - `shipped-date`: when the shipment was sent'
        schema:
          type: string
          default: returned-date
          enum:
          - returned-date
          - shipped-date
        required: false
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: ID of your byrd account (UUID); any other account answers `404`.
      summary: Export returns as CSV
  /v2/export/user/{user_id}/shipments:
    get:
      operationId: shipmentexportapi_get
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Undefined'
      tags:
      - Account
      description: 'Returns a CSV file with one row per item of your shipments whose

        `range_type` date falls between `start_date` and `end_date`. Use

        your own user ID in the path.'
      x-byrd-roles:
      - admin
      - customer
      - operator
      - customer_support
      - service
      parameters:
      - in: query
        name: start_date
        description: First day of the export period (YYYY-MM-DD, inclusive). Defaults to 30 days before `end_date`. The period can be at most 365 days.
        schema:
          type: string
          format: date
        required: false
      - in: query
        name: end_date
        description: Last day of the export period (YYYY-MM-DD, inclusive). Defaults to today and cannot be in the future.
        schema:
          type: string
          format: date
        required: false
      - in: query
        name: range_type
        description: 'Shipment date that `start_date` and `end_date` apply to. Defaults to `created-date`.


          - `created-date`: when the shipment was created

          - `packaged-date`: when the shipment was packed

          - `shipped-date`: when the shipment was sent

          - `returned-date`: when the shipment was returned'
        schema:
          type: string
          default: created-date
          enum:
          - returned-date
          - shipped-date
          - packaged-date
          - created-date
        required: false
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: ID of your byrd account (UUID); any other account answers `404`.
      summary: Export shipments as CSV
  /v2/login:
    post:
      operationId: loginapiv2_post
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - token
                - payload
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
                allOf:
                - $ref: '#/components/schemas/LoginResponse'
          description: 'The access token and its decoded payload, sent twice with the same values: at the top level, for older clients, and under `data`.

            '
        '400':
          $ref: '#/components/responses/Error'
      tags:
      - Authentication
      description: 'Exchanges your API key and secret, or your dashboard email and

        password, for a JWT access token, valid for 7 days unless you ask

        for less. Send the token as

        `Authorization: Bearer <token>` on every other call. The endpoint

        allows at most five calls per minute, so reuse the token until it

        expires. See the Authentication guide.


        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostLogin'
      security: []
      summary: Log in and get an access token
  /v2/refresh_token:
    post:
      operationId: refreshtokenapi_post
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - token
                - payload
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
                allOf:
                - $ref: '#/components/schemas/LoginResponse'
          description: 'The access token and its decoded payload, sent twice with the same values: at the top level, for older clients, and under `data`.

            '
        '400':
          $ref: '#/components/responses/Error'
      tags:
      - Authentication
      description: 'Exchanges an access token that is still valid for a new one for the

        same user, valid for 7 days. Fails when the account is locked.


        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRefreshToken'
      security: []
      summary: Refresh an access token
  /v2/returns:
    get:
      operationId: returnshipmentlistapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReturnShipment'
                - $ref: '#/components/schemas/PaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns the courier and customer returns of your shipments, newest

        first unless you sort otherwise, filtered by the query parameters.

        See the Listing returns guide for the meaning of `returnType`,

        `reason` and the item `condition`.'
      x-byrd-roles:
      - admin
      - warehouse
      - customer
      - operator
      - customer_support
      - warehouse_support
      - service
      parameters:
      - in: query
        name: shipment_id
        description: Only include returns of the shipment with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: status
        description: 'Only include returns in one of these statuses: `announced`, `confirmed`, `cancelled`. Cancelled returns are never shown to customer accounts.'
        schema:
          type: array
          items:
            type: string
            enum:
            - announced
            - confirmed
            - cancelled
        required: false
        explode: false
        style: form
      - in: query
        name: date_field
        description: 'Date field `date_from` and `date_to` apply to. Defaults to `createdAt`.


          - `createdAt`: when the return was created

          - `updatedAt`: when the return was last changed

          - `announcedAt`: when the return was announced

          - `postedAt`: when the parcel was handed to the carrier

          - `deliveredAt`: when the return arrived at the warehouse

          - `processedAt`: when the warehouse checked the items'
        schema:
          type: string
          default: createdAt
          enum:
          - updatedAt
          - postedAt
          - deliveredAt
          - processedAt
          - announcedAt
          - createdAt
        required: false
      - in: query
        name: date_from
        description: Only include returns whose `date_field` is at or after this time (ISO 8601, UTC), e.g. `2023-03-23T16:00:03Z`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: date_to
        description: Only include returns whose `date_field` is before this time (ISO 8601, UTC), e.g. `2023-03-23T16:00:03Z`. Must be after `date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: parcel_id
        description: Only include returns of the shipment with this parcel ID, or of the shipment unit with this parcel ID.
        schema:
          type: string
        required: false
      - in: query
        name: reason
        description: Only include returns with one of these reasons. See `reason` in the response for the values.
        schema:
          type: array
          items:
            type: string
            enum:
            - bad-address
            - bad-product
            - country
            - no-pickup
            - rec-unknown
            - refused-delivery
            - unwanted
            - customer
        required: false
        explode: false
        style: form
      - in: query
        name: carrier
        description: Only include returns shipped with this carrier, as a carrier identifier such as `dhl_de`.
        schema:
          type: string
        required: false
      - in: query
        name: carrier_tracking_number
        description: Only include returns with this carrier tracking number.
        schema:
          type: string
        required: false
      - in: query
        name: user_ids
        description: Only include returns of shipments owned by these users (UUIDs). As a customer you only get your own returns.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: customer_name
        description: Only include returns whose original shipment recipient name or company contains this text (case-insensitive).
        schema:
          type: string
        required: false
      - in: query
        name: product_sku
        description: Only include returns with a received item of this SKU.
        schema:
          type: string
        required: false
      - in: query
        name: product_id
        description: Only include returns with a received item of the product with this ID (UUID).
        schema:
          type: string
        required: false
      - in: query
        name: type
        description: 'Only include returns of this type: `courier` or `customer`.'
        schema:
          type: string
          enum:
          - courier
          - customer
        required: false
      - in: query
        name: manual_search_required
        description: Only include returns for which the warehouse had (`true`) or had not (`false`) to search manually for the original shipment.
        schema:
          type: boolean
        required: false
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: List returns
  /v2/returns/{return_id}:
    get:
      operationId: returnshipmentdetailapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnShipment'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns one of your returns with its original shipment and the

        announced and received items.'
      x-byrd-roles:
      - admin
      - warehouse
      - customer
      - operator
      - customer_support
      - warehouse_support
      - service
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the return (UUID).
      summary: Get a return
  /v2/users/{user_id}:
    patch:
      operationId: userapiv2_patch
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
          description: 'The request set `status` on a user who is not a customer. Only customer accounts carry one.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - User.Update.Invalid.Status
        '401':
          description: 'The request changed a field the caller''s role may not write - `isStaff`, `v3CarrierSelector` or `status`. The offending field is named in `extra.field`.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - User.Update.Permission.Insufficient
        '403':
          $ref: '#/components/responses/Error'
        '422':
          description: 'The request mentioned `isDemo`, which is set when the account is created and cannot be changed afterwards.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - User.Update.Immutable.IsDemo
      tags:
      - Authentication
      description: 'Changes only the fields you send; read-only fields cannot be changed.

        A customer account must keep a phone number.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      x-byrd-roles:
      - sales
      - admin
      - warehouse
      - scoped_admin
      - customer
      - operator
      - customer_support
      - warehouse_support
      - service
      x-byrd-permissions:
        type: permission
        name: user:write
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: ID of your byrd account (UUID); any other account answers `404`.
      summary: Update your account details
  /v2/warehouse/dangerous-goods-limits:
    get:
      operationId: dangerousgoodsunitlimitsapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DangerousGoodsLimits'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns the UN numbers byrd can ship and the maximum quantity of

        each a single product may contain. Use them in the `dangerousGoods`

        of your products.'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      summary: List the supported dangerous goods
  /v2/warehouse/deliveries:
    get:
      operationId: deliveriesapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/DeliveryWithMetrics'
                - $ref: '#/components/schemas/PaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Returns your deliveries, the inbound shipments of stock you send to a

        warehouse, with their items, containers and metrics. Filter them with

        the query parameters and use `only` to return fewer fields. See

        [Listing deliveries](https://developers.getbyrd.com/docs/listing-deliveries).'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: include_deleted
        description: Whether to include cancelled deliveries. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: include_items
        description: Whether to include `deliveryItems` in each delivery. Defaults to `true`; set it to `false` for faster responses when deliveries have many items.
        schema:
          type: boolean
          default: true
        required: false
      - in: query
        name: include_containers
        description: Whether to include `deliveryContainers` in each delivery. Defaults to `true`.
        schema:
          type: boolean
          default: true
        required: false
      - in: query
        name: product_ids
        description: Only deliveries that contain at least one of these products (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_ids
        description: Only deliveries to these warehouses (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: status
        description: Only deliveries in one of these statuses (see `status`).
        schema:
          type: array
          items:
            type: string
            enum:
            - announced
            - atWarehouse
            - inProcessing
            - completed
            - deleted
        required: false
        explode: false
        style: form
      - in: query
        name: user_id
        description: Only deliveries of this user (UUID). Cannot be combined with `user_ids`. You only ever see your own deliveries.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: user_ids
        description: Only deliveries of these users (UUIDs). Cannot be combined with `user_id`. You only ever see your own deliveries.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: type
        description: 'Only deliveries of this type.


          - `container`: deliveries arriving in a shipping container

          - `regular`: all other deliveries'
        schema:
          type: string
          enum:
          - container
          - regular
        required: false
      - in: query
        name: sku
        description: Only deliveries that contain the product with this SKU.
        schema:
          type: string
        required: false
      - in: query
        name: barcode
        description: Only deliveries that contain a product with this barcode, either its main barcode or one of its additional barcodes.
        schema:
          type: string
        required: false
      - in: query
        name: first_inbound_only
        description: Whether to return only the first delivery inbounded into each warehouse, per customer. Deliveries that were never inbounded are left out; deliveries inbounded at the same earliest time are all returned. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: colli_discrepancy
        description: Whether to return only deliveries where the number of boxes and pallets counted on arrival differs from the number of containers announced. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: sort_by
        description: 'Field to sort the deliveries by: `createdAt`, `updatedAt`, `expectedDeliveryDateFrom`, `atWarehouseDateTime`, `inProcessingDateTime`, `inboundedDateTime`, `inboundingDeadline` or `aggregatedContainerStatus`.'
        schema:
          type: string
        required: false
      - in: query
        name: sort_order
        description: 'Sort direction.


          - `asc`: ascending

          - `desc`: descending'
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
      - in: query
        name: aggregated_container_status
        description: Only deliveries with this tracking status (see `aggregatedContainerStatus`). `pick_up` also matches deliveries that are not tracked.
        schema:
          type: string
          enum:
          - partially_delivered
          - pick_up
          - in_transit
          - out_for_delivery
          - delivered
          - delayed
          - failed_delivery
          - null
          nullable: true
        required: false
      - in: query
        name: date_field
        description: 'Date field that `date_from` and `date_to` filter on. Defaults to `created_at`.


          - `created_at`: when the delivery was announced

          - `at_warehouse_at`: when the warehouse accepted it

          - `inbounded_at`: when it was completed

          - `status_updated_at`: when its status last changed'
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - at_warehouse_at
          - inbounded_at
          - status_updated_at
        required: false
      - in: query
        name: date_from
        description: Only deliveries whose `date_field` is at or after this time (ISO 8601, UTC). Must be before `date_to`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: date_to
        description: Only deliveries whose `date_field` is before this time (ISO 8601, UTC).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: only
        description: Fields to return, as comma-separated dotted paths, for example `id,status,deliveryItems.product.sku`. All fields are returned when omitted.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: List deliveries
    post:
      operationId: deliveriesapi_post
      responses:
        '201':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
