        total_items:
          type: string
          readOnly: true
          description: Number of physical items in the shipment; the contents of bundles are counted, the bundles themselves are not.
        total_non_branding_items:
          type: string
          readOnly: true
          description: Number of physical items in the shipment, not counting branding products such as flyers or stickers.
        total_skus:
          type: string
          readOnly: true
          description: Number of distinct products in the shipment, not counting bundles.
        total_pick_items:
          type: string
          readOnly: true
          description: Number of items the warehouse takes off the shelf; a packaging unit counts as one item. 0 until stock is allocated.
      title: Shipment list metrics
    ShipmentListOptions:
      type: object
      properties:
        branding:
          type: boolean
          default: null
          description: Whether the shipment is packed with your branded packaging material; defaults to your account setting.
          nullable: true
        packaging:
          type: boolean
          default: null
          description: Whether the warehouse packs the items in packaging material; defaults to your account setting.
          nullable: true
        custom_handling:
          type: boolean
          default: false
          description: Whether the shipment is held for custom handling at the warehouse; it cannot be packed while this is `true`. Read-only for you.
          nullable: true
        auto_release:
          type: boolean
          default: null
          description: Whether the shipment is released to a warehouse automatically once it is created; if `false` or not sent, it normally stays `new` until you release it.
          nullable: true
        preferred_carrier:
          type: string
          default: null
          description: Carrier to send the shipment with, instead of the one byrd selects; see the list of carriers. Use it with caution, as a carrier that cannot serve the shipment leads to shipment errors.
          nullable: true
        incoterm:
          type: string
          default: null
          description: 'Incoterm passed to the carrier for international shipments.


            - `DAP`: delivered at place; the recipient pays import duties and taxes (default)

            - `DDP`: delivered duty paid; you pay them'
          nullable: true
        charge:
          type: string
          readOnly: true
          description: Whether byrd charges you for the shipment.
        fragile:
          type: boolean
          readOnly: true
          description: Whether the shipment contains at least one fragile product.
        organic:
          type: boolean
          readOnly: true
          description: Whether the shipment contains at least one organic product.
        grs:
          type: boolean
          readOnly: true
          description: Whether the shipment contains at least one product that complies with the Global Recycled Standard (GRS).
        create_return_label:
          type: boolean
          readOnly: true
          description: Whether a return label is created for each parcel when the shipment is released; send it together with `print_return_label`.
        print_return_label:
          type: boolean
          readOnly: true
          description: Whether the return label is printed and packed with the shipment; requires `create_return_label` to be `true`, and has to be sent together with it.
        economy_fallback:
          type: boolean
          readOnly: true
          description: Whether the shipment is sent with the `standard` service when `economy` is not available for it; set on your account.
        not_before_date:
          type: string
          format: date-time
          readOnly: true
          description: Earliest date the shipment may be sent (ISO 8601, at midnight); `null` when there is no such date.
        not_later_date:
          type: string
          format: date-time
          readOnly: true
          description: Latest date and time the shipment has to be sent by (ISO 8601); `null` when not set.
        pickup_date:
          type: string
          format: date
          readOnly: true
          description: Date the carrier collects the shipment (ISO 8601), for B2B shipments; `null` when not scheduled.
        international:
          type: boolean
          default: null
          description: Whether the shipment needs a customs declaration because it crosses a customs border; `null` until the shipment is released.
          nullable: true
        has_dangerous_goods:
          type: boolean
          readOnly: true
          description: Whether the shipment contains at least one item classified as dangerous goods.
        v3_packaging:
          type: boolean
          readOnly: true
          description: Whether the warehouse packs the shipment with the v3 packing process.
        requires_export_declaration:
          type: string
          readOnly: true
          description: Whether the shipment has to carry an export declaration; always `false` before the shipment is released.
        slam_compatible:
          type: string
          readOnly: true
          description: Whether the warehouse can pack the shipment on its automated labelling line; `null` until the shipment is released.
        autobag_compatible:
          type: string
          readOnly: true
          description: Whether the warehouse can pack the shipment with its automatic bagging machine.
        expired_stock_allowed:
          type: boolean
          readOnly: true
          description: Whether the shipment may be fulfilled with expired stock; defaults to `false`.
        pickup_date_from:
          type: string
          format: date
          readOnly: true
          description: First day of the window in which the shipment will be collected (ISO 8601), for B2B shipments; set with the schedule pickup endpoint.
        pickup_date_to:
          type: string
          format: date
          readOnly: true
          description: Last day of the window in which the shipment will be collected (ISO 8601), for B2B shipments; set with the schedule pickup endpoint.
        self_pickup_by_customer:
          type: boolean
          readOnly: true
          description: Whether you collect the shipment from the warehouse yourself instead of a carrier, for B2B shipments; set with the schedule pickup endpoint.
        shipping_label_mode:
          type: string
          readOnly: true
          description: 'How the shipping label is obtained.


            - `auto`: byrd creates it with the carrier

            - `manual`: byrd uploads it, for example for `pickup` shipments'
      title: Shipment list options
    ShipmentListUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the unit (UUID).
        items:
          description: Products packed in the unit; empty for units packed before items were recorded per unit.
          type: array
          items:
            $ref: '#/components/schemas/UnitItem'
        service:
          type: string
          description: 'Shipping service the unit is sent with; usually the shipment''s `service`, but it can differ when an economy fallback applies.


            - `standard`

            - `express`

            - `economy`

            - `pickup_point`

            - `pickup`

            - `amazon_prime`'
        carrier:
          description: Carrier the unit is sent with and its tracking details; the fields are `null` until a label is created.
          allOf:
          - $ref: '#/components/schemas/Carrier'
        parcel_id:
          type: string
          readOnly: true
          description: Unique 10-character alphanumeric identifier of the unit.
          example: A1B2C3D4E5
        type:
          type: string
          readOnly: true
          description: 'Kind of unit.


            - `parcel`: a parcel

            - `pallet`: a pallet'
        status:
          type: string
          readOnly: true
          description: 'Current status of the unit.


            - `new`: created and not yet packed and labelled

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: being returned to the warehouse

            - `returned`: the return arrived at the warehouse'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `label_error`, `error_resolved`: creating the label failed, or the failure was fixed; while `new` or `packaged`

            - `slam_ready`, `autobag_failed`: waiting for the SLAM machine, or the bagging machine failed; while `new`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `waiting_for_pickup`, `manual_outbound`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`'
        label_error_status:
          type: string
          readOnly: true
          description: 'Who byrd is waiting on to resolve the unit''s label error; `null` when there is no error or it has not been looked at yet.


            - `waiting_for_customer`: you have to fix or confirm something, such as the address or customs data

            - `waiting_for_warehouse`: the warehouse has to check the parcel

            - `waiting_for_carrier`: the carrier has to respond or fix something

            - `waiting_for_pricing`, `waiting_for_procurement`, `waiting_for_operations`, `waiting_for_engineering`: a byrd team has to act

            - `waiting_for_deletion`: the error will not be fixed and the unit will be deleted'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the unit has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/ShipmentUnitCheckpoint'
        errors:
          readOnly: true
          description: Errors blocking the unit, such as a failed label creation; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        error_code:
          type: string
          readOnly: true
          description: Code of the error currently blocking the unit, for example `LC00` for a carrier error; `null` when there is none.
        slam:
          type: boolean
          readOnly: true
          description: Whether the unit is measured and labelled by a SLAM (scan, label, apply, manifest) machine.
        autobag:
          type: boolean
          readOnly: true
          description: Whether the unit is packed by an automatic bagging machine.
        dimensions:
          description: Outer dimensions (cm) and weight (kg) of the packed unit.
          allOf:
          - $ref: '#/components/schemas/UnitDimensions'
        pregenerated:
          type: boolean
          readOnly: true
          description: Whether the unit and its shipping label were created in advance, before packing.
        packaging_materials:
          description: Packaging materials the unit was packed with.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterials'
          nullable: true
        group_number:
          type: integer
          readOnly: true
          description: Number of the packing station group whose printer printed the unit's label; `null` until the unit is labelled.
        sequence_number:
          type: string
          readOnly: true
          description: Position of the unit among the shipment's units, starting at 1.
        metrics:
          readOnly: true
          description: Item and pick counts for the unit; `null` for units without recorded items.
          allOf:
          - $ref: '#/components/schemas/UnitMetrics'
      title: Shipment list unit
    ShipmentShop:
      type: object
      properties:
        id:
          type: string
          description: ID of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        type:
          type: string
          description: Type of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        order_number:
          type: string
          description: Order number in your shop or order system, shown in the Order column of the dashboard.
        order_id:
          type: string
          description: Any other identifier of the order in your system; not shown in the dashboard.
        marketplace_order_number:
          type: string
          description: Order number given by the marketplace the order was sold on, when that is not the system sending the shipment, for example the Amazon order number of an order forwarded by a connected shop. Returns are labelled with it, which lets the warehouse match a return to the shipment; send it in addition to `order_number` and `order_id`.
          nullable: true
        marketplace:
          type: string
          description: Marketplace that `marketplace_order_number` belongs to, in lower case, for example `amazon`, `ebay` or `kaufland`. If you cannot tell it reliably, leave it out rather than guess.
          nullable: true
      title: Shipment shop
    ShipmentUnitCheckpoint:
      type: object
      properties:
        packaged_at:
          type: string
          format: date-time
          description: When the warehouse packed the unit.
        accepted_at:
          type: string
          format: date-time
          description: When the carrier first scanned the unit.
        delivered_at:
          type: string
          format: date-time
          description: When the carrier delivered the unit to the recipient.
        sent_at:
          type: string
          format: date-time
          description: When the unit left the warehouse.
      title: Shipment unit checkpoint
    ShipmentUnitDetailError:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        code:
          type: string
          description: Machine-readable code of the problem, for example `Warehouse.Shipments.Recalled.Warning`.
        message:
          type: string
          description: Human-readable explanation of the problem.
        extra:
          type: object
          description: Additional details about the problem, such as the IDs or values involved; the keys depend on `code`.
          additionalProperties: {}
        errors:
          type: array
          description: Underlying errors that caused this one, in the same format.
          items:
            type: object
            additionalProperties: {}
      title: Shipment unit detail error
    ShipmentUser:
      type: object
      properties:
        company_name:
          type: string
          description: Company name of the byrd account.
        first_name:
          type: string
          description: First name of the byrd account holder.
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the byrd account (UUID).
        last_name:
          type: string
          description: Last name of the byrd account holder.
        sender_name:
          type: string
          description: Sender name printed on shipping labels and used in tracking emails; if empty, `company_name` is used.
      title: Shipment user
    ShipmentWarehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the warehouse (UUID); `null` until a warehouse is assigned.
        code:
          type: string
          description: Short code of the warehouse.
        name:
          type: string
          description: Display name of the warehouse.
      additionalProperties: false
      title: Shipment warehouse
    UnitDimensions:
      type: object
      properties:
        height:
          type: number
          minimum: 1
          description: Height of the packed unit in cm; at least 1.
        width:
          type: number
          minimum: 1
          description: Width of the packed unit in cm; at least 1.
        length:
          type: number
          minimum: 1
          description: Length of the packed unit in cm; at least 1.
        weight:
          type: number
          minimum: 0.01
          description: Weight of the packed unit in kg; at least 0.01.
      title: Unit dimensions
    UnitItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the unit item (UUID).
        packaging_unit_id:
          type: string
          description: ID of the packaging unit the product was packed in (UUID); `null` when it was packed as single selling units.
          nullable: true
        product:
          readOnly: true
          description: Product packed in the unit.
          allOf:
          - $ref: '#/components/schemas/UnitProduct'
        custom_bundle_id:
          type: string
          format: uuid
          description: ID of the custom bundle the item belongs to (UUID); `null` when it is not part of one.
        product_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the product packed in the unit (UUID).
          nullable: true
        serial_numbers:
          type: array
          description: Serial numbers of the packed items, one for each item; `null` for products without serial number tracking.
          items:
            type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
          nullable: false
          description: Number packed, in packaging units when `packaging_unit_id` is set; at least 1.
      required:
      - quantity
      additionalProperties: false
      title: Unit item
    UnitMetrics:
      type: object
      properties:
        total_items:
          type: integer
          description: Number of physical items in the unit, with packaging units counted by their contents.
        total_skus:
          type: integer
          description: Number of distinct products in the unit.
        total_multi_picks:
          type: integer
          description: Number of packaging units in the unit.
        total_single_picks:
          type: integer
          description: Number of single selling units in the unit, not counting packaging units and branding products.
        total_organic_picks:
          type: integer
          description: Number of organic products in the unit.
        total_grs_picks:
          type: integer
          description: Number of GRS (Global Recycled Standard) certified products in the unit.
        total_fragile_picks:
          type: integer
          description: Number of fragile products in the unit.
        total_branding_picks:
          type: integer
          description: Number of branding products, such as flyers or stickers, in the unit.
        total_serial_numbers:
          type: integer
          description: Number of serial numbers recorded for the unit.
        total_dangerous_goods:
          type: integer
          description: Number of dangerous goods products in the unit.
      title: Unit metrics
    UnitProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the product (UUID).
        name:
          type: string
          readOnly: true
          description: Name of the product.
        sku:
          type: string
          readOnly: true
          description: Stock keeping unit (SKU) of the product, unique in your account.
        barcodes:
          readOnly: true
          description: All barcodes of the product.
          type: array
          items:
            $ref: '#/components/schemas/ProductBarcode'
        serial_number_enabled:
          type: boolean
          readOnly: true
          description: Whether serial numbers of the product are recorded when it is shipped.
      title: Unit product
    Child:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
          description: ID of the byrd product to ship (UUID); send it or `sku`. `null` for custom bundles.
          nullable: true
        shop_product_id:
          type: string
          description: ID of the product in your shop or order system; not necessarily a UUID.
          nullable: true
        quantity:
          type: integer
          minimum: 1
          description: Number of units to ship; at least 1. For items of a custom bundle, the number per bundle.
        name:
          type: string
          description: Name of the product; replaced by the name stored on the product. Required for custom bundles and their items.
          nullable: true
        price:
          type: object
          properties:
            value:
              type: number
              description: Amount in `currency`, with a dot as decimal separator.
            currency:
              type: string
              pattern: ^[A-Z]{3}$
              description: Currency of `value` (ISO 4217), for example `EUR`.
            tax_factor:
              type: number
              description: Tax factor of the price; `1.0` on item prices and `null` elsewhere. Ignored on input.
              nullable: true
          required:
          - currency
          - value
          description: Retail price of one unit, used for customs documents and insurance; it is multiplied by `quantity`. Required for custom bundles.
          nullable: true
        dimensions:
          type: object
          properties:
            height:
              type: number
              minimum: 0.1
              description: Height in cm; `null` when unknown.
              nullable: true
            width:
              type: number
              minimum: 0.1
              description: Width in cm; `null` when unknown.
              nullable: true
            length:
              type: number
              minimum: 0.1
              description: Length in cm; `null` when unknown.
              nullable: true
            weight:
              type: number
              minimum: 0.001
              description: Weight in kg; `null` when unknown.
              nullable: true
          description: Dimensions and weight of one unit of the product; missing values are taken from the product, and the weight stored on the product always replaces the one sent.
          nullable: true
        customs:
          type: object
          properties:
            origin_country_code:
              type: string
              pattern: ^[A-Z]{2}$
              description: Country the product was made in (ISO 3166-1 alpha-2), for example `CN`.
              nullable: true
            hs_tariff_number:
              type: string
              description: 'Harmonized System (HS) tariff number of the product: 6, 8 or 10 digits.'
              nullable: true
          additionalProperties: false
          description: Customs details of the product, needed for shipments leaving the EU or the UK; taken from the product when not sent.
          nullable: true
        lot_number:
          type: string
          description: Lot the units have to be picked from; if not sent, byrd chooses lots first in, first out (FIFO).
          nullable: true
        description:
          type: string
          description: Description of the product, used on customs documents; taken from the product when not sent.
          nullable: true
        sku:
          type: string
          description: SKU of the byrd product to ship; send it or `product_id`. Required for custom bundles, where it has to be unique within the shipment.
          nullable: true
        serial_number_tracked:
          type: boolean
          description: Whether serial numbers are recorded for the item when it is packed; set from the serial number setting of the product.
          nullable: true
        type:
          type: string
          description: 'Type of item.


            - `product`: a single product (default)

            - `bundle`: a bundle product set up in byrd

            - `custom_bundle`: products packed together, listed in `children`

            - `supplement`: a supplementary product, such as a flyer, added because it is linked to another product in the shipment'
          nullable: true
      required:
      - quantity
      title: Child
    ItemInput:
