          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns the units (parcels and pallets) of your shipments, newest

        first by default, one page at a time. Filter by `shipment_id` to page

        through the units of a shipment that has too many to read from the

        shipment itself.'
      x-byrd-roles:
      - customer
      - service
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: ids
        description: Only return these units, by ID (comma-separated).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: shipment_id
        description: Only return units of these shipments, by ID (comma-separated). Use it to page through the units of a shipment with many units.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: parcel_id
        description: Only return the unit with this parcel ID.
        schema:
          type: string
          minLength: 1
          maxLength: 10
        required: false
      - in: query
        name: status
        description: Only return units with one of these statuses (comma-separated).
        schema:
          type: array
          items:
            type: string
            enum:
            - new
            - packaged
            - sent
            - delivered
            - returning
            - returned
        required: false
        explode: false
        style: form
      - in: query
        name: sub_status
        description: Only return units with one of these sub-statuses (comma-separated). Requires `status`, and each sub-status must be possible for at least one of the given statuses.
        schema:
          type: array
          items:
            type: string
            enum:
            - at_pickup_point
            - autobag_failed
            - delayed
            - error_resolved
            - failed_delivery
            - fba_box_label_required
            - fba_details_required
            - fba_pallet_label_required
            - in_transit
            - label_created
            - label_error
            - label_required
            - label_uploaded
            - manual_outbound
            - out_for_delivery
            - pick_up
            - pickup_details_required
            - pickup_details_uploaded
            - slam_ready
            - waiting_for_pickup
        required: false
        explode: false
        style: form
      - in: query
        name: ignore_slam_errors
        description: Whether to leave out units blocked by an error of a SLAM machine.
        schema:
          type: boolean
        required: false
      - in: query
        name: label_error_status
        description: Only return units whose label error has one of these triage statuses (comma-separated); `untriaged` selects label errors not looked at yet. See `label_error_status` in the response for the values.
        schema:
          type: array
          items:
            type: string
            enum:
            - waiting_for_pricing
            - waiting_for_procurement
            - waiting_for_customer
            - waiting_for_warehouse
            - waiting_for_operations
            - waiting_for_engineering
            - waiting_for_carrier
            - waiting_for_deletion
            - untriaged
        required: false
        explode: false
        style: form
      - in: query
        name: min_age
        description: 'Only return units at least this old, measured from their creation: a positive whole number followed by `h` (hours), `d` (days), `w` (weeks) or `m` (30 days), for example `2d`.'
        schema: {}
        required: false
      - in: query
        name: max_age
        description: Only return units at most this old. Same format as `min_age`.
        schema: {}
        required: false
      - in: query
        name: custom_handling
        description: Only return units whose shipment is (`true`) or is not (`false`) custom-handled.
        schema:
          type: boolean
        required: false
      - in: query
        name: is_demo
        description: Only return units whose shipment belongs (`true`) or does not belong (`false`) to a demo account.
        schema:
          type: boolean
        required: false
      - in: query
        name: user_id
        description: Only return units of shipments of these byrd accounts, by ID (comma-separated). For customers, always their own account.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_id
        description: Only return units of shipments fulfilled by these warehouses, by ID (comma-separated).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: sort_by
        description: 'Field to sort by. Defaults to `created_at`.


          - `created_at`

          - `updated_at`

          - `label_error_occurred`'
        schema:
          type: string
        required: false
      - in: query
        name: sort_order
        description: Sort direction, `asc` or `desc`. Defaults to `desc`.
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
      - in: query
        name: include_deleted
        description: Whether to include deleted units. Defaults to `false`; always `false` for customers.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: only
        description: Comma-separated dotted paths of the fields to return, for example `id,status,items`.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      summary: List units
