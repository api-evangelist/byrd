          description: ID of the shipment the pick is for (UUID).
        warehouse_id:
          type: string
          format: uuid
          description: ID of the warehouse fulfilling the shipment (UUID).
        zones:
          description: Warehouse zones the storage location belongs to; only returned when requested with `only`.
          type: array
          items:
            $ref: '#/components/schemas/StorageZone'
      title: Pick
    PickPackagingUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the packaging unit (UUID).
        quantity:
          type: integer
          description: Number of selling units the packaging unit holds; at least 2.
        barcode_type:
          description: 'Type of the packaging unit''s barcode; required when a barcode value is given.


            - `ean_13`

            - `code_128`

            - `gs1_128`

            - `qr_code`'
          type: string
          enum:
          - ean_13
          - code_128
          - gs1_128
          - qr_code
        barcode_value:
          type: string
          description: Barcode printed on the packaging unit; at most 48 characters.
      title: Pick packaging unit
    PickProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the product (UUID).
        name:
          type: string
          description: Name of the product.
        sku:
          type: string
          description: Stock keeping unit (SKU) of the product, unique in your account.
        barcode:
          type: string
          description: Primary barcode of the product; see `barcodes` for all of them.
        barcodes:
          readOnly: true
          description: All barcodes of the product.
          type: array
          items:
            $ref: '#/components/schemas/ProductBarcode'
        type:
          type: string
          description: 'Type of the product.


            - `product`

            - `alias`

            - `supplementary`

            - `marketing`

            - `branding`

            - `packaging_material`

            - `prepacked_product`

            - `bundle`'
        serial_number_enabled:
          type: boolean
          readOnly: true
          description: Whether serial numbers of the product are recorded when it is shipped.
        serial_number_regex:
          type: string
          readOnly: true
          description: Regular expression the product's serial numbers must match; `null` when any value is accepted.
          nullable: true
        inventory_serial_number_enabled:
          type: boolean
          readOnly: true
          description: Whether serial numbers of the product are tracked in stock, not only when shipping.
      title: Pick product
    PickStorage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the storage (UUID).
        bsid:
          type: string
          description: 'byrd storage ID: the unique code of the storage.'
        lot:
          description: Lot stored in the storage; `null` for products without lot tracking.
          allOf:
          - $ref: '#/components/schemas/PickStorageLot'
        shelf_identifier:
          type: string
          description: Identifier of the shelf the storage is on, for example `SH-MS-10`.
        type:
          type: integer
          description: 'Type of the storage location.


            - `10`: pallet

            - `20`: shelf

            - `0`: legacy store location, no longer used'
        location_id:
          type: string
          format: uuid
          description: ID of the storage location (UUID), as shown in the QR code on the location label.
        blocked_at:
          type: string
          format: date-time
          description: When the storage was blocked (ISO 8601, UTC); `null` when it is not blocked.
      title: Pick storage
    PickStorageLot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the lot (UUID).
        lot_number:
          type: string
          description: Lot (batch) number the product was picked from.
        expiry_date:
          type: string
          description: Date the lot expires (ISO 8601 date, `YYYY-MM-DD`); `null` when the lot has no expiry date.
          example: '2024-12-31'
      title: Pick storage lot
    StorageZone:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the warehouse zone (UUID).
        identifier:
          type: string
          description: Identifier of the warehouse zone.
      title: Storage zone
    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the reservation (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        quantity:
          type: integer
          description: Number of selling units reserved.
        lot_id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the lot the stock is reserved from (UUID); `null` when no specific lot is reserved.
        product:
          description: Product the stock is reserved for.
          allOf:
          - $ref: '#/components/schemas/ReservationProduct'
        shipment_id:
          type: string
          format: uuid
          description: ID of the shipment the stock is reserved for (UUID).
        warehouse_id:
          type: string
          format: uuid
          description: ID of the warehouse the stock is reserved in (UUID).
      title: Reservation
    ReservationProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the product (UUID).
        name:
          type: string
          description: Name of the product.
        sku:
          type: string
          description: Stock keeping unit (SKU) of the product, unique in your account.
        type:
          type: string
          description: 'Type of the product.


            - `product`

            - `alias`

            - `supplementary`

            - `marketing`

            - `branding`

            - `packaging_material`

            - `prepacked_product`

            - `bundle`'
      title: Reservation product
    ReturnShipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        shipment:
          readOnly: true
          description: Original shipment the return belongs to.
          allOf:
          - $ref: '#/components/schemas/ReturnedShipment'
        shipmentID:
          type: string
          format: uuid
          description: ID of the original shipment (UUID).
        unitID:
          type: string
          format: uuid
          description: ID of the shipment unit (parcel) that came back (UUID); set for courier returns only.
          nullable: true
        unit:
          readOnly: true
          description: Shipment unit (parcel) that came back; `null` when the return is not linked to a unit.
          allOf:
          - $ref: '#/components/schemas/ReturnShipmentUnit'
        status:
          type: string
          enum:
          - announced
          - confirmed
          - cancelled
          readOnly: true
          description: 'Current status of the return.


            - `announced`: announced by the recipient, not received yet

            - `confirmed`: received and confirmed by the warehouse

            - `cancelled`: a confirmed return that was cancelled; not included in your results'
        returnType:
          type: string
          enum:
          - courier
          - customer
          description: 'Who initiated the return.


            - `courier`: the carrier could not deliver the shipment and sent it back, e.g. because of a wrong address or failed delivery attempts

            - `customer`: the recipient sent items back, e.g. because they were defective or unwanted'
        reason:
          type: string
          description: 'Why the shipment was returned. Customer returns always have `customer`; the reasons per item are in `itemsAnnounced`.


            - `bad-address`: the address was wrong or incomplete

            - `bad-product`: the product was defective, damaged or not as expected

            - `country`: shipping restrictions or customs rules of the destination country

            - `no-pickup`: the recipient did not collect the parcel where the courier held it

            - `rec-unknown`: the recipient is unknown at the address

            - `refused-delivery`: the recipient refused the delivery

            - `unwanted`: the recipient no longer wanted the items

            - `customer`: a return announced by the recipient'
        manualSearchRequired:
          type: boolean
          description: Whether the warehouse had to search manually to find the original shipment of the return.
        internalComments:
          type: string
          description: Notes the warehouse recorded while processing the return.
        publicComments:
          type: string
          description: Comments of the warehouse about the return, meant for you; empty when there are none.
        courierFee:
          description: Fee charged for accepting the return from the courier; `null` when there is none.
          allOf:
          - $ref: '#/components/schemas/TotalPrice'
        items:
          description: Items the warehouse received and checked, with their condition; empty until the return is processed.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentItem'
        itemsAnnounced:
          readOnly: true
          description: Items announced for return, with quantity and reason, before the warehouse checked them; empty when the return was not announced.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentItemAnnounced'
        sendDocumentsToEmail:
          type: string
          format: email
          readOnly: true
          description: Email address the return label was sent to; `null` when no label was sent.
        documents:
          readOnly: true
          description: Documents generated for the return, such as the return label. Usually empty right after announcing, as they are generated asynchronously.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentDocument'
        courier:
          type: string
          readOnly: true
          description: Carrier the return is shipped with, as a carrier identifier such as `dhl_de`; `null` when unknown.
        courierTrackingNumber:
          type: string
          readOnly: true
          description: Tracking number of the return parcel at the carrier; `null` when unknown.
        courierTrackingURL:
          type: string
          readOnly: true
          description: Carrier tracking page of the return parcel; `null` when unknown.
        announcedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the return was announced (ISO 8601, UTC); `null` for returns that were not announced, such as courier returns.
        postedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the returner handed the parcel to the carrier (ISO 8601, UTC); `null` when unknown.
        deliveredAt:
          type: string
          format: date-time
          readOnly: true
          description: When the return arrived at the warehouse (ISO 8601, UTC); `null` until it arrives.
        processedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse checked the returned items (ISO 8601, UTC); `null` until processed.
        confirmedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse confirmed the return (ISO 8601, UTC); `null` until confirmed.
        cancelledAt:
          type: string
          format: date-time
          readOnly: true
          description: When the confirmed return was cancelled (ISO 8601, UTC); `null` unless cancelled.
        portalTier:
          type: string
          readOnly: true
          description: 'Returns portal tier the return was created with; `null` for returns not created through the returns portal.


            - `basic`

            - `pro`'
        labelType:
          type: string
          readOnly: true
          description: 'Kind of label the return got; `null` for returns not created through the returns portal.


            - `byrd_label`: a carrier shipping label

            - `identifier_only`: only a label identifying the return'
        warehouseID:
          type: string
          format: uuid
          readOnly: true
          description: ID of the warehouse the return is sent to (UUID).
        shipmentError:
          readOnly: true
          description: Error that stopped the return documents from being generated; `null` when there is none.
          allOf:
          - $ref: '#/components/schemas/ReturnShipmentError'
      required:
      - shipmentID
      title: Return shipment
    ReturnShipmentDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        type:
          type: string
          description: 'Kind of document.


            - `printable_label`: return label to print and stick on the parcel

            - `qr_code`: QR code image provided by the carrier'
        dataType:
          type: string
          description: 'File format of the document.


            - `pdf`: PDF file

            - `png`: PNG image'
      required:
      - dataType
      - type
      title: Return shipment document
    ReturnShipmentError:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: ID of the error (UUID).
        code:
          type: string
          enum:
          - Warehouse.ReturnShipmentDocuments.GenerateDocuments.UnsupportedDocument
          - Warehouse.ReturnShipmentDocuments.GenerateDocuments.GenerationFailed
          - Warehouse.ReturnShipmentDocuments.GenerateDocuments.UploadFailure
          - Warehouse.ReturnShipmentDocuments.GenerateDocuments.InvalidStatus
          - Warehouse.ReturnShipmentDocuments.GenerateDocuments.AlreadyExist
          - Warehouse.ReturnShipmentDocuments.GenerateDocuments.DefaultError
          readOnly: true
          description: 'Code of the error. `DefaultError` stands for any error without a more specific code.


            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.UnsupportedDocument`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.GenerationFailed`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.UploadFailure`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.InvalidStatus`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.AlreadyExist`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.DefaultError`'
      additionalProperties: false
      title: Return shipment error
    ReturnShipmentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        returnID:
          type: string
          format: uuid
          readOnly: true
          description: ID of the return the item belongs to (UUID).
        byrdProductID:
          type: string
          format: uuid
          description: ID of the returned product (UUID).
        shipmentItemID:
          type: string
          format: uuid
          description: ID of the shipment item that was returned (UUID); `null` when the warehouse matched the item by product only.
        amount:
          type: integer
          minimum: 1
          description: Number of units returned; at least 1. When `packagingUnitID` is set, the number of packaging units.
        packagingUnitID:
          type: string
          format: uuid
          description: ID of the packaging unit the product came back in (UUID); `null` for single units.
        condition:
          type: string
          enum:
          - a-new
          - used
          - damaged
          description: 'Condition of the item as rated by the warehouse. What happens to the item next is agreed during onboarding.


            - `a-new`: like new, normally put back into stock

            - `used`: shows signs of use and cannot be resold without further steps

            - `damaged`: cannot be resold'
        internalComments:
          type: string
          description: Notes the warehouse recorded about the item.
        photos:
          description: Photos the warehouse took of the returned item.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentItemPhoto'
      required:
      - amount
      - byrdProductID
      - condition
      title: Return shipment item
    ReturnShipmentItemAnnounced:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        shipmentItemID:
          type: string
          format: uuid
          description: ID of the shipment item announced for return (UUID).
        amount:
          type: integer
          minimum: 1
          description: Number of units announced for return; at least 1.
        reason:
          type: string
          description: Reason given for returning the item.
      required:
      - amount
      - reason
      title: Return shipment item announced
    ReturnShipmentItemPhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        url:
          type: string
          format: url
          description: URL of the photo.
      required:
      - url
      title: Return shipment item photo
    ReturnShipmentUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        parcelID:
          type: string
          readOnly: true
          description: Unique code of the parcel in the warehouse.
      title: Return shipment unit
    ReturnedShipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        cod:
          type: object
          properties:
            codValue:
              type: number
              minimum: 0
              maximum: 2500
              description: Amount to collect from the recipient, from 0 to 2500.
            codCurrency:
              type: string
              enum:
              - EUR
              description: Currency of `codValue` (ISO 4217); only `EUR`.
          required:
          - codCurrency
          - codValue
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
          nullable: true
        customs:
          type: object
          properties:
            invoiceNumber:
              type: string
              description: Commercial invoice number of the order.
            goodsType:
              type: string
              enum:
              - document
              - gift
              - sample
              - remand
              - other
              description: 'Type of goods in the shipment.


                - `document`: documents

                - `gift`: a gift

                - `sample`: commercial samples

                - `remand`: returned goods

                - `other`: any other goods'
          required:
          - goodsType
          - invoiceNumber
          description: Customs details used to generate the export documents; `null` when none were provided.
          nullable: true
        description:
          type: string
          description: Note for your own use, visible in the dashboard. It is not sent to the recipient nor shown to the warehouse.
          nullable: true
        destinationAddress:
          description: Address of the recipient.
          allOf:
          - $ref: '#/components/schemas/Address'
        destinationCompany:
          type: string
          description: Company name, if the recipient is a company.
          nullable: true
        destinationEmail:
          type: string
          description: Email address of the recipient.
          nullable: true
        destinationName:
          type: string
          description: Name of the recipient.
        destinationPhone:
          type: string
          description: Phone number of the recipient, including the country code where possible (for example `+4912345890`). Characters other than digits and `+` are removed.
          nullable: true
        fragile:
          type: boolean
          description: Whether the shipment contains fragile items that need extra care.
        insurance:
          type: object
          properties:
            insuranceValue:
              type: number
              minimum: 0
              description: Value of the whole shipment for insurance purposes; at least 0.
            insuranceCurrency:
              type: string
              enum:
              - EUR
              description: Currency of `insuranceValue` (ISO 4217); only `EUR`.
          required:
          - insuranceCurrency
          - insuranceValue
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
          nullable: true
        option:
          type: string
          enum:
          - book
          - economy
          - standard
          - express
          - amazon_prime
          - pickup
          - pickup_point
          description: 'Shipping service of the shipment. Defaults to `standard`.


            - `standard`: regular delivery

            - `express`: faster delivery

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse; B2B shipments only

            - `amazon_prime`: Amazon Prime order, labelled through Amazon

            - `book`: legacy value, not used any more'
        orderID:
          type: string
          description: Any other identifier of the order in your system; not shown in the dashboard.
          nullable: true
        orderNumber:
          type: string
          description: Order number from your shop, shown in the Order column of the dashboard.
          nullable: true
        preferredCarrier:
          type: string
          description: Carrier you prefer for this shipment. It overrides byrd's automatic carrier selection and can lead to shipment errors, so use it with caution.
          nullable: true
        shopID:
          type: string
          format: uuid
          description: ID of the connected shop the shipment came from (UUID); `null` when it was not created by a shop integration.
          nullable: true
        shopType:
          type: string
          description: Type of shop system the shipment came from, for example `shopify` or `woocommerce`.
          nullable: true
        toBeBranded:
          type: boolean
          description: Whether the shipment is packed with your branded packaging.
          nullable: true
        toBePackaged:
          type: boolean
          description: Whether the warehouse packs the items into shipping packaging; `false` ships them in their own packaging.
          nullable: true
        userHeight:
          type: number
          minimum: 0
          description: Parcel height you provided, in cm.
          nullable: true
        userLength:
          type: number
          minimum: 0
          description: Parcel length you provided, in cm.
          nullable: true
        userPictureID:
          type: string
          format: uuid
          nullable: true
        userWeight:
          type: number
          minimum: 0
          description: Parcel weight you provided, in kg.
          nullable: true
        userWidth:
          type: number
          minimum: 0
          description: Parcel width you provided, in cm.
          nullable: true
        recallReason:
          type: string
          readOnly: true
          description: Why the shipment was recalled from the warehouse; `null` when it was not recalled.
          nullable: true
        carrier:
          type: string
          readOnly: true
          description: Carrier the shipment is sent with; `null` until a label is created.
          nullable: true
        packagingStartDate:
          type: string
          format: date-time
          readOnly: true
          description: When packing of the shipment started (ISO 8601); `null` until then.
        releasedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the shipment was released to a warehouse (ISO 8601); `null` until a release succeeds. Failed release attempts do not set it.
        releaseError:
          type: object
          readOnly: true
          description: Error from the last failed attempt to release the shipment to a warehouse; `null` when there is none.
          additionalProperties: {}
        outboundError:
          type: object
          readOnly: true
          description: Error from handing the shipment over to the carrier; `null` when there is none.
          additionalProperties: {}
        labelError:
          type: object
          readOnly: true
          nullable: true
          description: Error from the last failed attempt to create the shipping label, with its `code` and `message`; `null` when there is none.
        addressValidationError:
          type: object
          readOnly: true
          nullable: true
          description: Error from the failed address validation, with its `code` and `message`; `null` when the address passed or was not validated.
        totalPrice:
          readOnly: true
          description: 'Total price of the shipment: the shipping rate plus the fees recorded on it.'
          allOf:
          - $ref: '#/components/schemas/TotalPrice'
        type:
          type: string
          readOnly: true
          description: Type of the shipment; always `fulfillment`.
        user:
          readOnly: true
          description: byrd account the shipment belongs to.
          allOf:
          - $ref: '#/components/schemas/ReturnedShipmentUser'
        subStatus:
          type: string
          readOnly: true
          description: 'Detail on a `fulfillmentCompleted` shipment; `null` in every other status.


            - `waitingForLabel`: ready for its shipping label

            - `labelErrorOccurred`: creating the label failed and the shipment is blocked until the error is fixed

            - `labelErrorResolved`: a label error was fixed and the label can be created again'
        packagingMaterialID:
          type: string
          readOnly: true
          description: ID of the packaging material used to pack the shipment. Superseded by `packagingMaterials`.
          nullable: true
        packagingMaterials:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              packagingMaterialID:
                type: string
              quantity:
                type: integer
          description: Packaging materials used to pack the shipment, each with its `packagingMaterialID` and `quantity`; empty until packed.
        warehouseID:
          type: string
          format: uuid
          readOnly: true
          description: ID of the warehouse that fulfils the shipment (UUID); if omitted, byrd assigns one automatically.
          nullable: true
        hasDangerousGoods:
          type: boolean
          readOnly: true
          description: Whether any item of the shipment contains dangerous goods.
        limitedQuantityWeight:
          type: number
          readOnly: true
          description: Total weight of the items with limited-quantity dangerous goods, in kg; printed on the delivery note.
        totalDangerousGoodsItems:
          type: integer
          readOnly: true
          description: Number of item units in the shipment that contain dangerous goods.
        shipmentItems:
          description: Products in the shipment and their quantities.
          type: array
          items:
