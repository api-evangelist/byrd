          readOnly: true
          description: Units of the lot in this warehouse reserved for shipments and not picked yet.
        warehouse:
          readOnly: true
          description: Warehouse holding the stock. Its fields (`id`, `code`, `name`, `legalName`, `displayName`, `countryCode`) are returned directly in this object, not nested.
          allOf:
          - $ref: '#/components/schemas/LotWarehouseDetailsWarehouse'
      title: Lot warehouse details
    LotWarehouseDetailsWarehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
