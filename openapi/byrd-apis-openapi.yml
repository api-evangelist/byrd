          nullable: true
        latestShipDate:
          type: string
          format: date-time
          readOnly: true
          description: Deadline by which the shipment should be sent (ISO 8601).
          nullable: true
        shippingRate:
          type: object
          properties:
            value:
              type: number
              description: Amount, as a string with two decimals separated by a dot.
            currency:
