      parameters:
      - in: query
        name: id
        description: Only the shipment with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: ids
        description: Only shipments with any of these IDs (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: product_id
        description: Only shipments containing the product with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: product_ids
        description: Only shipments containing any of these products (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: parcel_id
        description: Only shipments with a parcel whose parcel ID contains this text, ignoring case; also finds deleted parcels.
        schema:
          type: string
        required: false
      - in: query
        name: unit_id
        description: Only shipments with the parcel (unit) with this ID (UUID); also finds deleted parcels.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: byrd_id
        description: Only shipments whose byrd ID contains this text, ignoring case; 3 to 10 characters.
        schema:
          type: string
          minLength: 3
          maxLength: 10
        required: false
      - in: query
        name: tracking_number
        description: Only shipments with a parcel that has this carrier tracking number.
        schema:
          type: string
        required: false
      - in: query
        name: postal_code
        description: Only shipments to this destination postal code.
        schema:
          type: string
        required: false
      - in: query
        name: storage_zone_ids
        description: 'For warehouse use: only shipments picked entirely from these storage zones (UUIDs); `null` selects shipments with a pick from storage outside any zone. Needs a `status` filter with only allocated shipments.'
        schema:
          type: array
          items:
            type: string
            format: uuid
            nullable: true
          nullable: true
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_user_id
        description: 'For warehouse use: only shipments assigned to this warehouse worker (UUID).'
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: warehouse_ids
        description: Only shipments fulfilled by any of these warehouses (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_id
        description: Only shipments fulfilled by this warehouse (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: carrier
        description: Only shipments with a parcel sent with any of these carriers, by carrier slug; see the list of carriers.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: predicted_carrier
        description: Only shipments whose carrier, as predicted when the shipment was released, is any of these carrier slugs; unlike `carrier`, this also finds shipments that have no parcel yet.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: service
        description: Only shipments sent with this `service`.
        schema:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
        required: false
      - in: query
        name: date_field
        description: 'Date of the shipment that `date_from` and `date_to` filter on; defaults to `created_at`.


          - `created_at`: created

          - `updated_at`: last changed

          - `released_at`: last release attempt

          - `picked_at`: picking completed

          - `packaged_date`: packed

          - `sent_date`: handed over to the carrier

          - `delivery_date`: delivered

          - `returned_date`: returned

          - `warehouse_sla_accepted_by`, `customer_sla_accepted_by`: deadline for the carrier to accept the shipment'
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - updated_at
          - released_at
          - picked_at
          - packaged_date
          - sent_date
          - delivery_date
          - returned_date
          - warehouse_sla_accepted_by
          - customer_sla_accepted_by
        required: false
      - in: query
        name: date_from
        description: Only shipments whose `date_field` is at or after this time (ISO 8601, inclusive).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: date_to
        description: Only shipments whose `date_field` is before this time (ISO 8601, exclusive); must be after `date_from`. For one calendar day, pass the following day, not the same day as `date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date_from
        description: Only shipments sent at or after this time (ISO 8601).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date_to
        description: Only shipments sent at or before this time (ISO 8601); must not be before `sent_date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date
        description: Only shipments sent on this day (ISO 8601 date, UTC). Cannot be combined with `date_from`, `date_to`, `sent_date_from` or `sent_date_to`.
        schema:
          type: string
          format: date
        required: false
      - in: query
        name: min_age_days
        description: Only shipments released at least this many whole days ago; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: failed_release
        description: When `true`, only shipments whose last release attempt failed.
        schema:
          type: boolean
        required: false
      - in: query
        name: awaiting_release
        description: When `true`, only shipments waiting to be released to a warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: awaiting_allocation
        description: When `true`, only shipments waiting for their stock to be allocated in the warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: label_required
        description: When `true`, only packed shipments still waiting for a shipping label (sub-status `label_required` or `label_error`); when `false`, all other shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_address_validation
        description: When `true`, only shipments held because their address validation failed; when `false`, only shipments without an address validation error.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_allocation
        description: When `true`, only shipments whose stock could not be allocated in the warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_packaging
        description: When `true`, only shipments with a parcel whose shipping label could not be created (sub-status `label_error`).
        schema:
          type: boolean
        required: false
      - in: query
        name: error_resolved
        description: When `true`, only shipments with a parcel whose label error was resolved and that waits to be packed again (sub-status `error_resolved`).
        schema:
          type: boolean
        required: false
      - in: query
        name: container_code
        description: 'For warehouse use: only shipments kept in the warehouse container with this code before packing.'
        schema:
          type: string
        required: false
      - in: query
        name: destination_email
        description: Only shipments to this recipient email address, ignoring case.
        schema:
          type: string
        required: false
      - in: query
        name: is_b2b
        description: When `true`, only B2B shipments; when `false`, only B2C shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: processing_standard
        description: Only B2B shipments that use any of these B2B templates, by template key.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: is_cod
        description: When `true`, only cash on delivery shipments; when `false`, only other shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: status
        description: Only shipments in any of these statuses; see `status` on the shipment for the values.
        schema:
          type: array
          items:
            type: string
            enum:
            - new
            - releasing
            - released
            - picking
            - packaging
            - packaged
            - sent
            - delivered
            - returning
            - returned
            - deleted
        required: false
        explode: false
        style: form
      - in: query
        name: sub_status
        description: Only shipments in any of these sub-statuses; needs a `status` filter. With more than one sub-status, send exactly one `status`, and each combination has to be valid.
        schema:
          type: array
          items:
            type: string
            enum:
            - validating_address
            - address_invalid
            - recalled
            - reserved
            - allocating
            - allocated
            - assigned
            - inbounding
            - inbound_error
            - label_error
            - error_resolved
            - autobag_failed
            - fba_details_required
            - fba_box_label_required
            - fba_pallet_label_required
            - label_required
            - label_created
            - label_uploaded
            - pickup_details_required
            - pickup_details_uploaded
            - manual_outbound
            - waiting_for_pickup
            - claim_reported
            - pick_up
            - in_transit
            - out_for_delivery
            - at_pickup_point
            - delayed
            - failed_delivery
        required: false
        explode: false
        style: form
      - in: query
        name: exclude_sub_status
        description: Leaves out shipments in any of these sub-statuses; shipments without a sub-status are kept.
        schema:
          type: array
          items:
            type: string
            enum:
            - validating_address
            - address_invalid
            - recalled
            - reserved
            - allocating
            - allocated
            - assigned
            - inbounding
            - inbound_error
            - label_error
            - error_resolved
            - autobag_failed
            - fba_details_required
            - fba_box_label_required
            - fba_pallet_label_required
            - label_required
            - label_created
            - label_uploaded
            - pickup_details_required
            - pickup_details_uploaded
            - manual_outbound
            - waiting_for_pickup
            - claim_reported
            - pick_up
            - in_transit
            - out_for_delivery
            - at_pickup_point
            - delayed
            - failed_delivery
        required: false
        explode: false
        style: form
      - in: query
        name: missing_documents
        description: When `true`, only shipments blocked because documents they need are missing.
        schema:
          type: boolean
        required: false
      - in: query
        name: priority_range
        description: 'For warehouse use: only shipments whose picking priority is within this range, given as `min,max` from 0 to 50; needs a `status` filter with only released statuses.'
        schema:
          type: array
          minItems: 2
          items:
            type: integer
            minimum: 0
            maximum: 50
        required: false
        explode: false
        style: form
      - in: query
        name: priority
        description: 'For warehouse use: only shipments with exactly this picking priority, from 0 to 50; needs a `status` filter with only released statuses.'
        schema:
          type: integer
          minimum: 0
          maximum: 50
        required: false
      - in: query
        name: destination_countries
        description: Only shipments to any of these countries (ISO 3166-1 alpha-2), for example `DE,AT`.
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
        required: false
        explode: false
        style: form
      - in: query
        name: total_products
        description: Only shipments with exactly this number of different products, not counting bundles themselves; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: total_items
        description: Only shipments with exactly this total number of physical items to pick, counting the contents of bundles; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: total_picks
        description: 'For warehouse use: only shipments with exactly this number of items to pick, counting a packaging unit as one; needs a `status` filter with only allocated shipments.'
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: product_quantities
        description: 'For warehouse use: only shipments with exactly these contents, given as `product_id:quantity` pairs; needs a `status` filter with only allocated shipments.'
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{8}-?[a-f0-9]{4}-?4[a-f0-9]{3}-?[89ab][a-f0-9]{3}-?[a-f0-9]{12}:[1-9]\d*$
        required: false
        explode: false
        style: form
      - in: query
        name: lot_ids
        description: 'For warehouse use: only shipments whose picks come from exactly this set of lots (UUIDs); an empty list selects shipments without lot-tracked picks. Needs a `status` filter with only allocated shipments.'
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: has_identical_orders
        description: 'For warehouse use: when `true`, only shipments with exactly the same contents as at least one other shipment in the result; needs a `status` filter with only allocated shipments.'
        schema:
          type: boolean
        required: false
      - in: query
        name: exclude
        description: 'Parts to leave out of the response, which makes it faster: `items`, `units`.'
        schema:
          type: array
          items:
            type: string
            enum:
            - items
            - units
        required: false
        explode: false
        style: form
      - in: query
        name: only
        description: Fields to return, as comma-separated dotted paths of response field names, for example `id,status,units.items`; all fields when not sent.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: label_error_status
        description: 'Only shipments with a label error in this state.


          - `blocked`: not resolved yet, like `failed_packaging`

          - `resolved`: resolved, like `error_resolved`'
        schema:
          type: string
          enum:
          - resolved
          - blocked
        required: false
      - in: query
        name: v3_packaging
        description: Only shipments packed (`true`) or not packed (`false`) with the v3 packing process.
        schema:
          type: boolean
        required: false
      - in: query
        name: order_number
        description: Only shipments with exactly this `shop.order_number`.
        schema:
          type: string
        required: false
      - in: query
        name: marketplace_order_number
        description: Only shipments with exactly this `shop.marketplace_order_number`.
        schema:
          type: string
        required: false
      - in: query
        name: marketplace
        description: Only shipments with this `shop.marketplace`, for example `amazon`.
        schema:
          type: string
        required: false
      - in: query
        name: products_barcodes_only
        description: 'For warehouse use: when `true`, only shipments containing products that have a barcode.'
        schema:
          type: boolean
        required: false
      - in: query
        name: include_unit_items
        description: Whether to include the items packed in each parcel (`units.items`), for example to read their serial numbers; defaults to `false`. Cannot be combined with excluding `units`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: slam_compatible
        description: 'For warehouse use: when `true`, only shipments that can be packed on the automated labelling line; needs a `status` filter with only released statuses.'
        schema:
          type: boolean
        required: false
      - in: query
        name: autobag_compatible
        description: 'For warehouse use: only shipments that can (`true`) or cannot (`false`) be packed with the automatic bagging machine; needs a `status` filter with only released statuses.'
        schema:
          type: boolean
        required: false
      - in: query
        name: returnable
        description: 'When `true`, only shipments that can still be returned: `sent`, `delivered`, `returning` or `returned`, and sent within the last 180 days.'
        schema:
          type: boolean
        required: false
      - in: query
        name: customer_action_required
        description: When `true`, only shipments with an open action you need to take to unblock them.
        schema:
          type: boolean
        required: false
      - in: query
        name: customs_required
        description: Only shipments that need (`true`) or do not need (`false`) a customs declaration because they cross a customs border; known once a shipment is released.
        schema:
          type: boolean
        required: false
      - in: query
        name: has_shipping_label
        description: Only shipments that have (`true`) or do not have (`false`) a shipping label document.
        schema:
          type: boolean
        required: false
      - in: query
        name: filter_group_id
        description: 'For warehouse use: ID of a saved set of filters to apply instead of individual filters (UUID).'
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: only_ground_level
        description: 'Deprecated. For warehouse use: when `true`, only shipments picked entirely from storage at ground level; when `false`, only shipments with at least one pick from a higher level.'
        schema:
          type: boolean
        required: false
      - in: query
        name: is_forklift_required
        description: 'For warehouse use: only shipments whose picking needs (`true`) or does not need (`false`) a forklift.'
        schema:
          type: boolean
        required: false
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: Count shipments
  /v3/shipments/recall:
    post:
      operationId: shipmentbatchrecallapiv3_post
      responses:
        '200':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Recalls several released shipments at once, as the single recall

        does for one. If any of them cannot be recalled, the request fails

        with the errors of each one that could not.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentBatch'
      x-byrd-roles:
      - admin
      - customer
      - service
      summary: Recall shipments
  /v3/shipments/release:
    post:
      operationId: shipmentbatchreleaseapiv3_post
      responses:
        '200':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Schedules shipments in status `new` for release to a warehouse, which

        then reserves their stock and starts fulfilment. The release runs in

        the background; the response lists the shipments that were scheduled

        (`released`), could not be (`failed`) or were not found

        (`not_found`), with the `errors`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentBatchRelease'
      x-byrd-roles:
      - admin
      - service
      - customer
      summary: Release shipments
  /v3/shipments/report:
    get:
      operationId: shipmentreportapiv3_get
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Undefined'
      tags:
      - Shipments
      description: 'Returns a CSV file with one row per item in each parcel of your

        shipments in the given period, most recent first and up to 10000

        rows.'
      x-byrd-roles:
      - admin
      - customer
      parameters:
      - in: query
        name: date_from
        description: Start of the period to report on (ISO 8601); must be before `date_to` and not in the future.
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: date_to
        description: End of the period to report on (ISO 8601, inclusive); must not be in the future.
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: carrier
        description: Only parcels sent with this carrier, by carrier slug.
        schema:
          type: string
        required: false
      - in: query
        name: date_field
        description: 'Date that `date_from` and `date_to` apply to; defaults to `packaged_at`.


          - `packaged_at`: parcel packed

          - `sent_at`: parcel handed over to the carrier

          - `returned_at`: shipment returned

          - `created_at`: shipment created'
        schema:
          type: string
          default: packaged_at
          enum:
          - packaged_at
          - sent_at
          - returned_at
          - created_at
        required: false
      - in: query
        name: warehouse_id
        description: Only parcels from this warehouse (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: user_id
        description: ID of the byrd account to report on (UUID); if you send it, it has to be your own account.
        schema:
          type: string
          format: uuid
        required: false
      summary: Download a shipment report
  /v3/shipments/{shipment_id}:
    get:
      operationId: shipmentapiv3_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Shipment'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns the details of one of your shipments, including its parcels

        (`units`) with their tracking data and the items packed in each. Use

        `only` to return just the fields you need.'
      x-byrd-roles:
      - customer
      - service
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: only
        description: Fields to return, as comma-separated dotted paths of response field names, for example `id,status,units.items`; all fields when not sent.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the shipment (UUID).
      summary: Get a shipment
    patch:
      operationId: shipmentapiv3_patch
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Shipment'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Changes only the fields you send; a list you send, such as `items` or

        `documents`, replaces the existing one. The items and the service can

        be changed until the shipment is released, and the destination

        address until it is packed. See the Updating a shipment guide.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/ShipmentUpdate'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the shipment (UUID).
      summary: Update a shipment
    delete:
      operationId: shipmentapiv3_delete
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Deletes one of your shipments that has not been released to a

        warehouse yet. To delete a released shipment, recall it first.'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the shipment (UUID).
      summary: Delete a shipment
  /v3/shipments/{shipment_id}/documents:
    get:
      operationId: shipmentdocumentsbatchapiv3_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns the documents of a shipment, such as the documents you

        uploaded and its return labels. Shipping labels byrd created are

        listed once the shipment is sent.'
      x-byrd-roles:
      - service
      - customer
      - admin
      - operator
      - warehouse
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the shipment (UUID).
      summary: List shipment documents
    post:
      operationId: shipmentdocumentsbatchapiv3_post
      responses:
        '201':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Adds documents to a shipment, for example a delivery note to print

        and pack with it, or your own shipping label for a B2B shipment. A

        shipping label can only be uploaded while the shipment waits for one

        (sub-status `label_required`, `pickup_details_uploaded` or

        `label_uploaded`), except for `pickup` shipments.'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Document'
      x-byrd-roles:
      - service
      - customer
      - admin
      - operator
      - warehouse
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
