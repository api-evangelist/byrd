        aggregatedContainerStatus:
          type: string
          readOnly: true
          description: 'Tracking status of the delivery as a whole, combined from the tracking statuses of its containers; `null` when none of them is tracked.


            - `pick_up`: waiting to be picked up by the carrier

            - `in_transit`: on the way to the warehouse

