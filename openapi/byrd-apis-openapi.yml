          nullable: true
        skipBarcodePick:
          type: boolean
          readOnly: true
          description: Whether warehouse staff may skip scanning product barcodes when picking and packing your shipments.
        isStaff:
          type: boolean
          readOnly: true
          description: Whether the account belongs to a byrd employee.
        unpaidBalance:
          type: boolean
          readOnly: true
          description: Whether your account has an unpaid balance.
        fulfillmentLock:
          type: boolean
          readOnly: true
          description: Whether fulfillment of your shipments is stopped. While `true`, new and existing shipments are not released to the warehouse.
        role:
          type: string
          enum:
