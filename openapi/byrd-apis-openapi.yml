          additionalProperties:
            type: object
            additionalProperties: {}
      title: Dangerous goods limits
    AcceptanceFee:
      type: object
      properties:
        value:
          type: number
          description: Amount, as a string with two decimals separated by a dot.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency (ISO 4217 code, e.g. `EUR`).
        taxFactor:
          type: number
          readOnly: true
          description: Tax factor of the price, for example `1.19` for 19% VAT; `null` when not set.
          nullable: true
      required:
      - currency
      - value
      title: Acceptance fee
    DeliveryContainer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        sequenceNumber:
          type: integer
          minimum: 0
          description: Position of the container within the delivery, used to order the containers; 0 or greater.
        type:
          type: string
          enum:
          - euroPallet
          - pallet
          - parcel
          description: 'How the container arrives. Use the same type for all containers of a delivery.


            - `parcel`: a parcel

            - `pallet`: a pallet

            - `euroPallet`: a EUR-pallet (Euro-pallet)'
        exchangeablePallet:
          type: boolean
          description: Whether the delivery is on exchangeable EUR-pallets (Euro-pallets, EPAL), which the warehouse exchanges for empty ones with the carrier on arrival. Set it to `false` when the pallet type is unknown or different.
        carrier:
          type: string
          enum:
          - DHL
          - DHL_Express
          - DPD
          - FedEx
          - GLS
          - Hellmann
          - Hermes
          - PostAT
          - PostDE
          - UPS
          - amazon
          - chronopost
          - colissimo_fr
          - db_schenker
          - dpd_de
          - dpd_gb
          - fiege
          - gls_global
          - post_at
          - post_de
          - post_it
          - post_nl
          - royalmail_gb
          - tnt
          - dsv_global
          - dachser_global
          - maersk_global
          - strecktransport_global
          - nacex_es
          - correosexpress_global
          - brt_it
          - seur_es
          - fercam_global
          - unknown
          description: Carrier bringing the container to the warehouse. Use `unknown` for any carrier not listed and give its name in `unknownCarrierName`.
        unknownCarrierName:
          type: string
          description: Name of the carrier when `carrier` is `unknown`; an empty string or `null` otherwise.
          nullable: true
        trackingNumber:
          type: string
          description: Tracking number of the container with its carrier, used to track it on its way to the warehouse; `null` when there is none. Must not be a URL.
          nullable: true
        trackingURL:
          type: string
          description: URL where the container can be tracked; `null` or empty when there is none.
          nullable: true
        arrived:
          type: boolean
          description: Whether the container has arrived at the warehouse, as recorded by the warehouse.
        status:
          type: string
          enum:
          - pick_up
          - in_transit
          - out_for_delivery
          - delivered
          - delayed
          - failed_delivery
          - null
          readOnly: true
          description: 'Tracking status of the container, updated from the carrier tracking of its `trackingNumber`; `null` until the first tracking update.


            - `pick_up`: waiting to be picked up by the carrier

            - `in_transit`: on the way to the warehouse

            - `out_for_delivery`: out for delivery to the warehouse

            - `delivered`: delivered to the warehouse

            - `delayed`: delivery is delayed

            - `failed_delivery`: the carrier failed to deliver'
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          readOnly: true
          description: When the carrier delivered the container to the warehouse, according to its tracking (ISO 8601, UTC); `null` until then.
          nullable: true
      required:
      - carrier
      - exchangeablePallet
      - sequenceNumber
      - trackingNumber
      - trackingURL
      - type
      - unknownCarrierName
      title: Delivery container
    DeliveryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        sequenceNumber:
          type: integer
          minimum: 0
          description: Position of the item within the delivery, used to order the items; 0 or greater.
        amount:
          type: integer
          minimum: 1
          description: Number of units of the product announced in the delivery; at least 1.
        amountArrivedDamaged:
          type: integer
          readOnly: true
          description: Number of units that arrived damaged, as counted by the warehouse; `null` until recorded.
        amountArrivedFinished:
          type: integer
          readOnly: true
          description: Number of units that arrived intact, as counted by the warehouse; `null` until recorded.
        boxcode:
          type: string
          description: Your identifier of the box or boxes the product arrives in. Separate several box codes with commas.
        hasExistingStorage:
          type: boolean
          readOnly: true
          description: Whether the product already has a storage location in the warehouse receiving the delivery.
        newSKU:
          type: boolean
          readOnly: true
          description: Whether the product had no stock location in the warehouse when the delivery was announced, making it new to that warehouse.
        receivedAmount:
          type: integer
          readOnly: true
          description: Number of units put away into stock from this item so far.
        product:
          readOnly: true
          description: Product announced in this item.
          allOf:
          - $ref: '#/components/schemas/DeliveryItemProduct'
        productID:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the product announced in this item (UUID). The product must be active and cannot be a bundle or an alias.
      required:
      - amount
      - boxcode
      - productID
      - sequenceNumber
      title: Delivery item
    DeliveryItemProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the product (UUID).
        bsku:
          type: string
          default: null
          readOnly: true
          pattern: ^BSKU-([A-Z0-9]){10}$
          description: Unique SKU byrd generates for the product, unrelated to your `sku`.
          example: BSKU-ONXV1VAF04
          nullable: true
        sku:
          type: string
          minLength: 1
          description: Your stock keeping unit (SKU) for the product, unique among your products. It must match the SKU your sales channel sends on order lines.
          example: AELMO-00005
          nullable: true
        name:
          type: string
          minLength: 1
          description: Name of the product; at least one character.
        description:
          type: string
          description: Free-text description of the product.
          nullable: true
        organic:
          type: boolean
          description: Whether the product is organic and needs special storage and shipping conditions. Bundles cannot be organic. Defaults to `false`.
          nullable: true
        grs:
          type: boolean
          description: Whether the product complies with the Global Recycled Standard (GRS) and needs specific storage conditions. Defaults to `false`.
          nullable: true
        productType:
          type: string
          description: 'Type of the product. Defaults to `product`; `bundle`, `supplementary` and `packaging_material` cannot be changed afterwards.


            - `product`: a regular physical product

            - `bundle`: a group of other products sold under one SKU, see `bundleIngredients`

            - `prepacked_product`: a product shipped in its own packaging

            - `packaging_material`: packaging material, such as boxes or fillers

            - `branding`: branded material packed into shipments, not counted as a product item

            - `supplementary`: a product only shipped together with another product

            - `alias`: another SKU for an existing product, sharing its stock

            - `marketing`: marketing material'
          nullable: true
        lotsEnabled:
          type: boolean
          description: Whether lots (batches) of the product are tracked when it is inbounded and shipped. Bundles cannot be lot tracked. Defaults to `false`.
        barcode:
          type: string
          maxLength: 48
          description: Value of the primary barcode printed on the product, at most 48 characters; mirrors the primary entry of `barcodes`. `null` when the product has no barcode.
          nullable: true
        barcodes:
          description: All barcodes printed on the product, at most one of them primary. When you send both `barcode` and `barcodes`, `barcode` must match the primary entry.
          type: array
          items:
            $ref: '#/components/schemas/Barcode'
          nullable: true
      required:
      - name
      title: Delivery item product
    DeliveryStandard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the standard check (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        deliveryID:
          type: string
          format: uuid
          readOnly: true
          description: ID of the delivery the check belongs to (UUID).
        label:
          description: 'Standard the delivery was checked against.


            - `ANNOUNCED_BEFORE_ARRIVAL`: the delivery was announced before it arrived

            - `ARRIVED_WITH_BYRD_ID`: the parcels or pallets carried the delivery ID

            - `ARRIVED_WITH_DELIVERY_NOTE`: the delivery arrived with its delivery note'
          type: string
          enum:
          - ANNOUNCED_BEFORE_ARRIVAL
          - ARRIVED_WITH_BYRD_ID
          - ARRIVED_WITH_DELIVERY_NOTE
        isFulfilled:
          type: boolean
          description: Whether the delivery met the standard.
      required:
      - isFulfilled
      - label
      title: Delivery standard
    DeliveryWithMetrics:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        customsMRN:
          type: string
          pattern: ^[0-9]{2}GB[A-Z0-9]{14}\Z
          description: 'UK customs Movement Reference Number (MRN) of the goods: 18 characters, two digits for the year, `GB`, then 14 uppercase letters or digits. Only allowed for deliveries to a warehouse in the United Kingdom; you can set it while the delivery is `announced` or `atWarehouse`, including with a partial update after arrival. `null` when not provided.'
          example: 25GB1234567890ABCD
          nullable: true
        description:
          type: string
          description: Free-text summary of the contents of the delivery; `null` when not provided.
          nullable: true
        expectedDeliveryDateFrom:
          type: string
          format: date-time
          description: Start of the window in which the delivery is expected to arrive at the warehouse (ISO 8601, UTC). For `container` deliveries it must equal `expectedDeliveryDateTo`. Customers can only change it while the delivery is `announced`.
        expectedDeliveryDateTo:
          type: string
          format: date-time
          description: End of the window in which the delivery is expected to arrive at the warehouse (ISO 8601, UTC). For `container` deliveries it must be a business day at least 10 business days from now. Customers can only change it while the delivery is `announced`.
        expressInbounding:
          type: boolean
          description: Whether express inbounding is requested. Always send `false`.
        isInternational:
          type: boolean
          description: Whether the goods cross a border into the warehouse's country. Only for deliveries to a warehouse in the United Kingdom, where it is required when announcing or fully updating the delivery. When `true`, `senderName` and `senderAddress` are required and the warehouse cannot inbound the delivery until `customsMRN` is provided. Customers can still declare it `true` with a partial update after the delivery has left `announced`, but not change it back once the goods have arrived. `null` when it does not apply.
          nullable: true
        referenceNumber:
          type: string
          description: Your own reference for the delivery, such as a purchase order number; `null` when not provided.
          nullable: true
        requiresCounting:
          type: boolean
          description: Whether the warehouse counts every item on arrival; charges may apply. When `false`, stock is booked as announced and byrd is not liable for discrepancies. Defaults to `true`; cannot be `true` together with `requiresSampling`. Customers can only change it while the delivery is `announced`.
          nullable: true
        requiresSampling:
          type: boolean
          description: Whether the warehouse checks a representative sample of the goods on arrival instead of counting every item. Defaults to `false`; cannot be `true` together with `requiresCounting`. Customers can only change it while the delivery is `announced`.
          nullable: true
        senderAddress:
          type: string
          description: Address the delivery is sent from; required for international deliveries, otherwise `null` when not provided. Part of the customs declaration, so customers can still change it with a partial update after the delivery has left `announced`.
          nullable: true
        senderName:
          type: string
          description: Name of the sender of the delivery; required for international deliveries, otherwise `null` when not provided. Part of the customs declaration, so customers can still change it with a partial update after the delivery has left `announced`.
          nullable: true
        stocktaking:
          type: boolean
          description: Always send `true`.
        unmixedDelivery:
          type: boolean
          nullable: true
        containerSizeAnnounced:
          type: string
          enum:
          - 20ft
          - 40ft
          - null
          description: 'Size of the shipping container, as you announced it. Only for `container` deliveries; `null` otherwise.


            - `20ft`: 20-foot container

            - `40ft`: 40-foot container'
          nullable: true
        isPalletizedAnnounced:
          type: boolean
          description: Whether the goods in the shipping container are on pallets, as you announced it. Only for `container` deliveries; `null` otherwise.
          nullable: true
        deletedDate:
          type: string
          format: date-time
          readOnly: true
          description: When the delivery was cancelled (ISO 8601, UTC); `null` when it was not.
        identifier:
          type: string
          readOnly: true
          description: Short human-readable identifier of the delivery, shown in the dashboard and printed as a barcode on the delivery note.
          example: TST-8VO4
        statusUpdatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the status of the delivery last changed (ISO 8601, UTC).
        inboundedDateTime:
          type: string
          format: date-time
          readOnly: true
          description: When the delivery was completed and its stock became available (ISO 8601, UTC); `null` until then.
        inProcessingDateTime:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse started processing the delivery, moving it to `inProcessing` (ISO 8601, UTC); `null` until then.
        atWarehouseDateTime:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse accepted the delivery, moving it to `atWarehouse` (ISO 8601, UTC); `null` until then.
        aggregatedContainerStatus:
          type: string
          readOnly: true
          description: 'Tracking status of the delivery as a whole, combined from the tracking statuses of its containers; `null` when none of them is tracked.


            - `pick_up`: waiting to be picked up by the carrier

            - `in_transit`: on the way to the warehouse

            - `out_for_delivery`: out for delivery to the warehouse

            - `partially_delivered`: some containers were delivered, others not yet

            - `delivered`: all containers were delivered

            - `delayed`: delivery is delayed

            - `failed_delivery`: the carrier failed to deliver'
          nullable: true
        customsMRNProvidedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the customs MRN was first provided (ISO 8601, UTC); `null` while there is none. The inbound deadline of an international delivery is not counted before this.
        subStatus:
          type: string
          readOnly: true
          description: 'Detail on the current status; `null` when there is none.


            - `waitingOnMRN`: the delivery needs a customs MRN before the warehouse can inbound it; provide it in `customsMRN`'
          nullable: true
        originConfirmedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse last recorded where the goods came from (`warehouseOriginIsUK`) (ISO 8601, UTC); `null` when it has not.
        deliveryContainers:
