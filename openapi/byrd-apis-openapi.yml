          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
          allOf:
          - $ref: '#/components/schemas/Customs'
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentDestinationAddress'
        errors:
          readOnly: true
          description: Errors blocking the shipment from progressing, for example a failed address validation or an allocation problem; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        insurance:
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
          allOf:
          - $ref: '#/components/schemas/Insurance'
        metrics:
          readOnly: true
          description: Item, SKU, pick and packaging-unit counts for the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentListMetrics'
        notes:
          description: Free-text notes for your own use and packaging instructions for the warehouse.
          allOf:
          - $ref: '#/components/schemas/Notes'
        options:
          description: Fulfilment and shipping options set on the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentListOptions'
        origin:
          type: string
          readOnly: true
          description: 'How the shipment was created; `null` for shipments created before this was recorded.


            - `api`: through the API with an API key

            - `manual`: in the byrd dashboard

            - `integration`: by a byrd shop integration'
        byrd_id:
          type: string
          readOnly: true
          description: Short human-readable identifier of the shipment, shown in the dashboard and printed on warehouse documents.
          example: ABCD12345
        priority:
          type: integer
          readOnly: true
          description: Picking priority in the warehouse, from 0 (normal) to 40 (highest); rises automatically once the shipping deadline is reached. `null` until the shipment is released.
          example: 10
        return_address:
          readOnly: true
          description: Address of the fulfilling warehouse that returns are sent to; `null` until the shipment is released.
          allOf:
          - $ref: '#/components/schemas/ReturnAddress'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentShop'
        status:
          type: string
          readOnly: true
          description: 'Current status of the shipment.


            - `new`: created and not yet released to a warehouse

            - `releasing`: being released to a warehouse

            - `released`: released and waiting to be picked

            - `picking`: items are being picked

            - `packaging`: being packed

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: a return shipment was created

            - `returned`: the return arrived at the warehouse

            - `deleted`: deleted'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `validating_address`, `address_invalid`, `recalled`: while `new`

            - `reserved`, `allocating`, `allocated`, `assigned`, `inbounding`, `inbound_error`: while `released`

            - `label_error`, `error_resolved`, `autobag_failed`: while `packaging`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `manual_outbound`, `waiting_for_pickup`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`

            - `claim_reported`: a support claim is open, while `sent` or `delivered`'
        units:
          readOnly: true
          description: Physical parcels or pallets the shipment is packed into, each with its own tracking information.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentListUnit'
        warnings:
          readOnly: true
          description: Problems that do not block the shipment, for example an address validation error on a shipment released anyway, or the reason it was recalled.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        warehouse:
          readOnly: true
          description: Warehouse fulfilling the shipment; its fields are `null` until a warehouse is assigned.
          allOf:
          - $ref: '#/components/schemas/ShipmentWarehouse'
        user:
          readOnly: true
          description: byrd account the shipment belongs to.
          allOf:
          - $ref: '#/components/schemas/ShipmentUser'
        dangerous_goods:
          readOnly: true
          description: Dangerous goods totals for the shipment.
          allOf:
          - $ref: '#/components/schemas/DGDetails'
        cash_on_delivery:
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
          allOf:
          - $ref: '#/components/schemas/CashOnDelivery'
        total_value:
          readOnly: true
          description: Total value of the items (unit price × quantity), converted to EUR.
          allOf:
          - $ref: '#/components/schemas/CashOnDeliveryPrice'
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterials'
          nullable: true
        user_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        documents:
          writeOnly: true
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/Document'
        warehouse_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
          nullable: true
        warehouse_user_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the warehouse worker assigned to pick the shipment.
          nullable: true
        pickup_point:
          type: object
          default: null
          writeOnly: true
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
          nullable: true
        items:
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/Item'
      required:
      - destination_address
      - items
      title: Shipment list
    ShipmentListMetrics:
      type: object
      properties:
        total_picks:
