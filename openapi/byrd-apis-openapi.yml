  /v3/returns/announce:
    post:
      operationId: returnshipmentannouncedapiv3_post
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnShipmentAnnounced'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Creates a customer return in the `announced` state for items of one

        of your shipments. The return label is generated asynchronously and

        emailed to `send_documents_to_email` a few seconds later, unless

        `send_email` is `false`, so `documents` is usually empty in the

        response. See

        [Announcing returns](https://developers.getbyrd.com/docs/announcing-returns).'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnShipmentAnnouncedInput'
      x-byrd-roles:
      - admin
      - service
      - customer
      summary: Announce a return
  /v3/returns/{return_id}/documents:
    post:
      operationId: returnshipmentdocumentsapiv3_post
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnShipmentAnnounced'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
          description: '`send_documents_to_email` is missing or not a valid email, or is sent although `send_email` is `false`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Request.InvalidSchema
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: No return exists for the given id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Warehouse.ReturnShipments.Create.NotFound
        '412':
          description: The return cannot have documents regenerated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Warehouse.ReturnShipmentDocuments.GenerateDocuments.AlreadyPosted
                    - Warehouse.ReturnShipmentDocuments.GenerateDocuments.InvalidStatus
        '422':
          description: The return belongs to another customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Warehouse.ReturnShipments.Create.Unauthorized
      tags:
      - Shipments
      description: 'Generates a new return label for an announced return that has not

        been posted yet and emails it to `send_documents_to_email` (unless

        `send_email` is `false`), for

        example because the QR code on the earlier label stopped working

        (about two weeks after it was created). The address is used for this

        label only and does not replace the return''s own

        `send_documents_to_email`. The documents are generated

        asynchronously.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnShipmentRegenerateDocumentsInput'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the return (UUID).
      summary: Regenerate the documents of a return
  /v3/shipments:
    get:
      operationId: shipmentlistapiv3_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ShipmentList'
                - $ref: '#/components/schemas/MinimalPaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns your shipments that match the filters, newest first by

        default. To keep tracking data in sync, list the shipments sent in a

        period with `sent_date_from` and `sent_date_to`; add

        `include_unit_items` to get the items and serial numbers of each

        parcel.'
      x-byrd-roles:
      - customer
      - service
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: id
        description: Only the shipment with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: ids
        description: Only shipments with any of these IDs (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: product_id
        description: Only shipments containing the product with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: product_ids
        description: Only shipments containing any of these products (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: parcel_id
        description: Only shipments with a parcel whose parcel ID contains this text, ignoring case; also finds deleted parcels.
        schema:
          type: string
        required: false
      - in: query
        name: unit_id
        description: Only shipments with the parcel (unit) with this ID (UUID); also finds deleted parcels.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: byrd_id
        description: Only shipments whose byrd ID contains this text, ignoring case; 3 to 10 characters.
        schema:
          type: string
          minLength: 3
          maxLength: 10
        required: false
      - in: query
        name: tracking_number
        description: Only shipments with a parcel that has this carrier tracking number.
        schema:
          type: string
        required: false
      - in: query
        name: postal_code
        description: Only shipments to this destination postal code.
        schema:
          type: string
        required: false
      - in: query
        name: storage_zone_ids
        description: 'For warehouse use: only shipments picked entirely from these storage zones (UUIDs); `null` selects shipments with a pick from storage outside any zone. Needs a `status` filter with only allocated shipments.'
        schema:
          type: array
          items:
            type: string
            format: uuid
            nullable: true
          nullable: true
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_user_id
        description: 'For warehouse use: only shipments assigned to this warehouse worker (UUID).'
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: warehouse_ids
        description: Only shipments fulfilled by any of these warehouses (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_id
        description: Only shipments fulfilled by this warehouse (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: carrier
        description: Only shipments with a parcel sent with any of these carriers, by carrier slug; see the list of carriers.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: predicted_carrier
        description: Only shipments whose carrier, as predicted when the shipment was released, is any of these carrier slugs; unlike `carrier`, this also finds shipments that have no parcel yet.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: service
        description: Only shipments sent with this `service`.
        schema:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
        required: false
      - in: query
        name: date_field
        description: 'Date of the shipment that `date_from` and `date_to` filter on; defaults to `created_at`.


          - `created_at`: created

          - `updated_at`: last changed

          - `released_at`: last release attempt

          - `picked_at`: picking completed

          - `packaged_date`: packed

          - `sent_date`: handed over to the carrier

          - `delivery_date`: delivered

          - `returned_date`: returned

          - `warehouse_sla_accepted_by`, `customer_sla_accepted_by`: deadline for the carrier to accept the shipment'
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - updated_at
          - released_at
          - picked_at
          - packaged_date
          - sent_date
          - delivery_date
          - returned_date
          - warehouse_sla_accepted_by
          - customer_sla_accepted_by
        required: false
      - in: query
        name: date_from
        description: Only shipments whose `date_field` is at or after this time (ISO 8601, inclusive).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: date_to
        description: Only shipments whose `date_field` is before this time (ISO 8601, exclusive); must be after `date_from`. For one calendar day, pass the following day, not the same day as `date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date_from
        description: Only shipments sent at or after this time (ISO 8601).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date_to
        description: Only shipments sent at or before this time (ISO 8601); must not be before `sent_date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date
        description: Only shipments sent on this day (ISO 8601 date, UTC). Cannot be combined with `date_from`, `date_to`, `sent_date_from` or `sent_date_to`.
        schema:
          type: string
          format: date
        required: false
      - in: query
        name: min_age_days
        description: Only shipments released at least this many whole days ago; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: failed_release
        description: When `true`, only shipments whose last release attempt failed.
        schema:
          type: boolean
        required: false
      - in: query
        name: awaiting_release
        description: When `true`, only shipments waiting to be released to a warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: awaiting_allocation
        description: When `true`, only shipments waiting for their stock to be allocated in the warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: label_required
        description: When `true`, only packed shipments still waiting for a shipping label (sub-status `label_required` or `label_error`); when `false`, all other shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_address_validation
        description: When `true`, only shipments held because their address validation failed; when `false`, only shipments without an address validation error.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_allocation
        description: When `true`, only shipments whose stock could not be allocated in the warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_packaging
        description: When `true`, only shipments with a parcel whose shipping label could not be created (sub-status `label_error`).
        schema:
          type: boolean
        required: false
      - in: query
        name: error_resolved
        description: When `true`, only shipments with a parcel whose label error was resolved and that waits to be packed again (sub-status `error_resolved`).
        schema:
          type: boolean
        required: false
      - in: query
        name: container_code
        description: 'For warehouse use: only shipments kept in the warehouse container with this code before packing.'
        schema:
          type: string
        required: false
      - in: query
        name: destination_email
        description: Only shipments to this recipient email address, ignoring case.
        schema:
          type: string
        required: false
      - in: query
        name: is_b2b
        description: When `true`, only B2B shipments; when `false`, only B2C shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: processing_standard
        description: Only B2B shipments that use any of these B2B templates, by template key.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: is_cod
        description: When `true`, only cash on delivery shipments; when `false`, only other shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: status
        description: Only shipments in any of these statuses; see `status` on the shipment for the values.
        schema:
          type: array
          items:
            type: string
            enum:
            - new
            - releasing
            - released
            - picking
            - packaging
            - packaged
            - sent
            - delivered
            - returning
            - returned
            - deleted
        required: false
        explode: false
        style: form
      - in: query
        name: sub_status
        description: Only shipments in any of these sub-statuses; needs a `status` filter. With more than one sub-status, send exactly one `status`, and each combination has to be valid.
        schema:
          type: array
          items:
            type: string
            enum:
            - validating_address
            - address_invalid
            - recalled
            - reserved
            - allocating
            - allocated
            - assigned
            - inbounding
            - inbound_error
            - label_error
            - error_resolved
            - autobag_failed
            - fba_details_required
            - fba_box_label_required
            - fba_pallet_label_required
            - label_required
            - label_created
            - label_uploaded
            - pickup_details_required
            - pickup_details_uploaded
            - manual_outbound
            - waiting_for_pickup
            - claim_reported
            - pick_up
            - in_transit
            - out_for_delivery
            - at_pickup_point
            - delayed
            - failed_delivery
        required: false
        explode: false
        style: form
      - in: query
        name: exclude_sub_status
        description: Leaves out shipments in any of these sub-statuses; shipments without a sub-status are kept.
        schema:
          type: array
          items:
            type: string
            enum:
            - validating_address
            - address_invalid
            - recalled
            - reserved
            - allocating
            - allocated
            - assigned
            - inbounding
            - inbound_error
            - label_error
            - error_resolved
            - autobag_failed
            - fba_details_required
            - fba_box_label_required
            - fba_pallet_label_required
            - label_required
            - label_created
            - label_uploaded
            - pickup_details_required
            - pickup_details_uploaded
            - manual_outbound
            - waiting_for_pickup
            - claim_reported
            - pick_up
            - in_transit
            - out_for_delivery
            - at_pickup_point
            - delayed
            - failed_delivery
        required: false
        explode: false
        style: form
      - in: query
        name: missing_documents
        description: When `true`, only shipments blocked because documents they need are missing.
        schema:
          type: boolean
        required: false
      - in: query
        name: priority_range
        description: 'For warehouse use: only shipments whose picking priority is within this range, given as `min,max` from 0 to 50; needs a `status` filter with only released statuses.'
        schema:
          type: array
          minItems: 2
          items:
            type: integer
            minimum: 0
            maximum: 50
        required: false
        explode: false
        style: form
      - in: query
        name: priority
        description: 'For warehouse use: only shipments with exactly this picking priority, from 0 to 50; needs a `status` filter with only released statuses.'
        schema:
          type: integer
          minimum: 0
          maximum: 50
        required: false
      - in: query
        name: destination_countries
        description: Only shipments to any of these countries (ISO 3166-1 alpha-2), for example `DE,AT`.
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
        required: false
        explode: false
        style: form
      - in: query
        name: total_products
        description: Only shipments with exactly this number of different products, not counting bundles themselves; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: total_items
        description: Only shipments with exactly this total number of physical items to pick, counting the contents of bundles; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: total_picks
        description: 'For warehouse use: only shipments with exactly this number of items to pick, counting a packaging unit as one; needs a `status` filter with only allocated shipments.'
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: product_quantities
        description: 'For warehouse use: only shipments with exactly these contents, given as `product_id:quantity` pairs; needs a `status` filter with only allocated shipments.'
        schema:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{8}-?[a-f0-9]{4}-?4[a-f0-9]{3}-?[89ab][a-f0-9]{3}-?[a-f0-9]{12}:[1-9]\d*$
        required: false
        explode: false
        style: form
      - in: query
        name: lot_ids
        description: 'For warehouse use: only shipments whose picks come from exactly this set of lots (UUIDs); an empty list selects shipments without lot-tracked picks. Needs a `status` filter with only allocated shipments.'
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: has_identical_orders
        description: 'For warehouse use: when `true`, only shipments with exactly the same contents as at least one other shipment in the result; needs a `status` filter with only allocated shipments.'
        schema:
          type: boolean
        required: false
      - in: query
        name: exclude
        description: 'Parts to leave out of the response, which makes it faster: `items`, `units`.'
        schema:
          type: array
          items:
            type: string
            enum:
            - items
            - units
        required: false
        explode: false
        style: form
      - in: query
        name: only
        description: Fields to return, as comma-separated dotted paths of response field names, for example `id,status,units.items`; all fields when not sent.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: label_error_status
        description: 'Only shipments with a label error in this state.


          - `blocked`: not resolved yet, like `failed_packaging`

          - `resolved`: resolved, like `error_resolved`'
        schema:
          type: string
          enum:
          - resolved
          - blocked
        required: false
      - in: query
        name: v3_packaging
        description: Only shipments packed (`true`) or not packed (`false`) with the v3 packing process.
        schema:
          type: boolean
        required: false
      - in: query
        name: order_number
        description: Only shipments with exactly this `shop.order_number`.
        schema:
          type: string
        required: false
      - in: query
        name: marketplace_order_number
        description: Only shipments with exactly this `shop.marketplace_order_number`.
        schema:
          type: string
        required: false
      - in: query
        name: marketplace
        description: Only shipments with this `shop.marketplace`, for example `amazon`.
        schema:
          type: string
        required: false
      - in: query
        name: products_barcodes_only
        description: 'For warehouse use: when `true`, only shipments containing products that have a barcode.'
        schema:
          type: boolean
        required: false
      - in: query
        name: include_unit_items
        description: Whether to include the items packed in each parcel (`units.items`), for example to read their serial numbers; defaults to `false`. Cannot be combined with excluding `units`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: slam_compatible
        description: 'For warehouse use: when `true`, only shipments that can be packed on the automated labelling line; needs a `status` filter with only released statuses.'
        schema:
          type: boolean
        required: false
      - in: query
        name: autobag_compatible
        description: 'For warehouse use: only shipments that can (`true`) or cannot (`false`) be packed with the automatic bagging machine; needs a `status` filter with only released statuses.'
        schema:
          type: boolean
        required: false
      - in: query
        name: returnable
        description: 'When `true`, only shipments that can still be returned: `sent`, `delivered`, `returning` or `returned`, and sent within the last 180 days.'
        schema:
          type: boolean
        required: false
      - in: query
        name: customer_action_required
        description: When `true`, only shipments with an open action you need to take to unblock them.
        schema:
          type: boolean
        required: false
      - in: query
        name: customs_required
        description: Only shipments that need (`true`) or do not need (`false`) a customs declaration because they cross a customs border; known once a shipment is released.
        schema:
          type: boolean
        required: false
      - in: query
        name: has_shipping_label
        description: Only shipments that have (`true`) or do not have (`false`) a shipping label document.
        schema:
          type: boolean
        required: false
      - in: query
        name: filter_group_id
        description: 'For warehouse use: ID of a saved set of filters to apply instead of individual filters (UUID).'
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: only_ground_level
        description: 'Deprecated. For warehouse use: when `true`, only shipments picked entirely from storage at ground level; when `false`, only shipments with at least one pick from a higher level.'
        schema:
          type: boolean
        required: false
      - in: query
        name: is_forklift_required
        description: 'For warehouse use: only shipments whose picking needs (`true`) or does not need (`false`) a forklift.'
        schema:
          type: boolean
        required: false
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: List shipments
    post:
      operationId: shipmentlistapiv3_post
      responses:
        '201':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Shipment'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Creates a B2C shipment, or a B2B shipment when `b2b_config` is sent.

        The shipment starts in status `new` and is released to a warehouse

        automatically when `options.auto_release` is `true`. Use

        `validate_only` to check a request without creating the shipment.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/ShipmentInput'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - in: query
        name: validate_only
        description: Whether to only validate the request and return the resulting shipment without saving it; defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: ensure_unique_order_id
        description: Whether to reject the shipment (409) if one of your shipments that is not deleted already has the same `shop.order_id`; defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: ensure_unique_marketplace_order_number
        description: Whether to reject the shipment (409) if another shipment from the same shop integration already has this `shop.marketplace_order_number`; only applies to shipments from a byrd shop integration. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      summary: Create a shipment
  /v3/shipments/count:
    get:
      operationId: shipmentlistcountapiv3_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ShipmentCount'
