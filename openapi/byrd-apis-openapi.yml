          type: string
          readOnly: true
          description: Number of packaging units to pick; 0 until stock is allocated.
        total_items:
          type: string
          readOnly: true
          description: Number of physical items in the shipment; the contents of bundles are counted, the bundles themselves are not.
        total_non_branding_items:
          type: string
          readOnly: true
          description: Number of physical items in the shipment, not counting branding products such as flyers or stickers.
        total_skus:
          type: string
          readOnly: true
          description: Number of distinct products in the shipment, not counting bundles.
