          - other
          description: 'Reason a different packaging material was used than the one requested.


            - `too_big`: it was too big for the items

            - `too_small`: it was too small for the items

            - `not_available`: it was not available

            - `other`: another reason, given in `override_reason_text`'
        override_reason_text:
          type: string
          description: Explanation of why a different packaging material was used; required when `override_reason_code` is `other`.
        required:
          type: boolean
          description: Whether the warehouse has to use the packaging material (`true`, default) or may use a different one (`false`); a different one is used anyway when it is out of stock.
        type:
          type: string
          description: Type of the packaging material, filled in by byrd.
          nullable: true
        size:
          type: string
          description: Size group of the packaging material, filled in by byrd.
          nullable: true
      required:
      - code
      title: Packaging materials input
    Shipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the shipment (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        b2b_config:
          readOnly: true
          description: 'B2B configuration of the shipment: the B2B template it uses and your answers to it; `null` for B2C shipments.'
          allOf:
          - $ref: '#/components/schemas/B2BConfig'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the shipment has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/Checkpoints'
        container_code:
          type: string
          description: Code of the warehouse container the picked items are kept in until the shipment is packed.
        customs:
          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
          allOf:
          - $ref: '#/components/schemas/Customs'
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentDestinationAddress'
        errors:
          readOnly: true
          description: Errors blocking the shipment from progressing, for example a failed address validation or an allocation problem; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        insurance:
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
          allOf:
          - $ref: '#/components/schemas/Insurance'
        metrics:
          readOnly: true
          description: Item, SKU, pick and packaging-unit counts for the shipment.
          allOf:
          - $ref: '#/components/schemas/Metrics'
        notes:
          description: Free-text notes for your own use and packaging instructions for the warehouse.
          allOf:
          - $ref: '#/components/schemas/Notes'
        options:
          type: object
          properties:
            branding:
              type: boolean
              default: null
              description: Whether the shipment is packed with your branded packaging material; defaults to your account setting.
              nullable: true
            packaging:
              type: boolean
              default: null
              description: Whether the warehouse packs the items in packaging material; defaults to your account setting.
              nullable: true
            custom_handling:
              type: boolean
              default: false
              description: Whether the shipment is held for custom handling at the warehouse; it cannot be packed while this is `true`. Read-only for you.
              nullable: true
            auto_release:
              type: boolean
              default: null
              description: Whether the shipment is released to a warehouse automatically once it is created; if `false` or not sent, it normally stays `new` until you release it.
              nullable: true
            preferred_carrier:
              type: string
              default: null
              description: Carrier to send the shipment with, instead of the one byrd selects; see the list of carriers. Use it with caution, as a carrier that cannot serve the shipment leads to shipment errors.
              nullable: true
            incoterm:
              type: string
              default: null
              description: 'Incoterm passed to the carrier for international shipments.


                - `DAP`: delivered at place; the recipient pays import duties and taxes (default)

                - `DDP`: delivered duty paid; you pay them'
              nullable: true
            charge:
              type: string
              readOnly: true
              description: Whether byrd charges you for the shipment.
            fragile:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one fragile product.
            organic:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one organic product.
            grs:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one product that complies with the Global Recycled Standard (GRS).
            create_return_label:
              type: boolean
              readOnly: true
              description: Whether a return label is created for each parcel when the shipment is released; send it together with `print_return_label`.
            print_return_label:
              type: boolean
              readOnly: true
              description: Whether the return label is printed and packed with the shipment; requires `create_return_label` to be `true`, and has to be sent together with it.
            economy_fallback:
              type: boolean
              readOnly: true
              description: Whether the shipment is sent with the `standard` service when `economy` is not available for it; set on your account.
            not_before_date:
              type: string
              format: date-time
              readOnly: true
              description: Earliest date the shipment may be sent (ISO 8601, at midnight); `null` when there is no such date.
            not_later_date:
              type: string
              format: date-time
              readOnly: true
              description: Latest date and time the shipment has to be sent by (ISO 8601); `null` when not set.
            pickup_date:
              type: string
              format: date
              readOnly: true
              description: Date the carrier collects the shipment (ISO 8601), for B2B shipments; `null` when not scheduled.
            international:
              type: boolean
              default: null
              description: Whether the shipment needs a customs declaration because it crosses a customs border; `null` until the shipment is released.
              nullable: true
            has_dangerous_goods:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one item classified as dangerous goods.
            v3_packaging:
              type: boolean
              readOnly: true
              description: Whether the warehouse packs the shipment with the v3 packing process.
            requires_export_declaration:
              type: string
              readOnly: true
              description: Whether the shipment has to carry an export declaration; always `false` before the shipment is released.
            slam_compatible:
              type: string
              readOnly: true
              description: Whether the warehouse can pack the shipment on its automated labelling line; `null` until the shipment is released.
            autobag_compatible:
              type: string
              readOnly: true
              description: Whether the warehouse can pack the shipment with its automatic bagging machine.
            partial_fulfillment:
              type: string
              readOnly: true
              description: Whether the shipment was split off so that part of an order could be sent while the rest waits.
            expired_stock_allowed:
              type: boolean
              readOnly: true
              description: Whether the shipment may be fulfilled with expired stock; defaults to `false`.
            pickup_date_from:
              type: string
              format: date
              readOnly: true
              description: First day of the window in which the shipment will be collected (ISO 8601), for B2B shipments; set with the schedule pickup endpoint.
            pickup_date_to:
              type: string
              format: date
              readOnly: true
              description: Last day of the window in which the shipment will be collected (ISO 8601), for B2B shipments; set with the schedule pickup endpoint.
            self_pickup_by_customer:
              type: boolean
              readOnly: true
              description: Whether you collect the shipment from the warehouse yourself instead of a carrier, for B2B shipments; set with the schedule pickup endpoint.
            shipping_label_mode:
              type: string
              readOnly: true
              description: 'How the shipping label is obtained.


                - `auto`: byrd creates it with the carrier

                - `manual`: byrd uploads it, for example for `pickup` shipments'
          description: Fulfilment and shipping options set on the shipment.
          nullable: true
        origin:
          type: string
          readOnly: true
          description: 'How the shipment was created; `null` for shipments created before this was recorded.


            - `api`: through the API with an API key

            - `manual`: in the byrd dashboard

            - `integration`: by a byrd shop integration'
        byrd_id:
          type: string
          readOnly: true
          description: Short human-readable identifier of the shipment, shown in the dashboard and printed on warehouse documents.
          example: ABCD12345
        priority:
          type: integer
          readOnly: true
          description: Picking priority in the warehouse, from 0 (normal) to 40 (highest); rises automatically once the shipping deadline is reached. `null` until the shipment is released.
          example: 10
        return_address:
          readOnly: true
          description: Address of the fulfilling warehouse that returns are sent to; `null` until the shipment is released.
          allOf:
          - $ref: '#/components/schemas/ReturnAddress'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentShop'
        status:
          type: string
          readOnly: true
          description: 'Current status of the shipment.


            - `new`: created and not yet released to a warehouse

            - `releasing`: being released to a warehouse

            - `released`: released and waiting to be picked

            - `picking`: items are being picked

            - `packaging`: being packed

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: a return shipment was created

            - `returned`: the return arrived at the warehouse

            - `deleted`: deleted'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `validating_address`, `address_invalid`, `recalled`: while `new`

            - `reserved`, `allocating`, `allocated`, `assigned`, `inbounding`, `inbound_error`: while `released`

            - `label_error`, `error_resolved`, `autobag_failed`: while `packaging`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `manual_outbound`, `waiting_for_pickup`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`

            - `claim_reported`: a support claim is open, while `sent` or `delivered`'
        units:
          readOnly: true
          description: Physical parcels or pallets the shipment is packed into, each with its own tracking information.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetail'
        warnings:
          readOnly: true
          description: Problems that do not block the shipment, for example an address validation error on a shipment released anyway, or the reason it was recalled.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        warehouse:
          readOnly: true
          description: Warehouse fulfilling the shipment; its fields are `null` until a warehouse is assigned.
          allOf:
          - $ref: '#/components/schemas/ShipmentWarehouse'
        user:
          readOnly: true
          description: byrd account the shipment belongs to.
          allOf:
          - $ref: '#/components/schemas/ShipmentUser'
        dangerous_goods:
          readOnly: true
          description: Dangerous goods totals for the shipment.
          allOf:
          - $ref: '#/components/schemas/DGDetails'
        cash_on_delivery:
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
          allOf:
          - $ref: '#/components/schemas/CashOnDelivery'
        total_value:
          readOnly: true
          description: Total value of the items (unit price × quantity), converted to EUR.
          allOf:
          - $ref: '#/components/schemas/CashOnDeliveryPrice'
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterials'
          nullable: true
        user_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        documents:
          writeOnly: true
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/Document'
        warehouse_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
          nullable: true
        warehouse_user_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the warehouse worker assigned to pick the shipment.
          nullable: true
        pickup_point:
          type: object
          default: null
          writeOnly: true
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
          nullable: true
        items:
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/Item'
      required:
      - destination_address
      - items
      title: Shipment
    ShipmentInput:
      type: object
      properties:
        customs:
          type: object
          properties:
            invoice_number:
              type: string
              description: Commercial invoice number of the order, printed on the customs documents.
            goods_type:
              type: string
              default: other
              enum:
              - document
              - gift
              - sample
              - remand
              - other
              description: 'Type of goods in the shipment, declared to customs; defaults to `other`.


                - `document`: documents only

                - `gift`: a gift

                - `sample`: commercial samples

                - `remand`: goods sent back

                - `other`: anything else, such as sold goods'
            export_mrn:
              type: string
              maxLength: 18
              description: Movement Reference Number (MRN) of the export declaration filed for the shipment, passed to the carrier; up to 18 characters.
              nullable: true
            has_electronic_export_notification:
              type: boolean
              description: Whether an electronic export declaration was filed for the shipment; passed to the carrier.
              nullable: true
          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
          nullable: true
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateDestinationAddress'
        documents:
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUpdateDocument'
        insurance:
          type: object
          properties:
            value:
              type: number
              description: Value of the whole shipment it is insured for, in `currency`.
            currency:
              type: string
              description: Currency of `value` (ISO 4217), for example `EUR`.
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
          nullable: true
        items:
          minItems: 1
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/ItemInput'
        notes:
          type: object
          properties:
            customer_note:
              type: string
              description: Note for your own use, shown in the dashboard; it is not sent to the recipient or shown to the warehouse.
              nullable: true
            packaging_instructions:
              type: string
              readOnly: true
              description: Packing instructions for the warehouse, from the account settings of the customer; not taken from the request. Not returned to customers.
            label_error_note:
              type: string
              readOnly: true
              description: Instructions byrd gave the warehouse when resolving a label error on the shipment; `null` when there are none.
          description: Free-text notes for your own use and packaging instructions for the warehouse.
          nullable: true
        options:
          description: Fulfilment and shipping options set on the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateOptions'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentInputShop'
        user_id:
          type: string
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        warehouse_id:
          type: string
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
        cash_on_delivery:
          type: object
          properties:
            price:
              description: Total amount the carrier collects from the recipient; only `EUR` is supported.
              allOf:
              - $ref: '#/components/schemas/CashOnDeliveryPrice'
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
          nullable: true
        pickup_point:
          type: object
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
          nullable: true
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterialsInput'
      required:
      - destination_address
      - items
      title: Shipment input
    ShipmentInputShop:
      type: object
      properties:
        type:
          type: string
          description: Type of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        order_number:
          type: string
          description: Order number in your shop or order system, shown in the Order column of the dashboard.
        order_id:
          type: string
          description: Any other identifier of the order in your system; not shown in the dashboard.
        marketplace_order_number:
          type: string
          description: Order number given by the marketplace the order was sold on, when that is not the system sending the shipment, for example the Amazon order number of an order forwarded by a connected shop. Returns are labelled with it, which lets the warehouse match a return to the shipment; send it in addition to `order_number` and `order_id`.
        marketplace:
          type: string
          description: Marketplace that `marketplace_order_number` belongs to, in lower case, for example `amazon`, `ebay` or `kaufland`. If you cannot tell it reliably, leave it out rather than guess.
      title: Shipment input shop
    ShipmentUnitDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the unit (UUID).
        items:
          description: Products packed in the unit; empty for units packed before items were recorded per unit.
          type: array
          items:
            $ref: '#/components/schemas/UnitItem'
        service:
          type: string
          description: 'Shipping service the unit is sent with; usually the shipment''s `service`, but it can differ when an economy fallback applies.


            - `standard`

            - `express`

            - `economy`

            - `pickup_point`

            - `pickup`

            - `amazon_prime`'
        carrier:
          description: Carrier the unit is sent with and its tracking details; the fields are `null` until a label is created.
          allOf:
          - $ref: '#/components/schemas/Carrier'
        parcel_id:
          type: string
          readOnly: true
          description: Unique 10-character alphanumeric identifier of the unit.
          example: A1B2C3D4E5
        type:
          type: string
          readOnly: true
          description: 'Kind of unit.


            - `parcel`: a parcel

            - `pallet`: a pallet'
        status:
          type: string
          readOnly: true
          description: 'Current status of the unit.


            - `new`: created and not yet packed and labelled

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: being returned to the warehouse

            - `returned`: the return arrived at the warehouse'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `label_error`, `error_resolved`: creating the label failed, or the failure was fixed; while `new` or `packaged`

            - `slam_ready`, `autobag_failed`: waiting for the SLAM machine, or the bagging machine failed; while `new`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `waiting_for_pickup`, `manual_outbound`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`'
        label_error_status:
          type: string
          readOnly: true
          description: 'Who byrd is waiting on to resolve the unit''s label error; `null` when there is no error or it has not been looked at yet.


            - `waiting_for_customer`: you have to fix or confirm something, such as the address or customs data

            - `waiting_for_warehouse`: the warehouse has to check the parcel

            - `waiting_for_carrier`: the carrier has to respond or fix something

            - `waiting_for_pricing`, `waiting_for_procurement`, `waiting_for_operations`, `waiting_for_engineering`: a byrd team has to act

            - `waiting_for_deletion`: the error will not be fixed and the unit will be deleted'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the unit has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/ShipmentUnitDetailCheckpoint'
        errors:
          readOnly: true
          description: Errors blocking the unit, such as a failed label creation; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        error_code:
          type: string
          readOnly: true
          description: Code of the error currently blocking the unit, for example `LC00` for a carrier error; `null` when there is none.
        slam:
          type: boolean
          readOnly: true
          description: Whether the unit is measured and labelled by a SLAM (scan, label, apply, manifest) machine.
        autobag:
          type: boolean
          readOnly: true
          description: Whether the unit is packed by an automatic bagging machine.
        dimensions:
          description: Outer dimensions (cm) and weight (kg) of the packed unit.
          allOf:
          - $ref: '#/components/schemas/UnitDimensions'
        pregenerated:
          type: boolean
          readOnly: true
          description: Whether the unit and its shipping label were created in advance, before packing.
        packaging_materials:
          description: Packaging materials the unit was packed with.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterials'
          nullable: true
        group_number:
          type: integer
          readOnly: true
          description: Number of the packing station group whose printer printed the unit's label; `null` until the unit is labelled.
        sequence_number:
          type: string
          readOnly: true
          description: Position of the unit among the shipment's units, starting at 1.
        metrics:
          readOnly: true
          description: Item and pick counts for the unit; `null` for units without recorded items.
          allOf:
          - $ref: '#/components/schemas/UnitMetrics'
      title: Shipment unit detail
    ShipmentUnitDetailCheckpoint:
      type: object
      properties:
        packaged_at:
          type: string
          format: date-time
          description: When the warehouse packed the unit.
        accepted_at:
          type: string
          format: date-time
          description: When the carrier first scanned the unit.
        delivered_at:
          type: string
          format: date-time
          description: When the carrier delivered the unit to the recipient.
        sent_at:
          type: string
          format: date-time
          description: When the unit left the warehouse.
        created_at:
          type: string
          format: date-time
          description: When the unit was created.
        label_error_occurred_at:
          type: string
          format: date-time
          description: When the unit's last label error occurred (ISO 8601, UTC); `null` when label creation never failed.
        label_error_resolved_at:
          type: string
          format: date-time
          description: When the unit's last label error was resolved; `null` when it never had one or it is not resolved yet.
        slam_prepared_at:
          type: string
          format: date-time
          description: When the packed unit was ready to be labelled by a SLAM machine; `null` for units not labelled by one.
      title: Shipment unit detail checkpoint
    ShipmentUpdateDestinationAddress:
      type: object
      properties:
        name:
          type: string
          description: Name of the recipient, if the recipient is a person.
          nullable: true
        company_name:
          type: string
          description: Company name of the recipient, if the recipient is a company.
          nullable: true
        email:
          type: string
          format: email
          description: Email address of the recipient; given to the carrier, which may use it to notify the recipient about the delivery.
          nullable: true
        phone:
          type: string
          description: Phone number, with the country code where possible, for example `+49 1234567890`. For a recipient, it is given to the carrier, and characters other than digits and `+` are removed.
          nullable: true
        street_name:
          type: string
          description: Name of the street, without the house number.
          nullable: true
        street_number:
          type: string
          description: House number.
          nullable: true
        city:
          type: string
          description: City.
          nullable: true
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country (ISO 3166-1 alpha-2), for example `DE`.
        address_addition:
          type: string
          description: Additional address details, such as building or floor.
          nullable: true
        postal_code:
          type: string
          description: Postal code. For countries with numeric postal codes, anything but digits is removed, such as a `DE-` prefix.
          nullable: true
        state:
          type: string
          description: State, province or region; `null` when not needed.
          nullable: true
      required:
      - country_code
      title: Shipment update destination address
    ShipmentUpdateDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the document (UUID). Send it to change an existing document; leave it out to add a new one.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        data_type:
          type: string
          description: 'File format of the document: `pdf`, `pdfb64` (base64-encoded PDF), `pdfurl`, `zpl`, `epl` or `jpeg`. Required for a new document; use `pdf` for documents you upload.'
        print_copies:
          type: integer
          default: 0
          description: Number of copies the warehouse prints automatically and packs with the shipment, from 0 to 10; defaults to 0 (not printed).
        format:
          type: string
          description: 'Printer the document is printed on: `document` (A4 paper) or `label` (label printer). Required when `print_copies` is greater than 0.'
        url:
          type: string
          format: url
          description: URL the document is downloaded from when it is printed, on an HTTP or FTP server without authentication. Required for a new document.
        name:
          type: string
          minLength: 4
          maxLength: 64
          pattern: ^[a-zA-Z0-9_\-]*$
          description: 'Name of the document: 4 to 64 characters, only letters, digits, `_` and `-` (no spaces).'
        meta:
          type: object
          description: Additional data about the document, such as the carrier, tracking number and tracking URL of a shipping or return label; the keys depend on `type`.
          additionalProperties: {}
        type:
          description: Type of document. Documents you upload to be printed use `consignment_note`, `delivery_note`, `export_document`, `proforma_invoice`, `supplement` or `other`; documents byrd creates use other types, such as `shipping_label`, `return_label`, `commercial_invoice` or `customs_cn23`.
          type: string
          enum:
          - amazon_fba
          - amazon_fba_box_label
          - amazon_fba_pallet_label
          - batch_packaging_summary
          - customs_cn22
          - customs_cn23
          - commercial_invoice
          - consignment_note
          - delivery_note
          - dhl_export_declaration_label
          - export_document
          - generic_large_label
          - other
          - pickup_confirmation
          - pickup_confirmation_template
          - proforma_invoice
          - proof_of_delivery
          - return_label
          - shipping_label
          - sku_relabelling
          - supplement
          - byrd_label
          - sequence_number_label
          - return_slip
        internal:
          type: boolean
          description: Whether byrd generated the document (`true`) or it was uploaded (`false`).
      required:
      - name
      - type
      title: Shipment update document
    ShipmentUpdateOptions:
      type: object
      properties:
        branding:
          type: boolean
          default: null
          description: Whether the shipment is packed with your branded packaging material; defaults to your account setting.
          nullable: true
        packaging:
          type: boolean
          default: null
          description: Whether the warehouse packs the items in packaging material; defaults to your account setting.
          nullable: true
        auto_release:
          type: boolean
          default: null
          description: Whether the shipment is released to a warehouse automatically once it is created; if `false` or not sent, it normally stays `new` until you release it.
          nullable: true
        preferred_carrier:
          type: string
          default: null
          description: Carrier to send the shipment with, instead of the one byrd selects; see the list of carriers. Use it with caution, as a carrier that cannot serve the shipment leads to shipment errors.
          nullable: true
        incoterm:
          type: string
          default: null
          enum:
          - DAP
          - DDP
          - null
          description: 'Incoterm passed to the carrier for international shipments.


            - `DAP`: delivered at place; the recipient pays import duties and taxes (default)

            - `DDP`: delivered duty paid; you pay them'
          nullable: true
        expired_stock_allowed:
          type: boolean
          default: null
          description: Whether the shipment may be fulfilled with expired stock; defaults to `false`.
          nullable: true
        create_return_label:
          type: boolean
          default: null
          description: Whether a return label is created for each parcel when the shipment is released; send it together with `print_return_label`.
          nullable: true
        print_return_label:
          type: boolean
          default: null
          description: Whether the return label is printed and packed with the shipment; requires `create_return_label` to be `true`, and has to be sent together with it.
          nullable: true
      title: Shipment update options
    ShipmentCount:
      type: object
      properties:
        count:
          type: integer
          readOnly: true
          description: Number of shipments that match the filters, up to 100000.
        capped:
          type: boolean
          readOnly: true
          description: Whether the number of matching shipments reached the limit of 100000, in which case `count` is the limit rather than the exact number.
      additionalProperties: false
      title: Shipment count
    ShipmentUpdate:
      type: object
      properties:
        customs:
          type: object
          properties:
            invoice_number:
              type: string
              description: Commercial invoice number of the order, printed on the customs documents.
            goods_type:
              type: string
              default: other
              enum:
              - document
              - gift
              - sample
              - remand
              - other
              description: 'Type of goods in the shipment, declared to customs; defaults to `other`.


                - `document`: documents only

                - `gift`: a gift

                - `sample`: commercial samples

                - `remand`: goods sent back

                - `other`: anything else, such as sold goods'
            export_mrn:
              type: string
              maxLength: 18
              description: Movement Reference Number (MRN) of the export declaration filed for the shipment, passed to the carrier; up to 18 characters.
              nullable: true
            has_electronic_export_notification:
              type: boolean
              description: Whether an electronic export declaration was filed for the shipment; passed to the carrier.
              nullable: true
          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
          nullable: true
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateDestinationAddress'
        documents:
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUpdateDocument'
        insurance:
          type: object
          properties:
            value:
              type: number
              description: Value of the whole shipment it is insured for, in `currency`.
            currency:
              type: string
              description: Currency of `value` (ISO 4217), for example `EUR`.
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
          nullable: true
        items:
          minItems: 1
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/ItemInput'
        notes:
          type: object
          properties:
            customer_note:
              type: string
              description: Note for your own use, shown in the dashboard; it is not sent to the recipient or shown to the warehouse.
              nullable: true
            packaging_instructions:
              type: string
              readOnly: true
              description: Packing instructions for the warehouse, from the account settings of the customer; not taken from the request. Not returned to customers.
            label_error_note:
              type: string
              readOnly: true
              description: Instructions byrd gave the warehouse when resolving a label error on the shipment; `null` when there are none.
          description: Free-text notes for your own use and packaging instructions for the warehouse.
          nullable: true
        options:
          description: Fulfilment and shipping options set on the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateOptions'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateShop'
        user_id:
          type: string
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        warehouse_id:
          type: string
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
        cash_on_delivery:
          type: object
          properties:
            price:
              description: Total amount the carrier collects from the recipient; only `EUR` is supported.
              allOf:
              - $ref: '#/components/schemas/CashOnDeliveryPrice'
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
          nullable: true
        pickup_point:
          type: object
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
          nullable: true
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterialsInput'
      required:
      - destination_address
      - items
      title: Shipment update
    ShipmentUpdateShop:
      type: object
      properties:
        id:
          type: string
          description: ID of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        type:
          type: string
          description: Type of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        order_number:
          type: string
          description: Order number in your shop or order system, shown in the Order column of the dashboard.
        order_id:
          type: string
          description: Any other identifier of the order in your system; not shown in the dashboard.
        marketplace_order_number:
          type: string
          description: Order number given by the marketplace the order was sold on, when that is not the system sending the shipment, for example the Amazon order number of an order forwarded by a connected shop. Returns are labelled with it, which lets the warehouse match a return to the shipment; send it in addition to `order_number` and `order_id`.
        marketplace:
          type: string
          description: Marketplace that `marketplace_order_number` belongs to, in lower case, for example `amazon`, `ebay` or `kaufland`. If you cannot tell it reliably, leave it out rather than guess.
      title: Shipment update shop
    ShipmentBatchRelease:
      type: object
      properties:
        shipment_ids:
          type: array
          minItems: 1
          description: IDs of the shipments (UUIDs); at least one.
          items:
            type: string
            format: uuid
        warehouse_id:
          type: string
          format: uuid
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
          nullable: true
      required:
      - shipment_ids
      title: Shipment batch release
    ShipmentBatch:
      type: object
      properties:
        shipment_ids:
          type: array
          minItems: 1
          description: IDs of the shipments (UUIDs); at least one.
          items:
            type: string
            format: uuid
      required:
      - shipment_ids
      title: Shipment batch
    ShipmentRecall:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        reason:
          type: string
          default: null
          enum:
          - stock_inaccurate
          - stock_expired
          - null
          description: 'Reason for the recall; optional for you.


            - `stock_inaccurate`: the stock recorded for an item is wrong

            - `stock_expired`: the stock of an item has expired'
          nullable: true
        reset:
          type: boolean
          default: false
          description: 'Whether to undo the picking and packing of a shipment the warehouse has already started on before recalling it. Reserved for byrd: requests from your account with `true` are rejected (403).'
      title: Shipment recall
    SchedulePickup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        self_pickup:
          type: boolean
          default: false
          description: Whether you collect the shipment from the warehouse yourself instead of a carrier; defaults to `false`.
        carrier:
          type: string
          description: Name of the carrier collecting the shipment; `null` if not known.
          nullable: true
        carrier_tracking_url:
          type: string
          format: url
          description: Tracking URL from the carrier collecting the shipment; `null` if there is none.
          nullable: true
        carrier_tracking_number:
          type: string
          description: Tracking number from the carrier collecting the shipment; `null` if there is none.
          nullable: true
        pickup_date_from:
          type: string
          format: date
          x-minimum: '2026-09-24'
          description: First day the shipment can be collected (ISO 8601); today or later.
        pickup_date_to:
          type: string
          format: date
          x-minimum: '2026-09-24'
          description: Last day the shipment can be collected (ISO 8601); today or later, and also used as the planned sent date.
      required:
      - pickup_date_from
      - pickup_date_to
      title: Schedule pickup
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the byrd account (UUID).
        company_name:
          type: string
          description: Company name of the byrd account.
      title: Customer
    ShipmentUnitList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
