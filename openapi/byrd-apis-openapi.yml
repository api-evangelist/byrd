          type: string
          description: Description of the item, used on customs documents for international shipments.
          nullable: true
        customs:
          type: object
          properties:
            customsTariffNumber:
              type: string
              description: Harmonised System (HS) tariff number of the product.
            originCountryCode:
              type: string
              pattern: ^[A-Z]{2}$
              description: Country the product originates from, as an ISO 3166-1 alpha-2 code.
