    ShipmentDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        name:
          type: string
          minLength: 4
          maxLength: 64
          pattern: ^[a-zA-Z0-9_\-]*$
          description: 'File name of the document, without extension: 4 to 64 letters, digits, `_` or `-`; no spaces.'
        dataType:
          type: string
          enum:
          - pdf
          - pdfb64
          - zpl
          - epl
          description: 'File format of the document.


            - `pdf`: PDF file

            - `pdfb64`: PDF file encoded as base64

            - `zpl`: ZPL label for thermal printers

            - `epl`: EPL label for thermal printers'
        type:
          description: Type of the document, for example `shipping_label`, `delivery_note`, `commercial_invoice` or `proforma_invoice`.
          type: string
          enum:
          - amazon_fba
          - amazon_fba_box_label
          - amazon_fba_pallet_label
          - customs_cn22
          - customs_cn23
          - commercial_invoice
          - consignment_note
          - delivery_note
          - other
          - proforma_invoice
          - return_label
          - shipping_label
          - supplement
          - export_document
          - pickup_confirmation
          - pickup_confirmation_template
          - byrd_label
          - sequence_number_label
          - return_slip
          - generic_large_label
          - batch_packaging_summary
          - sku_relabelling
          - dhl_export_declaration_label
          - proof_of_delivery
        url:
          type: string
          format: url
          writeOnly: true
          description: 'URL the document is downloaded from when it is printed: an HTTP or FTP server without authentication. Write-only.'
        toBePrinted:
          type: boolean
          description: Whether the warehouse prints the document automatically when packing the shipment.
        copies:
          type: integer
          minimum: 0
          maximum: 10
          description: Number of copies printed automatically when the shipment is packed, from 0 to 10; above 0 when `toBePrinted` is `true`.
        outputType:
          type: string
          enum:
          - document
          - label
          - ''
          description: 'Format the document is printed in; required when `toBePrinted` is `true`. Send an empty string to unset it.


            - `document`: printed on a regular (A4) printer

            - `label`: printed on a label printer'
        meta:
          type: object
          readOnly: true
          description: Additional information byrd keeps about the document; its content depends on the document type.
          additionalProperties: {}
      required:
      - dataType
      - name
      - type
      - url
      title: Shipment document
    ShipmentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        amount:
          type: integer
          minimum: 1
          description: Number of units to ship; at least 1. For an item inside a bundle, the number per bundle.
        byrdProduct:
          type: object
          readOnly: true
          description: byrd product of the item, as an object holding its `id`.
          additionalProperties: {}
        byrdProductID:
          type: string
          format: uuid
          description: ID of the byrd product (UUID). Send this or `sku` to identify the product.
          nullable: true
        sku:
          type: string
          description: SKU of the product in byrd. Send this or `byrdProductID` to identify the product.
          nullable: true
        productName:
          type: string
          description: Name of the product.
          nullable: true
