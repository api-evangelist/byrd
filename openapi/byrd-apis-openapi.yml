        customsMRN:
          type: string
          pattern: ^[0-9]{2}GB[A-Z0-9]{14}\Z
          description: 'UK customs Movement Reference Number (MRN) of the goods: 18 characters, two digits for the year, `GB`, then 14 uppercase letters or digits. Only allowed for deliveries to a warehouse in the United Kingdom; you can set it while the delivery is `announced` or `atWarehouse`, including with a partial update after arrival. `null` when not provided.'
          example: 25GB1234567890ABCD
          nullable: true
        description:
          type: string
          description: Free-text summary of the contents of the delivery; `null` when not provided.
          nullable: true
        expectedDeliveryDateFrom:
          type: string
          format: date-time
          description: Start of the window in which the delivery is expected to arrive at the warehouse (ISO 8601, UTC). For `container` deliveries it must equal `expectedDeliveryDateTo`. Customers can only change it while the delivery is `announced`.
        expectedDeliveryDateTo:
          type: string
          format: date-time
          description: End of the window in which the delivery is expected to arrive at the warehouse (ISO 8601, UTC). For `container` deliveries it must be a business day at least 10 business days from now. Customers can only change it while the delivery is `announced`.
        expressInbounding:
          type: boolean
          description: Whether express inbounding is requested. Always send `false`.
        isInternational:
          type: boolean
          description: Whether the goods cross a border into the warehouse's country. Only for deliveries to a warehouse in the United Kingdom, where it is required when announcing or fully updating the delivery. When `true`, `senderName` and `senderAddress` are required and the warehouse cannot inbound the delivery until `customsMRN` is provided. Customers can still declare it `true` with a partial update after the delivery has left `announced`, but not change it back once the goods have arrived. `null` when it does not apply.
          nullable: true
        referenceNumber:
          type: string
          description: Your own reference for the delivery, such as a purchase order number; `null` when not provided.
          nullable: true
        requiresCounting:
          type: boolean
          description: Whether the warehouse counts every item on arrival; charges may apply. When `false`, stock is booked as announced and byrd is not liable for discrepancies. Defaults to `true`; cannot be `true` together with `requiresSampling`. Customers can only change it while the delivery is `announced`.
          nullable: true
        requiresSampling:
          type: boolean
          description: Whether the warehouse checks a representative sample of the goods on arrival instead of counting every item. Defaults to `false`; cannot be `true` together with `requiresCounting`. Customers can only change it while the delivery is `announced`.
          nullable: true
        senderAddress:
          type: string
          description: Address the delivery is sent from; required for international deliveries, otherwise `null` when not provided. Part of the customs declaration, so customers can still change it with a partial update after the delivery has left `announced`.
          nullable: true
        senderName:
          type: string
