        name:
          type: string
          description: Name of the product; replaced by the name stored on the product. Required for custom bundles and their items.
        price:
          description: Retail price of one unit, used for customs documents and insurance; it is multiplied by `quantity`. Required for custom bundles.
          allOf:
          - $ref: '#/components/schemas/CarrierShippingRate'
        dimensions:
          description: Dimensions and weight of one unit of the product; missing values are taken from the product, and the weight stored on the product always replaces the one sent.
          allOf:
          - $ref: '#/components/schemas/Dimensions'
        customs:
          description: Customs details of the product, needed for shipments leaving the EU or the UK; taken from the product when not sent.
          allOf:
          - $ref: '#/components/schemas/ItemCustoms'
        lot_number:
          type: string
          description: Lot the units have to be picked from; if not sent, byrd chooses lots first in, first out (FIFO).
        serial_number_tracked:
          type: boolean
          readOnly: true
          description: Whether serial numbers are recorded for the item when it is packed; set from the serial number setting of the product.
        dangerous_goods:
