    ReturnShipmentAnnounced:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        shipment_id:
          type: string
          format: uuid
          description: ID of the shipment being returned (UUID). The shipment must be yours and must have been sent.
        send_documents_to_email:
          type: string
          format: email
          description: Email address the return label is sent to once it is generated. `null` when the return was announced with `send_email` set to `false`.
          nullable: true
        documents_email_language:
          type: string
          maxLength: 2
          description: Language of the email carrying the return label and of the label itself, as an ISO 639-1 two-letter code, for example `de`. `en`, `de` and `fr` are supported and any other value falls back to English. When `null`, the language is taken from the destination country of the shipment, falling back to English.
        portal_tier:
          type: string
          enum:
          - basic
          - pro
          - null
          description: Returns Portal tier the return was announced through, `basic` or `pro`; `null` when the return was not announced through the Returns Portal.
          nullable: true
        label_type:
          type: string
          enum:
          - byrd_label
          - identifier_only
          description: 'Kind of return label generated for the return. Defaults to `byrd_label`.


            - `byrd_label`: carrier shipping label for `courier`.

            - `identifier_only`: a return slip whose cut-off strip identifies the return to the warehouse; it is not a shipping label and has no tracking number.'
        courier:
          type: string
          enum:
          - amazon_prime
          - asendia_global
          - brt_it
          - colissimo_fr
          - correos_es
          - dbschenker_global
          - delivengo_fr
          - derkurier_de
          - dhl_de
          - dhlexpress_de
          - dpd_at
          - dpd_de
          - dpd_gb
          - exporto_global
          - fedex_global
          - gls_global
          - mondialrelay_fr
          - parcelforce_gb
          - post_at
          - post_de
          - post_it
          - post_nl
          - royalmail_gb
          - schneckenpost_de
          - sendcloud_global
          - seur_es
          - sevensenders_global
          maxLength: 64
          description: Carrier the return is shipped with. Must be a carrier enabled for your account, the warehouse and the destination country; ask your byrd contact person which value applies to you.
        status:
          type: string
          description: 'Current status of the return.


            - `announced`: the return was announced and has not been processed by the warehouse yet.

            - `confirmed`: the warehouse received and confirmed the return.

            - `cancelled`: the confirmed return was cancelled.'
        return_type:
          type: string
          description: 'Type of the return.


            - `customer`: the recipient sends the shipment back; every return announced through this API has this type.

            - `courier`: the carrier sent the shipment back after a failed delivery.'
        reason:
          type: string
          description: Reason for the return; always `customer` for a return announced by the recipient. The reason for each item is in `items_announced`.
        items_announced:
          description: Items of the shipment that are being returned, with their amounts; at least one. Each shipment item can be announced in only one return.
          type: array
          items:
            $ref: '#/components/schemas/ItemsAnnounced'
        documents:
          readOnly: true
          description: Documents generated for the return, such as the return label. Usually empty right after announcing, because the documents are generated a few seconds later.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentAnnouncedDocument'
      required:
      - send_documents_to_email
      - shipment_id
      title: Return shipment announced
