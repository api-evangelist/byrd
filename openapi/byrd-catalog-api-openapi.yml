openapi: 3.2.0
info:
  description: The byrd APIs for managing products, inbound deliveries, shipments and returns.
  contact:
    email: info@getbyrd.com
    name: General company contact
    url: https://getbyrd.com/kontakt/
  license:
    name: Copyright byrd technologies GmbH
  termsOfService: https://getbyrd.com/agb/
  version: '20260924'
  title: byrd Catalog API
servers:
- description: Production server
  url: https://api.getbyrd.com/
security:
- tokenAuth: []
tags:
- name: Catalog
  description: Products and bundles, their lots, serial numbers and stock, and the dangerous goods limits that apply to them.
paths:
  /v2/warehouse/dangerous-goods-limits:
    get:
      operationId: dangerousgoodsunitlimitsapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DangerousGoodsLimits'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns the UN numbers byrd can ship and the maximum quantity of

        each a single product may contain. Use them in the `dangerousGoods`

        of your products.'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      summary: List the supported dangerous goods
  /v2/warehouse/lots:
    get:
      operationId: lotlistapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lot'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns the lots of your products with their stock levels, so a

        product appears once per lot. Set `warehouse_details=true` to get

        the stock of each lot per warehouse.'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: product_id
        description: Only include lots of this product.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: activated
        description: Only include lots that are (`true`) or are not (`false`) activated.
        schema:
          type: boolean
        required: false
      - in: query
        name: warehouse_details
        description: Whether to include the stock of each lot per warehouse in `warehouses`. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: List lots
    post:
      operationId: lotlistapi_post
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Lot'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Creates a lot (batch) for one of your physical products. The lot

        number must be unique for the product.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lot'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      summary: Create a lot
  /v2/warehouse/lots/{lot_id}:
    get:
      operationId: lotdetailapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Lot'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns one of your lots. Deleted lots, and lots of deleted

        products, are not found.'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the lot (UUID).
      summary: Get a lot
    patch:
      operationId: lotdetailapi_patch
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Lot'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Changes only the fields you send. Set `activated` to `false` to stop

        units of the lot from being shipped, and back to `true` to allow it

        again.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotUpdate'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the lot (UUID).
      summary: Update a lot
  /v2/warehouse/products:
    get:
      operationId: productsapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Product'
                - $ref: '#/components/schemas/PaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns your products with their stock levels, paginated. Deleted

        products and packaging materials are left out unless you ask for

        them. See the Listing products guide.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: include_storages
        description: Whether to include the `storages` holding the product. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: include_lots
        description: Whether to include the `lots` of each product. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: include_deleted
        description: Whether to include deleted products. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: include_non_deliverable
        description: Whether to include products that cannot be delivered to a warehouse themselves, such as bundles. Defaults to `true`.
        schema:
          type: boolean
          default: true
        required: false
      - in: query
        name: include_packaging_material
        description: Whether to include packaging materials. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: only
        description: Fields to return, as a comma-separated list of field names or dotted paths to nested fields, for example `id,sku,packagingUnits`. All fields are returned when omitted.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: active
        description: Only include products that are (`true`) or are not (`false`) active.
        schema:
          type: boolean
        required: false
      - in: query
        name: bsku
        description: Only include the product with this byrd SKU.
        schema:
          type: string
        required: false
      - in: query
        name: productID
        description: Only include products with this (deprecated) shop article ID.
        schema:
          type: string
        required: false
      - in: query
        name: variantID
        description: Only include products with this (deprecated) shop article variant ID.
        schema:
          type: string
        required: false
      - in: query
        name: sku
        description: Only include the product with exactly this SKU.
        schema:
          type: string
        required: false
      - in: query
        name: skus
        description: Only include the products with these comma-separated SKUs; combined with `ids`, products matching either list are included.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: ids
        description: Only include the products with these comma-separated IDs; combined with `skus`, products matching either list are included.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: exclude_skus
        description: Exclude the products with these comma-separated SKUs. Cannot be combined with `ids` or `skus`.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: exclude_ids
        description: Exclude the products with these comma-separated IDs. Cannot be combined with `ids` or `skus`.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: shopID
        description: Only include products linked to this shop.
        schema:
          type: string
        required: false
      - in: query
        name: shop_ids
        description: Only include products linked to one of these comma-separated shop IDs.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: userID
        description: Only include products owned by this user.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: productType
        description: Only include products of this type, for example `product` or `bundle`.
        schema:
          type: string
          enum:
          - product
          - alias
          - supplementary
          - marketing
          - branding
          - packaging_material
          - prepacked_product
          - bundle
        required: false
      - in: query
        name: organic
        description: Only include products that are (`true`) or are not (`false`) organic.
        schema:
          type: boolean
        required: false
      - in: query
        name: grs
        description: Only include products that are (`true`) or are not (`false`) GRS compliant.
        schema:
          type: boolean
        required: false
      - in: query
        name: lotsEnabled
        description: Only include products with lot tracking enabled (`true`) or disabled (`false`).
        schema:
          type: boolean
        required: false
      - in: query
        name: warehouse_ids
        description: Only include products stocked in one of these comma-separated warehouse IDs; the stock levels then only count those warehouses.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: change_requested
        description: Only include products with at least one change request; only `true` is accepted.
        schema:
          type: boolean
          enum:
          - true
        required: false
      - in: query
        name: change_request_status
        description: 'Only include products with a change request in this status.


          - `open`

          - `accepted`

          - `declined`'
        schema:
          type: string
          enum:
          - open
          - accepted
          - declined
        required: false
      - in: query
        name: change_request_statuses
        description: 'Only include products with a change request in one of these comma-separated statuses: `open`, `accepted`, `declined`.'
        schema:
          type: array
          items:
            type: string
            enum:
            - open
            - accepted
            - declined
        required: false
        explode: false
        style: form
      - in: query
        name: isDangerousGoods
        description: Only include products that do (`true`) or do not (`false`) have dangerous goods entries.
        schema:
          type: boolean
        required: false
      - in: query
        name: physicalStockMin
        description: Only include products with at least this physical stock; at least 0 and not above `physicalStockMax`.
        schema:
          type: integer
          minimum: 0
        required: false
      - in: query
        name: physicalStockMax
        description: Only include products with at most this physical stock; at least 0.
        schema:
          type: integer
          minimum: 0
        required: false
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: List your products
    post:
      operationId: productsapi_post
      responses:
        '201':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Creates a product, or a bundle when `productType` is `bundle`. The

        SKU must match the one your sales channel sends on its order lines,

        otherwise orders for it cannot be released.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/Product'
      x-byrd-roles:
      - service
      - customer
      - customer_support
      - warehouse_support
      - admin
      summary: Create a product
  /v2/warehouse/products/{bundle_id}/bundles:
    get:
      operationId: bundlelistapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bundle'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns each product the bundle is made of, with its quantity. Fails

        when the product is not a bundle.'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: bundle_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the bundle product (UUID).
      summary: List the ingredients of a bundle
    post:
      operationId: bundlelistapi_post
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Bundle'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: Adds one of your products to the bundle with the given quantity.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bundle'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: bundle_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the bundle product (UUID).
      summary: Add an ingredient to a bundle
    put:
      operationId: bundlelistapi_put
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bundle'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: Replaces all ingredients of the bundle with the ones you send.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Bundle'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: bundle_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the bundle product (UUID).
      summary: Set the ingredients of a bundle
  /v2/warehouse/products/{bundle_id}/bundles/{ingredient_id}:
    get:
      operationId: bundledetailsapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Bundle'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: Returns the ingredient product and its quantity in the bundle.
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: bundle_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the bundle product (UUID).
      - name: ingredient_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the ingredient product in the bundle (UUID).
      summary: Get an ingredient of a bundle
    delete:
      operationId: bundledetailsapi_delete
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'The ingredient product itself is not deleted. Fails with `400` when

        `bundle_id` is not a bundle.'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: bundle_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the bundle product (UUID).
      - name: ingredient_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the ingredient product in the bundle (UUID).
      summary: Remove an ingredient from a bundle
  /v2/warehouse/products/{product_id}:
    get:
      operationId: productapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns the details and stock levels of one of your products, also

        when it was deleted.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: include_storages
        description: Whether to include the `storages` holding the product. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: only
        description: Fields to return, as a comma-separated list of field names or dotted paths to nested fields, for example `id,sku,packagingUnits`. All fields are returned when omitted.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - name: product_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the product (UUID).
      summary: Get a product
    put:
      operationId: productapi_put
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Behaves exactly like `PATCH`: only the fields you send are changed.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/Product'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the product (UUID).
      summary: Update a product
    patch:
      operationId: productapi_patch
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Changes only the fields you send. Also used to answer the change

        requests of the warehouse, through `changeRequests`.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/Product'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the product (UUID).
      summary: Update a product
    delete:
      operationId: productapi_delete
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Only possible once no stock of the product is stored any more and

        it is not an ingredient of a bundle. Deleted products are only

        listed with `include_deleted=true`.'
      x-byrd-roles:
      - admin
      - service
      - customer
      - customer_support
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the product (UUID).
      summary: Delete a product
  /v2/warehouse/products/{product_id}/serial-numbers:
    get:
      operationId: productserialnumbersapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/SerialNumberInventory'
                - $ref: '#/components/schemas/PaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns the serial numbers recorded for units of the product in

        inventory, paginated. Use `outbounded` to tell units still in stock

        from shipped ones, and `q` to search for a serial number.'
      x-byrd-roles:
      - customer
      - service
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: outbounded
        description: Only include serial numbers that have (`true`) or have not (`false`) been shipped out of the warehouse.
        schema:
          type: boolean
        required: false
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      - name: product_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the product (UUID).
      summary: List the serial numbers of a product
  /v2/warehouse/products/{product_id}/stats:
    get:
      operationId: productstatsapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProductStats'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Catalog
      description: 'Returns when the product was last picked and last restocked, and

        how many units are in deliveries not inbounded yet, optionally for

        a single warehouse.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: warehouseID
