          - delivery_note
          - signed_delivery_note
          - order
          - packing_list
          - customs
          - other
          description: 'Kind of document. Signed delivery notes are added by the warehouse and are read-only for you.


            - `invoice`: invoice

            - `delivery_note`: delivery note

            - `signed_delivery_note`: delivery note signed on arrival

            - `order`: purchase order

            - `packing_list`: packing list

            - `customs`: customs document

            - `other`: any other document'
        fileType:
          type: string
          enum:
          - jpg
          - jpeg
          - png
          - pdf
          - csv
          - txt
          description: 'Format of the file. Cannot be changed after the document is created.


            - `pdf`

            - `jpg`

            - `jpeg`

            - `png`

            - `csv`

            - `txt`'
        url:
          type: string
          description: HTTPS URL of the uploaded file. It must point to byrd's file storage and have no query parameters. Cannot be changed after the document is created.
        readOnly:
          type: boolean
          readOnly: true
          description: Whether the document is read-only for you, so you cannot update or delete it.
        userID:
          type: string
          description: 'ID of the user who uploaded the document (UUID). For customers, documents are always recorded as uploaded by them and the uploader cannot be changed: any value they send is ignored.'
