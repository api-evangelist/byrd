openapi: 3.2.0
info:
  description: The byrd APIs for managing products, inbound deliveries, shipments and returns.
  contact:
    email: info@getbyrd.com
    name: General company contact
    url: https://getbyrd.com/kontakt/
  license:
    name: Copyright byrd technologies GmbH
  termsOfService: https://getbyrd.com/agb/
  version: '20260924'
  title: byrd Inbound API
servers:
- description: Production server
  url: https://api.getbyrd.com/
security:
- tokenAuth: []
tags:
- name: Inbound
  description: 'Deliveries of your stock to a warehouse: announce them, follow them in, and manage their documents.'
paths:
  /v2/warehouse/deliveries:
    get:
      operationId: deliveriesapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/DeliveryWithMetrics'
                - $ref: '#/components/schemas/PaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Returns your deliveries, the inbound shipments of stock you send to a

        warehouse, with their items, containers and metrics. Filter them with

        the query parameters and use `only` to return fewer fields. See

        Listing deliveries.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: include_deleted
        description: Whether to include cancelled deliveries. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: include_items
        description: Whether to include `deliveryItems` in each delivery. Defaults to `true`; set it to `false` for faster responses when deliveries have many items.
        schema:
          type: boolean
          default: true
        required: false
      - in: query
        name: include_containers
        description: Whether to include `deliveryContainers` in each delivery. Defaults to `true`.
        schema:
          type: boolean
          default: true
        required: false
      - in: query
        name: product_ids
        description: Only deliveries that contain at least one of these products (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_ids
        description: Only deliveries to these warehouses (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: status
        description: Only deliveries in one of these statuses (see `status`).
        schema:
          type: array
          items:
            type: string
            enum:
            - announced
            - atWarehouse
            - inProcessing
            - completed
            - deleted
        required: false
        explode: false
        style: form
      - in: query
        name: user_id
        description: Only deliveries of this user (UUID). Cannot be combined with `user_ids`. You only ever see your own deliveries.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: user_ids
        description: Only deliveries of these users (UUIDs). Cannot be combined with `user_id`. You only ever see your own deliveries.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: type
        description: 'Only deliveries of this type.


          - `container`: deliveries arriving in a shipping container

          - `regular`: all other deliveries'
        schema:
          type: string
          enum:
          - container
          - regular
        required: false
      - in: query
        name: sku
        description: Only deliveries that contain the product with this SKU.
        schema:
          type: string
        required: false
      - in: query
        name: barcode
        description: Only deliveries that contain a product with this barcode, either its main barcode or one of its additional barcodes.
        schema:
          type: string
        required: false
      - in: query
        name: first_inbound_only
        description: Whether to return only the first delivery inbounded into each warehouse, per customer. Deliveries that were never inbounded are left out; deliveries inbounded at the same earliest time are all returned. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: colli_discrepancy
        description: Whether to return only deliveries where the number of boxes and pallets counted on arrival differs from the number of containers announced. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: sort_by
        description: 'Field to sort the deliveries by: `createdAt`, `updatedAt`, `expectedDeliveryDateFrom`, `atWarehouseDateTime`, `inProcessingDateTime`, `inboundedDateTime`, `inboundingDeadline` or `aggregatedContainerStatus`.'
        schema:
          type: string
        required: false
      - in: query
        name: sort_order
        description: 'Sort direction.


          - `asc`: ascending

          - `desc`: descending'
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
      - in: query
        name: aggregated_container_status
        description: Only deliveries with this tracking status (see `aggregatedContainerStatus`). `pick_up` also matches deliveries that are not tracked.
        schema:
          type:
          - string
          - 'null'
          enum:
          - partially_delivered
          - pick_up
          - in_transit
          - out_for_delivery
          - delivered
          - delayed
          - failed_delivery
          - null
        required: false
      - in: query
        name: date_field
        description: 'Date field that `date_from` and `date_to` filter on. Defaults to `created_at`.


          - `created_at`: when the delivery was announced

          - `at_warehouse_at`: when the warehouse accepted it

          - `inbounded_at`: when it was completed

          - `status_updated_at`: when its status last changed'
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - at_warehouse_at
          - inbounded_at
          - status_updated_at
        required: false
      - in: query
        name: date_from
        description: Only deliveries whose `date_field` is at or after this time (ISO 8601, UTC). Must be before `date_to`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: date_to
        description: Only deliveries whose `date_field` is before this time (ISO 8601, UTC).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: only
        description: Fields to return, as comma-separated dotted paths, for example `id,status,deliveryItems.product.sku`. All fields are returned when omitted.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: List deliveries
    post:
      operationId: deliveriesapi_post
      responses:
        '201':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DeliveryCreate'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Tells the warehouse what stock to expect, so the goods can be received

        against the delivery on arrival. Send the products in `deliveryItems`

        and the parcels or pallets in `deliveryContainers`; the delivery

        starts as `announced`. Print the delivery note and attach it to every

        parcel or pallet. See

        Announcing a delivery.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/DeliveryCreateRequest'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      summary: Announce a delivery
  /v2/warehouse/deliveries/{delivery_id}:
    get:
      operationId: deliveryapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DeliveryWithMetrics'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Returns one of your deliveries with its items, containers and

        metrics. Use `only` to return fewer fields. See

        Getting a delivery.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: only
        description: Fields to return, as comma-separated dotted paths, for example `id,status,deliveryItems.product.sku`. All fields are returned when omitted.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery (UUID).
      summary: Get a delivery
    put:
      operationId: deliveryapi_put
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Delivery'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Replaces the delivery, including all its items and containers, with

        the data you send. Only possible while the delivery is `announced`.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/DeliveryReplaceRequest'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery (UUID).
      summary: Replace a delivery
    patch:
      operationId: deliveryapi_patch
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Delivery'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Changes only the fields you send and returns them. As a customer,

        you can change a delivery only while it is `announced`, except for

        its customs declaration: `customsMRN`, `isInternational`,

        `senderName` and `senderAddress`. The customs MRN can only be set

        while the delivery is `announced` or `atWarehouse`, and an

        international delivery cannot be made domestic once it has arrived.

        To change the items or containers, replace the delivery with a full

        update.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
            schema:
              $ref: '#/components/schemas/DeliveryBase'
      x-byrd-roles:
      - service
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery (UUID).
      summary: Update a delivery
    delete:
      operationId: deliveryapi_delete
      responses:
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Undefined'
      tags:
      - Inbound
      description: 'Only a delivery still in `announced` can be cancelled; once the

        warehouse has accepted it, it can no longer be withdrawn. A cancelled

        delivery moves to `deleted`.'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery (UUID).
      summary: Cancel a delivery
  /v2/warehouse/deliveries/{delivery_id}/lots:
    get:
      operationId: deliverylotsapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryReceivedLot'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Returns one entry per lot received with the delivery and the amount

        received of it, ordered by SKU and lot number. Only products with

        lots enabled appear, and the list is empty until the delivery has

        been inbounded. See

        Listing the lots of a delivery.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery (UUID).
      summary: List the lots received in a delivery
  /v2/warehouse/delivery-documents:
    get:
      operationId: deliverydocumentsapi_get
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/DeliveryDocument'
                - $ref: '#/components/schemas/PaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Returns the documents attached to your deliveries, newest first by

        default. Pass `deliveryID` to list the documents of one delivery.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: deliveryID
        description: ID of the delivery to list the documents of (UUID); documents of all your deliveries are listed when omitted.
        schema:
          type:
          - string
          - 'null'
          default: null
        required: false
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      summary: List delivery documents
    post:
      operationId: deliverydocumentsapi_post
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DeliveryDocument'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'The file has to be uploaded beforehand; the document references it

        by its URL.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDocumentInput'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      summary: Attach a document to a delivery
  /v2/warehouse/delivery-documents/{document_id}:
    patch:
      operationId: deliverydocumentapi_patch
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DeliveryDocument'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Changes the name or type of the document, or moves it to another

        delivery you may access (for a customer, one of their own). Its file

        and URL cannot be changed, and customers cannot change its uploader.

        Read-only documents cannot be updated.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDocumentUpdate'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery document (UUID).
      summary: Update a delivery document
    delete:
      operationId: deliverydocumentapi_delete
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Detaches the document from its delivery. Read-only documents cannot

        be deleted.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery document (UUID).
      summary: Delete a delivery document
  /v2/warehouse/delivery-items/{item_id}:
    get:
      operationId: deliveryitemapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DeliveryItem'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Returns one item of your deliveries, with the announced, arrived and

        received amounts of its product.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the delivery item (UUID).
      summary: Get a delivery item
  /v3/deliveries/count:
    get:
      operationId: deliverylistcountapiv3_get
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DeliveryCount'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Inbound
      description: 'Returns the number of your deliveries that match the filters, which

        are the same as for listing deliveries.'
      x-byrd-roles:
      - service
      - customer_support
      - customer
      - warehouse_support
      - admin
      - operator
      - warehouse
      parameters:
