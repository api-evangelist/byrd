        required: false
      - in: query
        name: aggregated_container_status
        description: Only deliveries with this tracking status (see `aggregatedContainerStatus`). `pick_up` also matches deliveries that are not tracked.
        schema:
          type:
          - string
          - 'null'
          enum:
          - partially_delivered
          - pick_up
          - in_transit
          - out_for_delivery
          - delivered
          - delayed
          - failed_delivery
          - null
        required: false
      - in: query
        name: date_field
        description: 'Date field that `date_from` and `date_to` filter on. Defaults to `created_at`.


          - `created_at`: when the delivery was announced

          - `at_warehouse_at`: when the warehouse accepted it

          - `inbounded_at`: when it was completed

          - `status_updated_at`: when its status last changed'
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - at_warehouse_at
          - inbounded_at
          - status_updated_at
        required: false
      - in: query
        name: date_from
        description: Only deliveries whose `date_field` is at or after this time (ISO 8601, UTC). Must be before `date_to`.
        schema:
