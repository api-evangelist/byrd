        name: include_deleted
        description: Whether to include cancelled deliveries. Defaults to `false`.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: include_items
        description: Whether to include `deliveryItems` in each delivery. Defaults to `true`; set it to `false` for faster responses when deliveries have many items.
        schema:
          type: boolean
          default: true
        required: false
      - in: query
        name: include_containers
        description: Whether to include `deliveryContainers` in each delivery. Defaults to `true`.
        schema:
          type: boolean
          default: true
        required: false
      - in: query
        name: product_ids
        description: Only deliveries that contain at least one of these products (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_ids
        description: Only deliveries to these warehouses (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: status
        description: Only deliveries in one of these statuses (see `status`).
        schema:
          type: array
          items:
            type: string
            enum:
            - announced
            - atWarehouse
            - inProcessing
            - completed
            - deleted
        required: false
        explode: false
        style: form
      - in: query
        name: user_id
        description: Only deliveries of this user (UUID). Cannot be combined with `user_ids`. You only ever see your own deliveries.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: user_ids
        description: Only deliveries of these users (UUIDs). Cannot be combined with `user_id`. You only ever see your own deliveries.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: type
        description: 'Only deliveries of this type.


          - `container`: deliveries arriving in a shipping container

          - `regular`: all other deliveries'
        schema:
          type: string
          enum:
          - container
          - regular
        required: false
      - in: query
        name: sku
        description: Only deliveries that contain the product with this SKU.
        schema:
          type: string
        required: false
      - in: query
        name: barcode
        description: Only deliveries that contain a product with this barcode, either its main barcode or one of its additional barcodes.
        schema:
