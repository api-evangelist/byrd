          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        date:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the warehouse is due to inbound the delivery (ISO 8601 date); `null` when there is no deadline yet.
        type:
          type: string
          description: 'How the deadline was set.


            - `not-applicable`: there is no deadline yet

            - `sla`: calculated from the warehouse''s inbound service level, counted from the arrival of the delivery

            - `special-arrangement`: a date specially agreed with byrd'
      required:
