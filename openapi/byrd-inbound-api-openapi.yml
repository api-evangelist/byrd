        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: Count deliveries
components:
  schemas:
    DeliveryCreateRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        customsMRN:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{2}GB[A-Z0-9]{14}\Z
          description: 'UK customs Movement Reference Number (MRN) of the goods: 18 characters, two digits for the year, `GB`, then 14 uppercase letters or digits. Only allowed for deliveries to a warehouse in the United Kingdom; you can set it while the delivery is `announced` or `atWarehouse`, including with a partial update after arrival. `null` when not provided.'
          example: 25GB1234567890ABCD
        description:
          type:
          - string
          - 'null'
          description: Free-text summary of the contents of the delivery; `null` when not provided.
        expectedDeliveryDateFrom:
          type: string
          format: date-time
          description: Start of the window in which the delivery is expected to arrive at the warehouse (ISO 8601, UTC). For `container` deliveries it must equal `expectedDeliveryDateTo`. Customers can only change it while the delivery is `announced`.
        expectedDeliveryDateTo:
          type: string
          format: date-time
          description: End of the window in which the delivery is expected to arrive at the warehouse (ISO 8601, UTC). For `container` deliveries it must be a business day at least 10 business days from now. Customers can only change it while the delivery is `announced`.
        expressInbounding:
          type: boolean
          description: Whether express inbounding is requested. Always send `false`.
        isInternational:
          type:
          - boolean
          - 'null'
          description: Whether the goods cross a border into the warehouse's country. Only for deliveries to a warehouse in the United Kingdom, where it is required when announcing or fully updating the delivery. When `true`, `senderName` and `senderAddress` are required and the warehouse cannot inbound the delivery until `customsMRN` is provided. Customers can still declare it `true` with a partial update after the delivery has left `announced`, but not change it back once the goods have arrived. `null` when it does not apply.
        referenceNumber:
          type:
          - string
          - 'null'
          description: Your own reference for the delivery, such as a purchase order number; `null` when not provided.
        requiresCounting:
          type:
          - boolean
          - 'null'
          description: Whether the warehouse counts every item on arrival; charges may apply. When `false`, stock is booked as announced and byrd is not liable for discrepancies. Defaults to `true`; cannot be `true` together with `requiresSampling`. Customers can only change it while the delivery is `announced`.
        requiresSampling:
          type:
          - boolean
          - 'null'
          description: Whether the warehouse checks a representative sample of the goods on arrival instead of counting every item. Defaults to `false`; cannot be `true` together with `requiresCounting`. Customers can only change it while the delivery is `announced`.
        senderAddress:
          type:
          - string
          - 'null'
          description: Address the delivery is sent from; required for international deliveries, otherwise `null` when not provided. Part of the customs declaration, so customers can still change it with a partial update after the delivery has left `announced`.
        senderName:
          type:
          - string
          - 'null'
          description: Name of the sender of the delivery; required for international deliveries, otherwise `null` when not provided. Part of the customs declaration, so customers can still change it with a partial update after the delivery has left `announced`.
        stocktaking:
          type: boolean
          description: Always send `true`.
        unmixedDelivery:
          type:
          - boolean
          - 'null'
        containerSizeAnnounced:
          type:
          - string
          - 'null'
          enum:
          - 20ft
          - 40ft
          - null
          description: 'Size of the shipping container, as you announced it. Only for `container` deliveries; `null` otherwise.


            - `20ft`: 20-foot container

            - `40ft`: 40-foot container'
        isPalletizedAnnounced:
          type:
          - boolean
          - 'null'
          description: Whether the goods in the shipping container are on pallets, as you announced it. Only for `container` deliveries; `null` otherwise.
        deletedDate:
          type: string
          format: date-time
          readOnly: true
          description: When the delivery was cancelled (ISO 8601, UTC); `null` when it was not.
        identifier:
          type: string
          readOnly: true
          description: Short human-readable identifier of the delivery, shown in the dashboard and printed as a barcode on the delivery note.
          example: TST-8VO4
        statusUpdatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the status of the delivery last changed (ISO 8601, UTC).
        inboundedDateTime:
          type: string
          format: date-time
          readOnly: true
          description: When the delivery was completed and its stock became available (ISO 8601, UTC); `null` until then.
        inProcessingDateTime:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse started processing the delivery, moving it to `inProcessing` (ISO 8601, UTC); `null` until then.
        atWarehouseDateTime:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse accepted the delivery, moving it to `atWarehouse` (ISO 8601, UTC); `null` until then.
        aggregatedContainerStatus:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Tracking status of the delivery as a whole, combined from the tracking statuses of its containers; `null` when none of them is tracked.


            - `pick_up`: waiting to be picked up by the carrier

            - `in_transit`: on the way to the warehouse

            - `out_for_delivery`: out for delivery to the warehouse

            - `partially_delivered`: some containers were delivered, others not yet

            - `delivered`: all containers were delivered

            - `delayed`: delivery is delayed

            - `failed_delivery`: the carrier failed to deliver'
        customsMRNProvidedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the customs MRN was first provided (ISO 8601, UTC); `null` while there is none. The inbound deadline of an international delivery is not counted before this.
        subStatus:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Detail on the current status; `null` when there is none.


            - `waitingOnMRN`: the delivery needs a customs MRN before the warehouse can inbound it; provide it in `customsMRN`'
        originConfirmedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse last recorded where the goods came from (`warehouseOriginIsUK`) (ISO 8601, UTC); `null` when it has not.
        deliveryContainers:
          minItems: 1
          description: Parcels or pallets the delivery arrives in, one per tracking number; at least one is required when announcing. A full update replaces them all.
          type: array
          items:
            $ref: '#/components/schemas/DeliveryContainer'
        warehouseID:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the warehouse receiving the delivery (UUID).
        warehouse:
          readOnly: true
          description: 'Warehouse receiving the delivery: its ID and country code.'
          allOf:
          - $ref: '#/components/schemas/StorageWarehouse'
        deliveryStandards:
          readOnly: true
          description: Results of the delivery standards the warehouse checked on arrival; empty until they are checked.
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStandard'
        deviation:
          type: boolean
          readOnly: true
        deliverDate:
          type: string
          format: date-time
          readOnly: true
        type:
          type: string
          default: regular
          enum:
          - container
          - regular
          - unknown
          description: 'Type of delivery. Defaults to `regular`.


            - `container`: arriving in a shipping container; the expected dates must be equal, a business day, and at least 10 business days from now

            - `regular`: every other delivery

            - `unknown`: type not recorded'
        acceptanceFee:
          readOnly: true
          description: Fee charged for accepting the delivery at the warehouse; `null` when none was charged.
          allOf:
          - $ref: '#/components/schemas/AcceptanceFee'
        customsPaid:
          readOnly: true
          description: Customs charges the warehouse paid on your behalf when receiving the delivery; `null` when none were paid.
          allOf:
          - $ref: '#/components/schemas/AcceptanceFee'
        damages:
          type: string
          readOnly: true
          description: Description of the overall damage the warehouse found on the delivery; `null` when none was recorded.
        deleted:
          type: boolean
          readOnly: true
          description: Whether the delivery was cancelled.
        deliveryCostsPaid:
          readOnly: true
          description: Delivery costs the warehouse paid on your behalf when receiving the delivery; `null` when none were paid.
          allOf:
          - $ref: '#/components/schemas/AcceptanceFee'
        deliveryNotes:
          type: string
          readOnly: true
          description: Other comments the warehouse recorded when accepting the delivery; `null` when there are none.
        putawayFee:
          readOnly: true
          description: Fee charged for putting the stock of the delivery away into storage; `null` when none was charged.
          allOf:
          - $ref: '#/components/schemas/AcceptanceFee'
        status:
          type: string
          enum:
          - announced
          - atWarehouse
          - inProcessing
          - completed
          - deleted
          readOnly: true
          description: 'Current status of the delivery.


            - `announced`: announced and not yet arrived

            - `atWarehouse`: arrived and accepted by the warehouse

            - `inProcessing`: being counted and put away

            - `completed`: inbounded; the stock is available

            - `deleted`: cancelled'
        userID:
          type: string
          readOnly: true
          description: ID of the user the delivery belongs to (UUID).
        deliveredBoxes:
          type: integer
          readOnly: true
          minimum: 0
          description: Number of loose boxes (parcels) the warehouse counted on arrival; `null` until the delivery has been counted.
        deliveredPallets:
          type: integer
          readOnly: true
          minimum: 0
          description: Number of full pallets the warehouse counted on arrival; `null` until the delivery has been counted.
        containerSizeConfirmed:
          type:
          - string
          - 'null'
          enum:
          - 20ft
          - 40ft
          - null
          readOnly: true
          description: 'Size of the shipping container, as confirmed by the warehouse on arrival. Only for `container` deliveries; `null` otherwise.


            - `20ft`: 20-foot container

            - `40ft`: 40-foot container'
        isPalletizedConfirmed:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Whether the goods in the shipping container are on pallets, as confirmed by the warehouse on arrival. Only for `container` deliveries; `null` otherwise.
        palletizationMinutes:
          type:
          - integer
          - 'null'
          readOnly: true
          minimum: 0
          description: Time the warehouse spent putting the goods of the shipping container onto pallets, in minutes. Only for `container` deliveries; `null` otherwise.
        meetsEUOrganicRequirements:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Whether the delivery meets the EU organic requirements, as checked by the warehouse; `null` when it was not checked.
        warehouseOriginIsUK:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Whether the goods came from within the United Kingdom, as found by the warehouse on arrival. Only recorded for deliveries to a UK warehouse not declared international; `false` means an MRN is needed before inbounding. `null` when not recorded.
        standardsCompliance:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'How far the delivery met the delivery standards checked by the warehouse on arrival.


            - `compliant`: all standards were met

            - `partially_compliant`: some standards were met

            - `non_compliant`: no standard was met

            - `compliance_not_checked`: the standards were not checked yet'
        sortedBoxesCount:
          type:
          - integer
          - 'null'
          readOnly: true
          minimum: 0
          description: Number of boxes the warehouse had to sort while processing the delivery; `null` until recorded.
        sortedItemsCount:
          type:
          - integer
          - 'null'
          readOnly: true
          minimum: 0
          description: Number of items the warehouse had to sort while processing the delivery; `null` until recorded.
        deliveryItems:
          minItems: 1
          description: Products in the delivery and their announced amounts; at least one is required when announcing, and each product may appear only once. A full update replaces them all.
          type: array
          items:
            $ref: '#/components/schemas/DeliveryItem'
        inboundingDeadline:
          description: Date by which the warehouse is due to inbound the delivery, and how that date was set. Calculated by byrd; ignored when sent.
          allOf:
          - $ref: '#/components/schemas/InboundingDeadline'
        documents:
          description: Documents to attach to the delivery when announcing it, such as invoices or packing lists. Upload the files first.
          type: array
          items:
            $ref: '#/components/schemas/DocumentCreate'
