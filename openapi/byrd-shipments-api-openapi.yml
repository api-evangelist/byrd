          - 'null'
          description: SKU of the byrd product to ship; send it or `product_id`. Required for custom bundles, where it has to be unique within the shipment.
        children:
          readOnly: true
          description: 'Items the bundle consists of; empty for other item types. Required when `type` is `custom_bundle`: list every product to pack together, including the bag or box they go in.'
          allOf:
          - $ref: '#/components/schemas/ItemBase'
        shop_product_id:
