          - string
          - 'null'
          description: Postal code. For countries with numeric postal codes, anything but digits is removed, such as a `DE-` prefix.
        state:
          type:
          - string
          - 'null'
          description: State, province or region; `null` when not needed.
      required:
      - country_code
      title: Shipment update destination address
    ItemCustoms:
      type: object
      properties:
        origin_country_code:
          type: string
          description: Country the product was made in (ISO 3166-1 alpha-2), for example `CN`.
