          - string
          - 'null'
          format: date
          readOnly: true
          description: Day the shipment is planned to be sent (ISO 8601 date).
        returnDate:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the shipment was returned (ISO 8601); `null` when it was not.
        sentDate:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the shipment was handed over to the carrier (ISO 8601); `null` until then.
        latestShipDate:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: Deadline by which the shipment should be sent (ISO 8601).
        shippingRate:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              description: Amount, as a string with two decimals separated by a dot.
            currency:
              type: string
              pattern: ^[A-Z]{3}$
              description: Currency (ISO 4217 code, e.g. `EUR`).
            taxFactor:
              type:
              - number
              - 'null'
              description: Tax factor of the price, for example `1.19` for 19% VAT; `null` when not set.
          required:
          - currency
          - value
          readOnly: true
          description: Shipping price charged to you for the shipment; `null` until it is known.
        status:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Current status of the shipment.


            - `waitingForAddressValidation`: the address is being validated

            - `new`: created and not yet released to a warehouse

            - `recalled`: recalled from the warehouse, can be released again

            - `waitingForRelease`: being released to a warehouse

            - `readyForFulfillment`: released and waiting to be picked

            - `fulfillmentStarted`: items are being picked

            - `fulfillmentCompleted`: picked and being packed

            - `requiresLabel`: packed, a manual label is required (B2B)

            - `readyToLabel`: packed, the manual label was uploaded (B2B)

            - `readyToShip`: packed and ready for manual outbound (B2B)

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returnAnnounced`: a return was created for the shipment

            - `returned`: the return arrived at the warehouse

            - `deleted`: deleted'
        width:
          type:
          - number
          - 'null'
          readOnly: true
          minimum: 0
          description: Width of the packed parcel, in cm.
        weight:
          type:
          - number
          - 'null'
          readOnly: true
          minimum: 0
          description: Weight of the packed parcel, in kg.
        totalPickedUnits:
          type:
          - integer
          - 'null'
          readOnly: true
          description: Number of item units picked for the shipment; `null` until picking is complete.
        totalPickedPackagingUnits:
          type:
          - integer
          - 'null'
          readOnly: true
          description: Number of packaging units picked for the shipment; `null` until picking is complete.
      required:
      - destinationAddress
      - destinationName
      - packagingMaterials
      title: Returned shipment
    PickStorage:
      type: object
      properties:
        id:
