          items:
            $ref: '#/components/schemas/ProductBarcode'
        type:
          type: string
          description: 'Type of the product.


            - `product`

            - `alias`

            - `supplementary`

            - `marketing`

            - `branding`

            - `packaging_material`

            - `prepacked_product`

            - `bundle`'
        serial_number_enabled:
          type: boolean
          readOnly: true
          description: Whether serial numbers of the product are recorded when it is shipped.
        serial_number_regex:
          type:
          - string
          - 'null'
          readOnly: true
          description: Regular expression the product's serial numbers must match; `null` when any value is accepted.
        inventory_serial_number_enabled:
          type: boolean
          readOnly: true
          description: Whether serial numbers of the product are tracked in stock, not only when shipping.
      title: Pick product
    ShipmentListMetrics:
      type: object
      properties:
        total_picks:
          type: string
          readOnly: true
          description: Number of picks, one for each storage location to pick from; 0 until stock is allocated.
        total_packaging_units:
          type: string
          readOnly: true
          description: Number of packaging units to pick; 0 until stock is allocated.
        total_items:
          type: string
          readOnly: true
          description: Number of physical items in the shipment; the contents of bundles are counted, the bundles themselves are not.
        total_non_branding_items:
          type: string
          readOnly: true
          description: Number of physical items in the shipment, not counting branding products such as flyers or stickers.
        total_skus:
          type: string
          readOnly: true
          description: Number of distinct products in the shipment, not counting bundles.
        total_pick_items:
          type: string
          readOnly: true
          description: Number of items the warehouse takes off the shelf; a packaging unit counts as one item. 0 until stock is allocated.
      title: Shipment list metrics
    PddpSurcharge:
      type: object
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        tax_factor:
          type:
          - number
          - 'null'
        actual_carrier:
          type:
          - string
          - 'null'
        value:
          type: string
          readOnly: true
      title: Pddp surcharge
    ReturnShipmentDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        type:
          type: string
          description: 'Kind of document.


            - `printable_label`: return label to print and stick on the parcel

            - `qr_code`: QR code image provided by the carrier'
        dataType:
          type: string
          description: 'File format of the document.


            - `pdf`: PDF file

            - `png`: PNG image'
      required:
      - dataType
      - type
      title: Return shipment document
    UnitProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the product (UUID).
        name:
          type: string
          readOnly: true
          description: Name of the product.
        sku:
          type: string
          readOnly: true
          description: Stock keeping unit (SKU) of the product, unique in your account.
        barcodes:
          readOnly: true
          description: All barcodes of the product.
          type: array
          items:
            $ref: '#/components/schemas/ProductBarcode'
        serial_number_enabled:
          type: boolean
          readOnly: true
          description: Whether serial numbers of the product are recorded when it is shipped.
      title: Unit product
    ItemsAnnounced:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        shipment_item_id:
          type: string
          format: uuid
          description: ID of the shipment item to return (UUID), from the `items` of the original shipment.
        amount:
          type: integer
          minimum: 1
          description: Number of units of this item to return; at least `1` and at most the amount shipped.
        reason:
          type: string
          maxLength: 64
          description: Why this item is being returned, as free text of up to 64 characters.
          example: arrived-too-late
      required:
      - amount
      - reason
      - shipment_item_id
      title: Items announced
    ShipmentUpdate:
      type: object
      properties:
        customs:
          type:
          - object
          - 'null'
          properties:
            invoice_number:
              type: string
              description: Commercial invoice number of the order, printed on the customs documents.
            goods_type:
              type: string
              default: other
              enum:
              - document
              - gift
              - sample
              - remand
              - other
              description: 'Type of goods in the shipment, declared to customs; defaults to `other`.


                - `document`: documents only

                - `gift`: a gift

                - `sample`: commercial samples

                - `remand`: goods sent back

                - `other`: anything else, such as sold goods'
            export_mrn:
              type:
              - string
              - 'null'
              maxLength: 18
              description: Movement Reference Number (MRN) of the export declaration filed for the shipment, passed to the carrier; up to 18 characters.
            has_electronic_export_notification:
              type:
              - boolean
              - 'null'
              description: Whether an electronic export declaration was filed for the shipment; passed to the carrier.
          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateDestinationAddress'
        documents:
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUpdateDocument'
        insurance:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              description: Value of the whole shipment it is insured for, in `currency`.
            currency:
              type: string
              description: Currency of `value` (ISO 4217), for example `EUR`.
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
        items:
          minItems: 1
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/ItemInput'
        notes:
          type:
          - object
          - 'null'
          properties:
            customer_note:
              type:
              - string
              - 'null'
              description: Note for your own use, shown in the dashboard; it is not sent to the recipient or shown to the warehouse.
            packaging_instructions:
              type: string
              readOnly: true
              description: Packing instructions for the warehouse, from the account settings of the customer; not taken from the request. Not returned to customers.
            label_error_note:
              type: string
              readOnly: true
              description: Instructions byrd gave the warehouse when resolving a label error on the shipment; `null` when there are none.
          description: Free-text notes for your own use and packaging instructions for the warehouse.
        options:
          description: Fulfilment and shipping options set on the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateOptions'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateShop'
        user_id:
          type: string
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        warehouse_id:
          type: string
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
        cash_on_delivery:
          type:
          - object
          - 'null'
          properties:
            price:
              description: Total amount the carrier collects from the recipient; only `EUR` is supported.
              allOf:
              - $ref: '#/components/schemas/CashOnDeliveryPrice'
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
        pickup_point:
          type:
          - object
          - 'null'
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterialsInput'
      required:
      - destination_address
      - items
      title: Shipment update
    ShipmentShop:
      type: object
      properties:
        id:
          type: string
          description: ID of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        type:
          type: string
          description: Type of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        order_number:
          type: string
          description: Order number in your shop or order system, shown in the Order column of the dashboard.
        order_id:
          type: string
          description: Any other identifier of the order in your system; not shown in the dashboard.
        marketplace_order_number:
          type:
          - string
          - 'null'
          description: Order number given by the marketplace the order was sold on, when that is not the system sending the shipment, for example the Amazon order number of an order forwarded by a connected shop. Returns are labelled with it, which lets the warehouse match a return to the shipment; send it in addition to `order_number` and `order_id`.
        marketplace:
          type:
          - string
          - 'null'
          description: Marketplace that `marketplace_order_number` belongs to, in lower case, for example `amazon`, `ebay` or `kaufland`. If you cannot tell it reliably, leave it out rather than guess.
      title: Shipment shop
    ItemBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the item line (UUID).
        product_id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the byrd product to ship (UUID); send it or `sku`. `null` for custom bundles.
        quantity:
          type: integer
          readOnly: true
          description: Number of units to ship; at least 1. For items of a custom bundle, the number per bundle.
        name:
          type: string
          readOnly: true
          description: Name of the product; replaced by the name stored on the product. Required for custom bundles and their items.
        price:
          readOnly: true
          description: Retail price of one unit, used for customs documents and insurance; it is multiplied by `quantity`. Required for custom bundles.
          allOf:
          - $ref: '#/components/schemas/CarrierShippingRate'
        dimensions:
          readOnly: true
          description: Dimensions and weight of one unit of the product; missing values are taken from the product, and the weight stored on the product always replaces the one sent.
          allOf:
          - $ref: '#/components/schemas/Dimensions'
        customs:
          readOnly: true
          description: Customs details of the product, needed for shipments leaving the EU or the UK; taken from the product when not sent.
          allOf:
          - $ref: '#/components/schemas/ItemCustoms'
        lot_number:
          type: string
          readOnly: true
          description: Lot the units have to be picked from; if not sent, byrd chooses lots first in, first out (FIFO).
        serial_number_tracked:
          type: boolean
          readOnly: true
          description: Whether serial numbers are recorded for the item when it is packed; set from the serial number setting of the product.
        dangerous_goods:
          readOnly: true
          description: Dangerous goods classifications of the product, taken from the product; empty when it is not dangerous goods.
          type: array
          items:
            $ref: '#/components/schemas/ItemBaseDangerousGoods'
        type:
          type: string
          description: 'Type of item.


            - `product`: a single product (default)

            - `bundle`: a bundle product set up in byrd

            - `custom_bundle`: products packed together, listed in `children`

            - `supplement`: a supplementary product, such as a flyer, added because it is linked to another product in the shipment'
        fragile:
          type: boolean
          default: false
          readOnly: true
          description: Whether the product is fragile, as set on the product.
        organic:
          type: boolean
          default: false
          readOnly: true
          description: Whether the product is organic and needs special shipping conditions, as set on the product.
        grs:
          type: boolean
          default: false
          readOnly: true
          description: Whether the product complies with the Global Recycled Standard (GRS), as set on the product.
        required:
          type: boolean
          readOnly: true
          description: Whether the item has to be in the shipment for it to be sent; `false` for optional supplementary products, such as flyers, that can be left out.
        description:
          type:
          - string
          - 'null'
          description: Description of the product, used on customs documents; taken from the product when not sent.
        sku:
          type:
          - string
          - 'null'
          description: SKU of the byrd product to ship; send it or `product_id`. Required for custom bundles, where it has to be unique within the shipment.
      title: Item base
    PaginationFields:
      type: object
      properties:
        page:
          type: integer
          description: Current page of results, 0-indexed
        per_page:
          type: integer
          description: Number of results per page
        page_count:
          type: integer
          description: Number of result pages
        total_count:
          type: integer
          description: Total number of results across all pages
      title: Pagination fields
    ShipmentDestinationAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the address (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        validated:
          type: boolean
          readOnly: true
          description: Whether the address passed byrd address validation; `false` also when it has not been validated.
        name:
          type: string
          readOnly: true
          description: Name of the recipient, if the recipient is a person.
        company_name:
          type: string
          readOnly: true
          description: Company name of the recipient, if the recipient is a company.
        email:
          type: string
          readOnly: true
          description: Email address of the recipient; given to the carrier, which may use it to notify the recipient about the delivery.
        phone:
          type: string
          readOnly: true
          description: Phone number, with the country code where possible, for example `+49 1234567890`. For a recipient, it is given to the carrier, and characters other than digits and `+` are removed.
        street_name:
          type: string
          description: Name of the street, without the house number.
        street_number:
          type: string
          description: House number.
        city:
          type: string
          description: City.
        country_code:
          type: string
          description: Country (ISO 3166-1 alpha-2), for example `DE`.
        address_addition:
          type: string
          description: Additional address details, such as building or floor.
        postal_code:
          type: string
          description: Postal code. For countries with numeric postal codes, anything but digits is removed, such as a `DE-` prefix.
        state:
          type: string
          description: State, province or region; `null` when not needed.
      required:
      - country_code
      title: Shipment destination address
    Error:
      type: object
      required:
      - code
      - message
      - errors
      properties:
        code:
          type: string
