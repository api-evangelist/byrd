        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Creates a B2C shipment, or a B2B shipment when `b2b_config` is sent.

        The shipment starts in status `new` and is released to a warehouse

        automatically when `options.auto_release` is `true`. Use

        `validate_only` to check a request without creating the shipment.'
      requestBody:
        content:
          application/vnd.byrd.customer+json:
