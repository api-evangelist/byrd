    ItemBaseDangerousGoods:
      type: object
      properties:
        un_number:
          type: string
          readOnly: true
          description: Four-digit UN number identifying the dangerous substance.
          example: '3481'
        quantity:
          type: number
          readOnly: true
          description: Amount of the dangerous substance in one unit of the product, in the measure its UN number uses (g, l or Wh).
        limit_type:
          type: string
          readOnly: true
          description: 'Transport regime the dangerous goods are shipped under.


            - `LQ`: limited quantity

            - `SV188`: special provision 188 (small lithium cells and batteries)'
      title: Item base dangerous goods
    ShipmentUnitCheckpoint:
      type: object
      properties:
        packaged_at:
          type: string
          format: date-time
          description: When the warehouse packed the unit.
        accepted_at:
          type: string
          format: date-time
          description: When the carrier first scanned the unit.
        delivered_at:
          type: string
          format: date-time
          description: When the carrier delivered the unit to the recipient.
        sent_at:
          type: string
          format: date-time
          description: When the unit left the warehouse.
      title: Shipment unit checkpoint
    UnitMetrics:
      type: object
      properties:
        total_items:
          type: integer
          description: Number of physical items in the unit, with packaging units counted by their contents.
        total_skus:
          type: integer
          description: Number of distinct products in the unit.
        total_multi_picks:
          type: integer
          description: Number of packaging units in the unit.
        total_single_picks:
          type: integer
          description: Number of single selling units in the unit, not counting packaging units and branding products.
        total_organic_picks:
          type: integer
          description: Number of organic products in the unit.
        total_grs_picks:
          type: integer
          description: Number of GRS (Global Recycled Standard) certified products in the unit.
        total_fragile_picks:
          type: integer
          description: Number of fragile products in the unit.
        total_branding_picks:
          type: integer
          description: Number of branding products, such as flyers or stickers, in the unit.
        total_serial_numbers:
          type: integer
          description: Number of serial numbers recorded for the unit.
        total_dangerous_goods:
          type: integer
          description: Number of dangerous goods products in the unit.
      title: Unit metrics
    ShipmentUnitDetailCheckpoint:
      type: object
      properties:
        packaged_at:
          type: string
          format: date-time
          description: When the warehouse packed the unit.
        accepted_at:
          type: string
          format: date-time
          description: When the carrier first scanned the unit.
        delivered_at:
          type: string
          format: date-time
          description: When the carrier delivered the unit to the recipient.
        sent_at:
          type: string
          format: date-time
          description: When the unit left the warehouse.
        created_at:
          type: string
          format: date-time
          description: When the unit was created.
        label_error_occurred_at:
          type: string
          format: date-time
          description: When the unit's last label error occurred (ISO 8601, UTC); `null` when label creation never failed.
        label_error_resolved_at:
          type: string
          format: date-time
          description: When the unit's last label error was resolved; `null` when it never had one or it is not resolved yet.
        slam_prepared_at:
          type: string
          format: date-time
          description: When the packed unit was ready to be labelled by a SLAM machine; `null` for units not labelled by one.
      title: Shipment unit detail checkpoint
    ShipmentCount:
      type: object
      properties:
        count:
          type: integer
          readOnly: true
          description: Number of shipments that match the filters, up to 100000.
        capped:
          type: boolean
          readOnly: true
          description: Whether the number of matching shipments reached the limit of 100000, in which case `count` is the limit rather than the exact number.
      additionalProperties: false
      title: Shipment count
    ShipmentUnitList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the unit (UUID).
        items:
          description: Products packed in the unit; empty for units packed before items were recorded per unit.
          type: array
          items:
            $ref: '#/components/schemas/UnitItem'
        service:
          type: string
          description: 'Shipping service the unit is sent with; usually the shipment''s `service`, but it can differ when an economy fallback applies.


            - `standard`

            - `express`

            - `economy`

            - `pickup_point`

            - `pickup`

            - `amazon_prime`'
        carrier:
          description: Carrier the unit is sent with and its tracking details; the fields are `null` until a label is created.
          allOf:
          - $ref: '#/components/schemas/Carrier'
        parcel_id:
          type: string
          readOnly: true
          description: Unique 10-character alphanumeric identifier of the unit.
          example: A1B2C3D4E5
        type:
          type: string
          readOnly: true
          description: 'Kind of unit.


            - `parcel`: a parcel

            - `pallet`: a pallet'
        status:
          type: string
          readOnly: true
          description: 'Current status of the unit.


            - `new`: created and not yet packed and labelled

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: being returned to the warehouse

            - `returned`: the return arrived at the warehouse'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `label_error`, `error_resolved`: creating the label failed, or the failure was fixed; while `new` or `packaged`

            - `slam_ready`, `autobag_failed`: waiting for the SLAM machine, or the bagging machine failed; while `new`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `waiting_for_pickup`, `manual_outbound`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`'
        label_error_status:
          type: string
          readOnly: true
          description: 'Who byrd is waiting on to resolve the unit''s label error; `null` when there is no error or it has not been looked at yet.


            - `waiting_for_customer`: you have to fix or confirm something, such as the address or customs data

            - `waiting_for_warehouse`: the warehouse has to check the parcel

            - `waiting_for_carrier`: the carrier has to respond or fix something

            - `waiting_for_pricing`, `waiting_for_procurement`, `waiting_for_operations`, `waiting_for_engineering`: a byrd team has to act

            - `waiting_for_deletion`: the error will not be fixed and the unit will be deleted'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the unit has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/ShipmentUnitCheckpoint'
        errors:
          readOnly: true
          description: Errors blocking the unit, such as a failed label creation; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        error_code:
          type: string
          readOnly: true
          description: Code of the error currently blocking the unit, for example `LC00` for a carrier error; `null` when there is none.
        slam:
          type: boolean
          readOnly: true
          description: Whether the unit is measured and labelled by a SLAM (scan, label, apply, manifest) machine.
        autobag:
          type: boolean
          readOnly: true
          description: Whether the unit is packed by an automatic bagging machine.
        dimensions:
          description: Outer dimensions (cm) and weight (kg) of the packed unit.
          allOf:
          - $ref: '#/components/schemas/UnitDimensions'
        pregenerated:
          type: boolean
          readOnly: true
          description: Whether the unit and its shipping label were created in advance, before packing.
        packaging_materials:
          description: Packaging materials the unit was packed with.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PackagingMaterials'
        group_number:
          type: integer
          readOnly: true
          description: Number of the packing station group whose printer printed the unit's label; `null` until the unit is labelled.
        shipment_id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the shipment the unit belongs to (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        label_error_occurred_at:
          type: string
          format: date-time
          readOnly: true
          description: When the unit's last label error occurred (ISO 8601, UTC); `null` when label creation never failed.
        warehouse:
          readOnly: true
          description: Warehouse fulfilling the unit's shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentUnitListWarehouse'
        customer:
          readOnly: true
          description: byrd account the unit's shipment belongs to.
          allOf:
          - $ref: '#/components/schemas/Customer'
        sequence_number:
          type: string
          readOnly: true
          description: Position of the unit among the shipment's units, starting at 1.
        metrics:
          readOnly: true
          description: Item and pick counts for the unit; `null` for units without recorded items.
          allOf:
          - $ref: '#/components/schemas/UnitMetrics'
      title: Shipment unit list
    ReturnedShipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        cod:
          type:
          - object
