        packagingFee:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              description: Amount, as a string with two decimals separated by a dot.
            currency:
              type: string
              pattern: ^[A-Z]{3}$
              description: Currency (ISO 4217 code, e.g. `EUR`).
            taxFactor:
