        name:
          type: string
          description: Name of the product.
        sku:
          type: string
          description: Stock keeping unit (SKU) of the product, unique in your account.
        type:
          type: string
          description: 'Type of the product.


            - `product`

            - `alias`

            - `supplementary`

            - `marketing`

            - `branding`

            - `packaging_material`

            - `prepacked_product`

            - `bundle`'
      title: Reservation product
    IslandSurcharge:
      type: object
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        tax_factor:
          type:
          - number
          - 'null'
        actual_carrier:
          type:
          - string
          - 'null'
        value:
          type: string
          readOnly: true
      title: Island surcharge
    ShipmentInput:
      type: object
      properties:
        customs:
          type:
          - object
          - 'null'
          properties:
            invoice_number:
              type: string
              description: Commercial invoice number of the order, printed on the customs documents.
            goods_type:
              type: string
              default: other
              enum:
              - document
              - gift
              - sample
              - remand
              - other
              description: 'Type of goods in the shipment, declared to customs; defaults to `other`.


                - `document`: documents only

                - `gift`: a gift

                - `sample`: commercial samples

                - `remand`: goods sent back

                - `other`: anything else, such as sold goods'
            export_mrn:
              type:
              - string
              - 'null'
              maxLength: 18
              description: Movement Reference Number (MRN) of the export declaration filed for the shipment, passed to the carrier; up to 18 characters.
            has_electronic_export_notification:
              type:
              - boolean
              - 'null'
              description: Whether an electronic export declaration was filed for the shipment; passed to the carrier.
          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateDestinationAddress'
        documents:
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUpdateDocument'
        insurance:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              description: Value of the whole shipment it is insured for, in `currency`.
            currency:
              type: string
              description: Currency of `value` (ISO 4217), for example `EUR`.
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
        items:
          minItems: 1
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/ItemInput'
        notes:
          type:
          - object
          - 'null'
          properties:
            customer_note:
              type:
              - string
              - 'null'
              description: Note for your own use, shown in the dashboard; it is not sent to the recipient or shown to the warehouse.
            packaging_instructions:
              type: string
              readOnly: true
              description: Packing instructions for the warehouse, from the account settings of the customer; not taken from the request. Not returned to customers.
            label_error_note:
              type: string
              readOnly: true
              description: Instructions byrd gave the warehouse when resolving a label error on the shipment; `null` when there are none.
          description: Free-text notes for your own use and packaging instructions for the warehouse.
        options:
          description: Fulfilment and shipping options set on the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentUpdateOptions'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentInputShop'
        user_id:
          type: string
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        warehouse_id:
          type: string
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
        cash_on_delivery:
          type:
          - object
          - 'null'
          properties:
            price:
              description: Total amount the carrier collects from the recipient; only `EUR` is supported.
              allOf:
              - $ref: '#/components/schemas/CashOnDeliveryPrice'
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
        pickup_point:
          type:
          - object
          - 'null'
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type: array
          items:
            $ref: '#/components/schemas/PackagingMaterialsInput'
      required:
      - destination_address
      - items
