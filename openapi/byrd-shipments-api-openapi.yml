      - in: query
        name: min_age
        description: 'Only return units at least this old, measured from their creation: a positive whole number followed by `h` (hours), `d` (days), `w` (weeks) or `m` (30 days), for example `2d`.'
        schema: {}
        required: false
      - in: query
        name: max_age
        description: Only return units at most this old. Same format as `min_age`.
        schema: {}
        required: false
      - in: query
        name: custom_handling
        description: Only return units whose shipment is (`true`) or is not (`false`) custom-handled.
        schema:
          type: boolean
        required: false
      - in: query
        name: is_demo
        description: Only return units whose shipment belongs (`true`) or does not belong (`false`) to a demo account.
        schema:
          type: boolean
        required: false
      - in: query
        name: user_id
        description: Only return units of shipments of these byrd accounts, by ID (comma-separated). For customers, always their own account.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_id
        description: Only return units of shipments fulfilled by these warehouses, by ID (comma-separated).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: sort_by
        description: 'Field to sort by. Defaults to `created_at`.


          - `created_at`

          - `updated_at`

          - `label_error_occurred`'
        schema:
          type: string
        required: false
      - in: query
        name: sort_order
        description: Sort direction, `asc` or `desc`. Defaults to `desc`.
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
      - in: query
        name: include_deleted
        description: Whether to include deleted units. Defaults to `false`; always `false` for customers.
        schema:
          type: boolean
          default: false
        required: false
      - in: query
        name: only
        description: Comma-separated dotted paths of the fields to return, for example `id,status,items`.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      summary: Count units
components:
  schemas:
    ReturnShipmentAnnounced:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        shipment_id:
          type: string
          format: uuid
          description: ID of the shipment being returned (UUID). The shipment must be yours and must have been sent.
        send_documents_to_email:
          type:
          - string
          - 'null'
          format: email
          description: Email address the return label is sent to once it is generated. `null` when the return was announced with `send_email` set to `false`.
        documents_email_language:
          type: string
          maxLength: 2
          description: Language of the email carrying the return label and of the label itself, as an ISO 639-1 two-letter code, for example `de`. `en`, `de` and `fr` are supported and any other value falls back to English. When `null`, the language is taken from the destination country of the shipment, falling back to English.
        portal_tier:
          type:
          - string
          - 'null'
          enum:
          - basic
          - pro
          - null
          description: Returns Portal tier the return was announced through, `basic` or `pro`; `null` when the return was not announced through the Returns Portal.
        label_type:
          type: string
          enum:
          - byrd_label
          - identifier_only
          description: 'Kind of return label generated for the return. Defaults to `byrd_label`.


            - `byrd_label`: carrier shipping label for `courier`.

            - `identifier_only`: a return slip whose cut-off strip identifies the return to the warehouse; it is not a shipping label and has no tracking number.'
        courier:
          type: string
          enum:
          - amazon_prime
          - asendia_global
          - brt_it
          - colissimo_fr
          - correos_es
          - dbschenker_global
          - delivengo_fr
          - derkurier_de
          - dhl_de
          - dhlexpress_de
          - dpd_at
          - dpd_de
          - dpd_gb
          - exporto_global
          - fedex_global
          - gls_global
          - mondialrelay_fr
          - parcelforce_gb
          - post_at
          - post_de
          - post_it
          - post_nl
          - royalmail_gb
          - schneckenpost_de
          - sendcloud_global
          - seur_es
          - sevensenders_global
          maxLength: 64
          description: Carrier the return is shipped with. Must be a carrier enabled for your account, the warehouse and the destination country; ask your byrd contact person which value applies to you.
        status:
          type: string
          description: 'Current status of the return.


            - `announced`: the return was announced and has not been processed by the warehouse yet.

            - `confirmed`: the warehouse received and confirmed the return.

            - `cancelled`: the confirmed return was cancelled.'
        return_type:
          type: string
          description: 'Type of the return.


            - `customer`: the recipient sends the shipment back; every return announced through this API has this type.

            - `courier`: the carrier sent the shipment back after a failed delivery.'
        reason:
          type: string
          description: Reason for the return; always `customer` for a return announced by the recipient. The reason for each item is in `items_announced`.
        items_announced:
          description: Items of the shipment that are being returned, with their amounts; at least one. Each shipment item can be announced in only one return.
          type: array
          items:
            $ref: '#/components/schemas/ItemsAnnounced'
        documents:
          readOnly: true
          description: Documents generated for the return, such as the return label. Usually empty right after announcing, because the documents are generated a few seconds later.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentAnnouncedDocument'
      required:
      - send_documents_to_email
      - shipment_id
      title: Return shipment announced
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the byrd account (UUID).
        company_name:
          type: string
          description: Company name of the byrd account.
      title: Customer
    ShipmentUnitListWarehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the warehouse (UUID); `null` until a warehouse is assigned.
        code:
          type: string
          description: Short code of the warehouse.
      additionalProperties: false
      title: Shipment unit list warehouse
    ShipmentList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the shipment (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        b2b_config:
          readOnly: true
          description: 'B2B configuration of the shipment: the B2B template it uses and your answers to it; `null` for B2C shipments.'
          allOf:
          - $ref: '#/components/schemas/B2BConfig'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the shipment has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/Checkpoints'
        container_code:
          type: string
          description: Code of the warehouse container the picked items are kept in until the shipment is packed.
        customs:
          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
          allOf:
          - $ref: '#/components/schemas/Customs'
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentDestinationAddress'
        errors:
          readOnly: true
          description: Errors blocking the shipment from progressing, for example a failed address validation or an allocation problem; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        insurance:
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
          allOf:
          - $ref: '#/components/schemas/Insurance'
        metrics:
          readOnly: true
          description: Item, SKU, pick and packaging-unit counts for the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentListMetrics'
        notes:
          description: Free-text notes for your own use and packaging instructions for the warehouse.
          allOf:
          - $ref: '#/components/schemas/Notes'
        options:
          description: Fulfilment and shipping options set on the shipment.
          allOf:
          - $ref: '#/components/schemas/ShipmentListOptions'
        origin:
          type: string
          readOnly: true
          description: 'How the shipment was created; `null` for shipments created before this was recorded.


            - `api`: through the API with an API key

            - `manual`: in the byrd dashboard

            - `integration`: by a byrd shop integration'
        byrd_id:
          type: string
          readOnly: true
          description: Short human-readable identifier of the shipment, shown in the dashboard and printed on warehouse documents.
          example: ABCD12345
        priority:
          type: integer
          readOnly: true
          description: Picking priority in the warehouse, from 0 (normal) to 40 (highest); rises automatically once the shipping deadline is reached. `null` until the shipment is released.
          example: 10
        return_address:
          readOnly: true
          description: Address of the fulfilling warehouse that returns are sent to; `null` until the shipment is released.
          allOf:
          - $ref: '#/components/schemas/ReturnAddress'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentShop'
        status:
          type: string
          readOnly: true
          description: 'Current status of the shipment.


            - `new`: created and not yet released to a warehouse

            - `releasing`: being released to a warehouse

            - `released`: released and waiting to be picked

            - `picking`: items are being picked

            - `packaging`: being packed

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: a return shipment was created

            - `returned`: the return arrived at the warehouse

            - `deleted`: deleted'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `validating_address`, `address_invalid`, `recalled`: while `new`

            - `reserved`, `allocating`, `allocated`, `assigned`, `inbounding`, `inbound_error`: while `released`

            - `label_error`, `error_resolved`, `autobag_failed`: while `packaging`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `manual_outbound`, `waiting_for_pickup`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`

            - `claim_reported`: a support claim is open, while `sent` or `delivered`'
        units:
          readOnly: true
          description: Physical parcels or pallets the shipment is packed into, each with its own tracking information.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentListUnit'
        warnings:
          readOnly: true
          description: Problems that do not block the shipment, for example an address validation error on a shipment released anyway, or the reason it was recalled.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        warehouse:
          readOnly: true
          description: Warehouse fulfilling the shipment; its fields are `null` until a warehouse is assigned.
          allOf:
          - $ref: '#/components/schemas/ShipmentWarehouse'
        user:
          readOnly: true
          description: byrd account the shipment belongs to.
          allOf:
          - $ref: '#/components/schemas/ShipmentUser'
        dangerous_goods:
          readOnly: true
          description: Dangerous goods totals for the shipment.
          allOf:
          - $ref: '#/components/schemas/DGDetails'
        cash_on_delivery:
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
          allOf:
          - $ref: '#/components/schemas/CashOnDelivery'
        total_value:
          readOnly: true
          description: Total value of the items (unit price × quantity), converted to EUR.
          allOf:
          - $ref: '#/components/schemas/CashOnDeliveryPrice'
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PackagingMaterials'
        user_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        documents:
          writeOnly: true
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/Document'
        warehouse_id:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
        warehouse_user_id:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
          description: ID of the warehouse worker assigned to pick the shipment.
        pickup_point:
          type:
          - object
          - 'null'
          default: null
          writeOnly: true
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
        items:
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/Item'
      required:
      - destination_address
      - items
      title: Shipment list
    ShipmentUpdateShop:
      type: object
      properties:
        id:
          type: string
          description: ID of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        type:
          type: string
          description: Type of the byrd shop integration the shipment was imported from; `null` for shipments created through the API.
        order_number:
          type: string
          description: Order number in your shop or order system, shown in the Order column of the dashboard.
        order_id:
          type: string
          description: Any other identifier of the order in your system; not shown in the dashboard.
        marketplace_order_number:
          type: string
          description: Order number given by the marketplace the order was sold on, when that is not the system sending the shipment, for example the Amazon order number of an order forwarded by a connected shop. Returns are labelled with it, which lets the warehouse match a return to the shipment; send it in addition to `order_number` and `order_id`.
        marketplace:
          type: string
          description: Marketplace that `marketplace_order_number` belongs to, in lower case, for example `amazon`, `ebay` or `kaufland`. If you cannot tell it reliably, leave it out rather than guess.
      title: Shipment update shop
    PickStorageLot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the lot (UUID).
        lot_number:
          type: string
          description: Lot (batch) number the product was picked from.
        expiry_date:
          type: string
          description: Date the lot expires (ISO 8601 date, `YYYY-MM-DD`); `null` when the lot has no expiry date.
          example: '2024-12-31'
      title: Pick storage lot
    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the reservation (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        quantity:
          type: integer
          description: Number of selling units reserved.
        lot_id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the lot the stock is reserved from (UUID); `null` when no specific lot is reserved.
        product:
          description: Product the stock is reserved for.
          allOf:
          - $ref: '#/components/schemas/ReservationProduct'
        shipment_id:
          type: string
          format: uuid
          description: ID of the shipment the stock is reserved for (UUID).
        warehouse_id:
          type: string
          format: uuid
          description: ID of the warehouse the stock is reserved in (UUID).
      title: Reservation
    ShipmentUnitCount:
      type: object
      properties:
        count:
          type: integer
          readOnly: true
          description: Number of units matching the filters.
        capped:
          type: boolean
          readOnly: true
          description: Whether the count reached the maximum of 10,000; when `true`, `count` is that maximum and more units may match.
      additionalProperties: false
      title: Shipment unit count
    ReturnShipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        shipment:
          readOnly: true
          description: Original shipment the return belongs to.
          allOf:
          - $ref: '#/components/schemas/ReturnedShipment'
        shipmentID:
          type: string
          format: uuid
          description: ID of the original shipment (UUID).
        unitID:
          type:
          - string
          - 'null'
          format: uuid
          description: ID of the shipment unit (parcel) that came back (UUID); set for courier returns only.
        unit:
          readOnly: true
          description: Shipment unit (parcel) that came back; `null` when the return is not linked to a unit.
          allOf:
          - $ref: '#/components/schemas/ReturnShipmentUnit'
        status:
          type: string
          enum:
          - announced
          - confirmed
          - cancelled
          readOnly: true
          description: 'Current status of the return.


            - `announced`: announced by the recipient, not received yet

            - `confirmed`: received and confirmed by the warehouse

            - `cancelled`: a confirmed return that was cancelled; not included in your results'
        returnType:
          type: string
          enum:
          - courier
          - customer
          description: 'Who initiated the return.


            - `courier`: the carrier could not deliver the shipment and sent it back, e.g. because of a wrong address or failed delivery attempts

            - `customer`: the recipient sent items back, e.g. because they were defective or unwanted'
        reason:
          type: string
          description: 'Why the shipment was returned. Customer returns always have `customer`; the reasons per item are in `itemsAnnounced`.


            - `bad-address`: the address was wrong or incomplete

            - `bad-product`: the product was defective, damaged or not as expected

            - `country`: shipping restrictions or customs rules of the destination country

            - `no-pickup`: the recipient did not collect the parcel where the courier held it

            - `rec-unknown`: the recipient is unknown at the address

            - `refused-delivery`: the recipient refused the delivery

            - `unwanted`: the recipient no longer wanted the items

            - `customer`: a return announced by the recipient'
        manualSearchRequired:
          type: boolean
          description: Whether the warehouse had to search manually to find the original shipment of the return.
        internalComments:
          type: string
          description: Notes the warehouse recorded while processing the return.
        publicComments:
          type: string
          description: Comments of the warehouse about the return, meant for you; empty when there are none.
        courierFee:
          description: Fee charged for accepting the return from the courier; `null` when there is none.
          allOf:
          - $ref: '#/components/schemas/TotalPrice'
        items:
          description: Items the warehouse received and checked, with their condition; empty until the return is processed.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentItem'
        itemsAnnounced:
          readOnly: true
          description: Items announced for return, with quantity and reason, before the warehouse checked them; empty when the return was not announced.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentItemAnnounced'
        sendDocumentsToEmail:
          type: string
          format: email
          readOnly: true
          description: Email address the return label was sent to; `null` when no label was sent.
        documents:
          readOnly: true
          description: Documents generated for the return, such as the return label. Usually empty right after announcing, as they are generated asynchronously.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentDocument'
        courier:
          type: string
          readOnly: true
          description: Carrier the return is shipped with, as a carrier identifier such as `dhl_de`; `null` when unknown.
        courierTrackingNumber:
          type: string
          readOnly: true
          description: Tracking number of the return parcel at the carrier; `null` when unknown.
        courierTrackingURL:
          type: string
          readOnly: true
          description: Carrier tracking page of the return parcel; `null` when unknown.
        announcedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the return was announced (ISO 8601, UTC); `null` for returns that were not announced, such as courier returns.
        postedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the returner handed the parcel to the carrier (ISO 8601, UTC); `null` when unknown.
        deliveredAt:
          type: string
          format: date-time
          readOnly: true
          description: When the return arrived at the warehouse (ISO 8601, UTC); `null` until it arrives.
        processedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse checked the returned items (ISO 8601, UTC); `null` until processed.
        confirmedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the warehouse confirmed the return (ISO 8601, UTC); `null` until confirmed.
        cancelledAt:
          type: string
          format: date-time
          readOnly: true
          description: When the confirmed return was cancelled (ISO 8601, UTC); `null` unless cancelled.
        portalTier:
          type: string
          readOnly: true
          description: 'Returns portal tier the return was created with; `null` for returns not created through the returns portal.


            - `basic`

            - `pro`'
        labelType:
          type: string
          readOnly: true
          description: 'Kind of label the return got; `null` for returns not created through the returns portal.


            - `byrd_label`: a carrier shipping label

            - `identifier_only`: only a label identifying the return'
        warehouseID:
          type: string
          format: uuid
          readOnly: true
          description: ID of the warehouse the return is sent to (UUID).
        shipmentError:
          readOnly: true
          description: Error that stopped the return documents from being generated; `null` when there is none.
          allOf:
          - $ref: '#/components/schemas/ReturnShipmentError'
      required:
      - shipmentID
      title: Return shipment
    RemoteAreaSurcharge:
      type: object
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        tax_factor:
          type:
          - number
          - 'null'
        actual_carrier:
          type:
          - string
          - 'null'
        value:
          type: string
          readOnly: true
      title: Remote area surcharge
    ReturnedShipmentUser:
      type: object
      properties:
        companyName:
          type:
          - string
          - 'null'
          description: Name of your company; `null` when not set.
        directComplete:
          type: boolean
          readOnly: true
          description: Whether the warehouse may use the simplified picking process for your shipments, skipping barcode scans when picking.
        firstName:
          type: string
          description: First name of the account holder.
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        lastName:
          type: string
          description: Last name of the account holder.
        senderName:
          type:
          - string
          - 'null'
          description: Sender name printed on shipping labels instead of the company name; `null` when not set.
        skipBarcodePick:
          type: boolean
          readOnly: true
          description: Whether warehouse staff may skip scanning product barcodes when picking and packing your shipments.
        warehouseInstructions:
          type:
          - string
          - 'null'
          readOnly: true
          description: Packing instructions the warehouse follows for all your shipments (HTML); `null` when there are none.
      required:
      - firstName
      - lastName
      - warehouseInstructions
      title: Returned shipment user
    ReturnShipmentAnnouncedDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        type:
          type: string
          description: 'Kind of document.


            - `printable_label`: return label to print and attach to the parcel (PDF).

            - `qr_code`: QR code from the carrier, for example to hand in the parcel without a printed label (PNG).'
        data_type:
          type: string
          description: 'File format of the document.


            - `pdf`: PDF file.

            - `png`: PNG image.'
      required:
      - data_type
      - type
      title: Return shipment announced document
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        thoroughfare:
          type:
          - string
          - 'null'
          description: Street name; send the house number in `subThoroughfare` where possible.
        subThoroughfare:
          type:
          - string
          - 'null'
          description: House or building number.
        subSubThoroughfare:
          type:
          - string
          - 'null'
          description: Additional address details, such as building, floor or apartment.
        locality:
          type: string
          description: City or town.
        subLocality:
          type:
          - string
          - 'null'
          description: District or neighbourhood within the city.
        adminArea:
          type:
          - string
          - 'null'
          description: State, province or region, where the country uses one.
        subAdminArea:
          type:
          - string
          - 'null'
          description: County or district below the state or region.
        postalCode:
          type: string
          description: Postal code. A prefix matching `countryCode`, as in `DE-12345`, is removed.
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country, as an ISO 3166-1 alpha-2 code.
        latitude:
          type:
          - number
          - 'null'
          description: Latitude of the address, in decimal degrees.
        longitude:
          type:
          - number
          - 'null'
          description: Longitude of the address, in decimal degrees.
        validated:
          type: boolean
          readOnly: true
          description: Whether byrd has validated the address. `false` only means it was not validated, not that it is invalid.
