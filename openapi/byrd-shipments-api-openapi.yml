          type: string
          format: date-time
          description: When picking of the shipment's items was completed (ISO 8601, UTC).
        assigned_at:
          type: string
          format: date-time
          description: When the shipment was assigned to a warehouse worker for picking (ISO 8601, UTC).
        allocated_at:
          type: string
          format: date-time
          description: When stock was allocated to the shipment for picking (ISO 8601, UTC).
        packaging_started_at:
          type: string
          format: date-time
          description: When the warehouse started packing the shipment (ISO 8601, UTC).
        packaged_at:
          type: string
          format: date-time
          description: When the shipment was packed and labelled (ISO 8601, UTC).
        accepted_at:
          type: string
          format: date-time
          description: When the carrier first scanned the last of the shipment's units (ISO 8601, UTC); `null` until every unit was scanned.
        sent_at:
          type: string
          format: date-time
          description: When all of the shipment's units left the warehouse (ISO 8601, UTC).
        delivered_at:
          type: string
          format: date-time
          description: When the last of the shipment's units was delivered to the recipient (ISO 8601, UTC).
        returned_at:
          type: string
          format: date-time
          description: When the return of the shipment arrived at the warehouse (ISO 8601, UTC).
      title: Checkpoints
    ReturnShipmentAnnouncedInput:
      type: object
      properties:
        shipment_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the shipment being returned (UUID). The shipment must be yours and must have been sent.
        user_id:
          type: string
          format: uuid
          writeOnly: true
          description: 'ID of the byrd account the shipment belongs to (UUID). Ignored for customer accounts: the return is always created for your own account.'
        send_documents_to_email:
          type: string
          format: email
          writeOnly: true
          description: Email address the return label is sent to once it is generated. Required unless `send_email` is `false`, and must be left out then.
        send_email:
          type: boolean
          default: true
          writeOnly: true
          description: Whether the return label is emailed once it is generated. Set it to `false` to only generate the label and download it from `documents` instead. Defaults to `true`.
        documents_email_language:
          type: string
          writeOnly: true
          maxLength: 2
          description: Language of the email carrying the return label and of the label itself, as an ISO 639-1 two-letter code, for example `de`. `en`, `de` and `fr` are supported and any other value falls back to English. When `null`, the language is taken from the destination country of the shipment, falling back to English.
        portal_tier:
          type: string
          enum:
          - basic
          - pro
          writeOnly: true
          description: Returns Portal tier the return is announced through, `basic` or `pro`. Ignored for customer accounts.
        label_type:
          type: string
          enum:
          - byrd_label
          - identifier_only
          writeOnly: true
          description: 'Kind of return label generated for the return. Defaults to `byrd_label`.


            - `byrd_label`: carrier shipping label for `courier`.

            - `identifier_only`: a return slip whose cut-off strip identifies the return to the warehouse; it is not a shipping label and has no tracking number.'
        origin:
          type: string
          default: portal
          enum:
          - portal
          - dashboard
          - api
          writeOnly: true
          description: 'Where the return was announced. Ignored for customer accounts.


            - `portal`: the Returns Portal.

            - `dashboard`: the byrd dashboard.

            - `api`: the API.'
        items_announced:
          writeOnly: true
          description: Items of the shipment that are being returned, with their amounts; at least one. Each shipment item can be announced in only one return.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentItemAnnouncedInput'
        courier:
          type: string
          enum:
          - amazon_prime
          - asendia_global
          - brt_it
          - colissimo_fr
          - correos_es
          - dbschenker_global
          - delivengo_fr
          - derkurier_de
          - dhl_de
          - dhlexpress_de
          - dpd_at
          - dpd_de
          - dpd_gb
          - exporto_global
          - fedex_global
          - gls_global
          - mondialrelay_fr
          - parcelforce_gb
          - post_at
          - post_de
          - post_it
          - post_nl
          - royalmail_gb
          - schneckenpost_de
          - sendcloud_global
          - seur_es
          - sevensenders_global
          maxLength: 64
          description: Carrier the return is shipped with. Must be a carrier enabled for your account, the warehouse and the destination country; ask your byrd contact person which value applies to you.
      required:
      - courier
      - shipment_id
      additionalProperties: false
      title: Return shipment announced input
    ReturnShipmentRegenerateDocumentsInput:
      type: object
      properties:
        send_documents_to_email:
          type: string
          format: email
          writeOnly: true
          description: Email address the regenerated return label is sent to. Used for this label only; the return keeps its own `send_documents_to_email`. Required unless `send_email` is `false`, and must be left out then.
        send_email:
          type: boolean
          default: true
          writeOnly: true
          description: Whether the return label is emailed once it is generated. Set it to `false` to only generate the label and download it from `documents` instead. Defaults to `true`.
      additionalProperties: false
      title: Return shipment regenerate documents input
    ReturnAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the address (UUID).
        name:
          type: string
          description: Name of the warehouse that returns are sent to.
        street_name:
          type: string
          description: Name of the street, without the house number.
        city:
          type: string
          description: City.
        country_code:
          type: string
          description: Country (ISO 3166-1 alpha-2), for example `DE`.
        street_number:
          type: string
          description: House number.
        address_addition:
          type: string
          description: Additional address details, such as building or floor.
        postal_code:
          type: string
          description: Postal code. For countries with numeric postal codes, anything but digits is removed, such as a `DE-` prefix.
        state:
          type: string
          description: State, province or region; `null` when not needed.
      title: Return address
    ReturnShipmentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        returnID:
          type: string
          format: uuid
          readOnly: true
          description: ID of the return the item belongs to (UUID).
        byrdProductID:
          type: string
          format: uuid
          description: ID of the returned product (UUID).
        shipmentItemID:
          type: string
          format: uuid
          description: ID of the shipment item that was returned (UUID); `null` when the warehouse matched the item by product only.
        amount:
          type: integer
          minimum: 1
          description: Number of units returned; at least 1. When `packagingUnitID` is set, the number of packaging units.
        packagingUnitID:
          type: string
          format: uuid
          description: ID of the packaging unit the product came back in (UUID); `null` for single units.
        condition:
          type: string
          enum:
          - a-new
          - used
          - damaged
          description: 'Condition of the item as rated by the warehouse. What happens to the item next is agreed during onboarding.


            - `a-new`: like new, normally put back into stock

            - `used`: shows signs of use and cannot be resold without further steps

            - `damaged`: cannot be resold'
        internalComments:
          type: string
          description: Notes the warehouse recorded about the item.
        photos:
          description: Photos the warehouse took of the returned item.
          type: array
          items:
            $ref: '#/components/schemas/ReturnShipmentItemPhoto'
      required:
      - amount
      - byrdProductID
      - condition
      title: Return shipment item
    ShipmentBatch:
      type: object
      properties:
        shipment_ids:
          type: array
          minItems: 1
          description: IDs of the shipments (UUIDs); at least one.
          items:
            type: string
            format: uuid
      required:
      - shipment_ids
      title: Shipment batch
    Pick:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the pick (UUID).
        quantity:
          type: integer
          description: Number picked, in packaging units when `packaging_unit` is set; see `total_items` for the number of items.
        storage:
          description: Storage the items are picked from, with its lot.
          allOf:
          - $ref: '#/components/schemas/PickStorage'
        product:
          description: Product picked.
          allOf:
          - $ref: '#/components/schemas/PickProduct'
        container_code:
          type: string
          description: Code of the warehouse container the picked items were placed in; `null` until picked.
        packaging_unit:
          description: Packaging unit picked; `null` when single selling units are picked.
          allOf:
          - $ref: '#/components/schemas/PickPackagingUnit'
        total_items:
          type: integer
          description: 'Number of items picked: `quantity` times the packaging unit''s quantity, or `quantity` when no packaging unit is picked.'
        reservation:
          type: boolean
          description: 'Whether the pick is still planned: `true` until the warehouse picks it and the stock is deducted from the storage.'
        shipment_id:
          type: string
          format: uuid
          description: ID of the shipment the pick is for (UUID).
        warehouse_id:
          type: string
          format: uuid
          description: ID of the warehouse fulfilling the shipment (UUID).
        zones:
          description: Warehouse zones the storage location belongs to; only returned when requested with `only`.
          type: array
          items:
            $ref: '#/components/schemas/StorageZone'
      title: Pick
    CarrierShippingRate:
      type: object
      properties:
        value:
          type: number
          description: Amount in `currency`, with a dot as decimal separator.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency of `value` (ISO 4217), for example `EUR`.
        tax_factor:
          type:
          - number
          - 'null'
          description: Tax factor of the price; `1.0` on item prices and `null` elsewhere. Ignored on input.
      required:
      - currency
      - value
      title: Carrier shipping rate
    ShipmentUnitDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the unit (UUID).
        items:
          description: Products packed in the unit; empty for units packed before items were recorded per unit.
          type: array
          items:
            $ref: '#/components/schemas/UnitItem'
        service:
          type: string
          description: 'Shipping service the unit is sent with; usually the shipment''s `service`, but it can differ when an economy fallback applies.


            - `standard`

            - `express`

            - `economy`

            - `pickup_point`

            - `pickup`

            - `amazon_prime`'
        carrier:
          description: Carrier the unit is sent with and its tracking details; the fields are `null` until a label is created.
          allOf:
          - $ref: '#/components/schemas/Carrier'
        parcel_id:
          type: string
          readOnly: true
          description: Unique 10-character alphanumeric identifier of the unit.
          example: A1B2C3D4E5
        type:
          type: string
          readOnly: true
          description: 'Kind of unit.


            - `parcel`: a parcel

            - `pallet`: a pallet'
        status:
          type: string
          readOnly: true
          description: 'Current status of the unit.


            - `new`: created and not yet packed and labelled

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: being returned to the warehouse

            - `returned`: the return arrived at the warehouse'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `label_error`, `error_resolved`: creating the label failed, or the failure was fixed; while `new` or `packaged`

            - `slam_ready`, `autobag_failed`: waiting for the SLAM machine, or the bagging machine failed; while `new`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `waiting_for_pickup`, `manual_outbound`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`'
        label_error_status:
          type: string
          readOnly: true
          description: 'Who byrd is waiting on to resolve the unit''s label error; `null` when there is no error or it has not been looked at yet.


            - `waiting_for_customer`: you have to fix or confirm something, such as the address or customs data

            - `waiting_for_warehouse`: the warehouse has to check the parcel

            - `waiting_for_carrier`: the carrier has to respond or fix something

            - `waiting_for_pricing`, `waiting_for_procurement`, `waiting_for_operations`, `waiting_for_engineering`: a byrd team has to act

            - `waiting_for_deletion`: the error will not be fixed and the unit will be deleted'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the unit has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/ShipmentUnitDetailCheckpoint'
        errors:
          readOnly: true
          description: Errors blocking the unit, such as a failed label creation; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        error_code:
          type: string
          readOnly: true
          description: Code of the error currently blocking the unit, for example `LC00` for a carrier error; `null` when there is none.
        slam:
          type: boolean
          readOnly: true
          description: Whether the unit is measured and labelled by a SLAM (scan, label, apply, manifest) machine.
        autobag:
          type: boolean
          readOnly: true
          description: Whether the unit is packed by an automatic bagging machine.
        dimensions:
          description: Outer dimensions (cm) and weight (kg) of the packed unit.
          allOf:
          - $ref: '#/components/schemas/UnitDimensions'
        pregenerated:
          type: boolean
          readOnly: true
          description: Whether the unit and its shipping label were created in advance, before packing.
        packaging_materials:
          description: Packaging materials the unit was packed with.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PackagingMaterials'
        group_number:
          type: integer
          readOnly: true
          description: Number of the packing station group whose printer printed the unit's label; `null` until the unit is labelled.
        sequence_number:
          type: string
          readOnly: true
          description: Position of the unit among the shipment's units, starting at 1.
        metrics:
          readOnly: true
          description: Item and pick counts for the unit; `null` for units without recorded items.
          allOf:
          - $ref: '#/components/schemas/UnitMetrics'
      title: Shipment unit detail
    ItemInput:
      type: object
      properties:
        product_id:
          type:
          - string
          - 'null'
          format: uuid
          description: ID of the byrd product to ship (UUID); send it or `sku`. `null` for custom bundles.
        shop_product_id:
          type:
          - string
          - 'null'
          description: ID of the product in your shop or order system; not necessarily a UUID.
        quantity:
          type: integer
          minimum: 1
          description: Number of units to ship; at least 1. For items of a custom bundle, the number per bundle.
        name:
          type:
          - string
          - 'null'
          description: Name of the product; replaced by the name stored on the product. Required for custom bundles and their items.
        price:
          type:
          - object
          - 'null'
          properties:
            value:
              type: number
              description: Amount in `currency`, with a dot as decimal separator.
            currency:
              type: string
              pattern: ^[A-Z]{3}$
              description: Currency of `value` (ISO 4217), for example `EUR`.
            tax_factor:
              type:
              - number
              - 'null'
              description: Tax factor of the price; `1.0` on item prices and `null` elsewhere. Ignored on input.
          required:
          - currency
          - value
          description: Retail price of one unit, used for customs documents and insurance; it is multiplied by `quantity`. Required for custom bundles.
        dimensions:
          type:
          - object
          - 'null'
          properties:
            height:
              type:
              - number
              - 'null'
              minimum: 0.1
              description: Height in cm; `null` when unknown.
            width:
              type:
              - number
              - 'null'
              minimum: 0.1
              description: Width in cm; `null` when unknown.
            length:
              type:
              - number
              - 'null'
              minimum: 0.1
              description: Length in cm; `null` when unknown.
            weight:
              type:
              - number
              - 'null'
              minimum: 0.001
              description: Weight in kg; `null` when unknown.
          description: Dimensions and weight of one unit of the product; missing values are taken from the product, and the weight stored on the product always replaces the one sent.
        customs:
          type:
          - object
          - 'null'
          properties:
            origin_country_code:
              type:
              - string
              - 'null'
              pattern: ^[A-Z]{2}$
              description: Country the product was made in (ISO 3166-1 alpha-2), for example `CN`.
            hs_tariff_number:
              type:
              - string
              - 'null'
              description: 'Harmonized System (HS) tariff number of the product: 6, 8 or 10 digits.'
          additionalProperties: false
          description: Customs details of the product, needed for shipments leaving the EU or the UK; taken from the product when not sent.
        lot_number:
          type:
          - string
          - 'null'
          description: Lot the units have to be picked from; if not sent, byrd chooses lots first in, first out (FIFO).
        description:
          type:
          - string
          - 'null'
          description: Description of the product, used on customs documents; taken from the product when not sent.
        sku:
          type:
          - string
          - 'null'
          description: SKU of the byrd product to ship; send it or `product_id`. Required for custom bundles, where it has to be unique within the shipment.
        serial_number_tracked:
          type:
          - boolean
          - 'null'
          description: Whether serial numbers are recorded for the item when it is packed; set from the serial number setting of the product.
        type:
          type:
          - string
          - 'null'
          description: 'Type of item.


            - `product`: a single product (default)

            - `bundle`: a bundle product set up in byrd

            - `custom_bundle`: products packed together, listed in `children`

            - `supplement`: a supplementary product, such as a flyer, added because it is linked to another product in the shipment'
        children:
          description: 'Items the bundle consists of; empty for other item types. Required when `type` is `custom_bundle`: list every product to pack together, including the bag or box they go in.'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Child'
      required:
      - quantity
      title: Item input
    CashOnDelivery:
      type: object
      properties:
        price:
          description: Total amount the carrier collects from the recipient; only `EUR` is supported.
          allOf:
          - $ref: '#/components/schemas/CashOnDeliveryPrice'
      title: Cash on delivery
    StorageZone:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the warehouse zone (UUID).
        identifier:
          type: string
          description: Identifier of the warehouse zone.
      title: Storage zone
