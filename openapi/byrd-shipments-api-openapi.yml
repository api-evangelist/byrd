            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.UnsupportedDocument`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.GenerationFailed`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.UploadFailure`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.InvalidStatus`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.AlreadyExist`

            - `Warehouse.ReturnShipmentDocuments.GenerateDocuments.DefaultError`'
      additionalProperties: false
      title: Return shipment error
    TotalPrice:
