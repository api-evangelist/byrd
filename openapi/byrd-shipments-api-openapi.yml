openapi: 3.2.0
info:
  description: The byrd APIs for managing products, inbound deliveries, shipments and returns.
  contact:
    email: info@getbyrd.com
    name: General company contact
    url: https://getbyrd.com/kontakt/
  license:
    name: Copyright byrd technologies GmbH
  termsOfService: https://getbyrd.com/agb/
  version: '20260924'
  title: byrd Shipments API
servers:
- description: Production server
  url: https://api.getbyrd.com/
security:
- tokenAuth: []
tags:
- name: Shipments
  description: 'Orders shipped to your customers: create and release them, follow their units and picks, and handle their returns.'
paths:
  /v2/returns:
    get:
      operationId: returnshipmentlistapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReturnShipment'
                - $ref: '#/components/schemas/PaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns the courier and customer returns of your shipments, newest

        first unless you sort otherwise, filtered by the query parameters.

        See the Listing returns guide for the meaning of `returnType`,

        `reason` and the item `condition`.'
      x-byrd-roles:
      - admin
      - warehouse
      - customer
      - operator
      - customer_support
      - warehouse_support
      - service
      parameters:
      - in: query
        name: shipment_id
        description: Only include returns of the shipment with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: status
        description: 'Only include returns in one of these statuses: `announced`, `confirmed`, `cancelled`. Cancelled returns are never shown to customer accounts.'
        schema:
          type: array
          items:
            type: string
            enum:
            - announced
            - confirmed
            - cancelled
        required: false
        explode: false
        style: form
      - in: query
        name: date_field
        description: 'Date field `date_from` and `date_to` apply to. Defaults to `createdAt`.


          - `createdAt`: when the return was created

          - `updatedAt`: when the return was last changed

          - `announcedAt`: when the return was announced

          - `postedAt`: when the parcel was handed to the carrier

          - `deliveredAt`: when the return arrived at the warehouse

          - `processedAt`: when the warehouse checked the items'
        schema:
          type: string
          default: createdAt
          enum:
          - updatedAt
          - postedAt
          - deliveredAt
          - processedAt
          - announcedAt
          - createdAt
        required: false
      - in: query
        name: date_from
        description: Only include returns whose `date_field` is at or after this time (ISO 8601, UTC), e.g. `2023-03-23T16:00:03Z`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: date_to
        description: Only include returns whose `date_field` is before this time (ISO 8601, UTC), e.g. `2023-03-23T16:00:03Z`. Must be after `date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: parcel_id
        description: Only include returns of the shipment with this parcel ID, or of the shipment unit with this parcel ID.
        schema:
          type: string
        required: false
      - in: query
        name: reason
        description: Only include returns with one of these reasons. See `reason` in the response for the values.
        schema:
          type: array
          items:
            type: string
            enum:
            - bad-address
            - bad-product
            - country
            - no-pickup
            - rec-unknown
            - refused-delivery
            - unwanted
            - customer
        required: false
        explode: false
        style: form
      - in: query
        name: carrier
        description: Only include returns shipped with this carrier, as a carrier identifier such as `dhl_de`.
        schema:
          type: string
        required: false
      - in: query
        name: carrier_tracking_number
        description: Only include returns with this carrier tracking number.
        schema:
          type: string
        required: false
      - in: query
        name: user_ids
        description: Only include returns of shipments owned by these users (UUIDs). As a customer you only get your own returns.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: customer_name
        description: Only include returns whose original shipment recipient name or company contains this text (case-insensitive).
        schema:
          type: string
        required: false
      - in: query
        name: product_sku
        description: Only include returns with a received item of this SKU.
        schema:
          type: string
        required: false
      - in: query
        name: product_id
        description: Only include returns with a received item of the product with this ID (UUID).
        schema:
          type: string
        required: false
      - in: query
        name: type
        description: 'Only include returns of this type: `courier` or `customer`.'
        schema:
          type: string
          enum:
          - courier
          - customer
        required: false
      - in: query
        name: manual_search_required
        description: Only include returns for which the warehouse had (`true`) or had not (`false`) to search manually for the original shipment.
        schema:
          type: boolean
        required: false
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Fields'
      summary: List returns
  /v2/returns/{return_id}:
    get:
      operationId: returnshipmentdetailapi_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnShipment'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns one of your returns with its original shipment and the

        announced and received items.'
      x-byrd-roles:
      - admin
      - warehouse
      - customer
      - operator
      - customer_support
      - warehouse_support
      - service
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the return (UUID).
      summary: Get a return
  /v3/picks:
    get:
      operationId: picklistapiv3_get
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Pick'
                - $ref: '#/components/schemas/MinimalPaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns the picks of your shipments: which product the warehouse

        picks, how many, from which storage and lot. Filter by

        `shipment_ids` to get the picks of specific shipments.'
      x-byrd-roles:
      - customer
      - service
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: shipment_ids
        description: Only return picks of these shipments, by ID (comma-separated).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: include_deleted_storages
        description: Whether to include picks from storages that were deleted since. Defaults to `false`.
        schema:
          type: boolean
        required: false
      - in: query
        name: only
        description: Comma-separated dotted paths of the fields to return, for example `id,container_code,product.barcode`.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      summary: List picks
  /v3/returns/announce:
    post:
      operationId: returnshipmentannouncedapiv3_post
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnShipmentAnnounced'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Creates a customer return in the `announced` state for items of one

        of your shipments. The return label is generated asynchronously and

        emailed to `send_documents_to_email` a few seconds later, unless

        `send_email` is `false`, so `documents` is usually empty in the

        response. See

        Announcing returns.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnShipmentAnnouncedInput'
      x-byrd-roles:
      - admin
      - service
      - customer
      summary: Announce a return
  /v3/returns/{return_id}/documents:
    post:
      operationId: returnshipmentdocumentsapiv3_post
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnShipmentAnnounced'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
          description: '`send_documents_to_email` is missing or not a valid email, or is sent although `send_email` is `false`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Request.InvalidSchema
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: No return exists for the given id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Warehouse.ReturnShipments.Create.NotFound
        '412':
          description: The return cannot have documents regenerated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Warehouse.ReturnShipmentDocuments.GenerateDocuments.AlreadyPosted
                    - Warehouse.ReturnShipmentDocuments.GenerateDocuments.InvalidStatus
        '422':
          description: The return belongs to another customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - Warehouse.ReturnShipments.Create.Unauthorized
      tags:
      - Shipments
      description: 'Generates a new return label for an announced return that has not

        been posted yet and emails it to `send_documents_to_email` (unless

        `send_email` is `false`), for

        example because the QR code on the earlier label stopped working

        (about two weeks after it was created). The address is used for this

        label only and does not replace the return''s own

        `send_documents_to_email`. The documents are generated

        asynchronously.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnShipmentRegenerateDocumentsInput'
      x-byrd-roles:
      - admin
      - service
      - customer
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the return (UUID).
      summary: Regenerate the documents of a return
  /v3/shipments:
    get:
      operationId: shipmentlistapiv3_get
      responses:
        '200':
          content:
            application/vnd.byrd.customer+json:
              schema:
                allOf:
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ShipmentList'
                - $ref: '#/components/schemas/MinimalPaginationFields'
          description: Success response to a valid request
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      tags:
      - Shipments
      description: 'Returns your shipments that match the filters, newest first by

        default. To keep tracking data in sync, list the shipments sent in a

        period with `sent_date_from` and `sent_date_to`; add

        `include_unit_items` to get the items and serial numbers of each

        parcel.'
      x-byrd-roles:
      - customer
      - service
      - admin
      - operator
      - warehouse
      parameters:
      - in: query
        name: id
        description: Only the shipment with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: ids
        description: Only shipments with any of these IDs (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: product_id
        description: Only shipments containing the product with this ID (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: product_ids
        description: Only shipments containing any of these products (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: parcel_id
        description: Only shipments with a parcel whose parcel ID contains this text, ignoring case; also finds deleted parcels.
        schema:
          type: string
        required: false
      - in: query
        name: unit_id
        description: Only shipments with the parcel (unit) with this ID (UUID); also finds deleted parcels.
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: byrd_id
        description: Only shipments whose byrd ID contains this text, ignoring case; 3 to 10 characters.
        schema:
          type: string
          minLength: 3
          maxLength: 10
        required: false
      - in: query
        name: tracking_number
        description: Only shipments with a parcel that has this carrier tracking number.
        schema:
          type: string
        required: false
      - in: query
        name: postal_code
        description: Only shipments to this destination postal code.
        schema:
          type: string
        required: false
      - in: query
        name: storage_zone_ids
        description: 'For warehouse use: only shipments picked entirely from these storage zones (UUIDs); `null` selects shipments with a pick from storage outside any zone. Needs a `status` filter with only allocated shipments.'
        schema:
          type:
          - array
          - 'null'
          items:
            type:
            - string
            - 'null'
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_user_id
        description: 'For warehouse use: only shipments assigned to this warehouse worker (UUID).'
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: warehouse_ids
        description: Only shipments fulfilled by any of these warehouses (UUIDs).
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
        explode: false
        style: form
      - in: query
        name: warehouse_id
        description: Only shipments fulfilled by this warehouse (UUID).
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: carrier
        description: Only shipments with a parcel sent with any of these carriers, by carrier slug; see the list of carriers.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: predicted_carrier
        description: Only shipments whose carrier, as predicted when the shipment was released, is any of these carrier slugs; unlike `carrier`, this also finds shipments that have no parcel yet.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: service
        description: Only shipments sent with this `service`.
        schema:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
        required: false
      - in: query
        name: date_field
        description: 'Date of the shipment that `date_from` and `date_to` filter on; defaults to `created_at`.


          - `created_at`: created

          - `updated_at`: last changed

          - `released_at`: last release attempt

          - `picked_at`: picking completed

          - `packaged_date`: packed

          - `sent_date`: handed over to the carrier

          - `delivery_date`: delivered

          - `returned_date`: returned

          - `warehouse_sla_accepted_by`, `customer_sla_accepted_by`: deadline for the carrier to accept the shipment'
        schema:
          type: string
          default: created_at
          enum:
          - created_at
          - updated_at
          - released_at
          - picked_at
          - packaged_date
          - sent_date
          - delivery_date
          - returned_date
          - warehouse_sla_accepted_by
          - customer_sla_accepted_by
        required: false
      - in: query
        name: date_from
        description: Only shipments whose `date_field` is at or after this time (ISO 8601, inclusive).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: date_to
        description: Only shipments whose `date_field` is before this time (ISO 8601, exclusive); must be after `date_from`. For one calendar day, pass the following day, not the same day as `date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date_from
        description: Only shipments sent at or after this time (ISO 8601).
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date_to
        description: Only shipments sent at or before this time (ISO 8601); must not be before `sent_date_from`.
        schema:
          type: string
          format: date-time
        required: false
      - in: query
        name: sent_date
        description: Only shipments sent on this day (ISO 8601 date, UTC). Cannot be combined with `date_from`, `date_to`, `sent_date_from` or `sent_date_to`.
        schema:
          type: string
          format: date
        required: false
      - in: query
        name: min_age_days
        description: Only shipments released at least this many whole days ago; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: failed_release
        description: When `true`, only shipments whose last release attempt failed.
        schema:
          type: boolean
        required: false
      - in: query
        name: awaiting_release
        description: When `true`, only shipments waiting to be released to a warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: awaiting_allocation
        description: When `true`, only shipments waiting for their stock to be allocated in the warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: label_required
        description: When `true`, only packed shipments still waiting for a shipping label (sub-status `label_required` or `label_error`); when `false`, all other shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_address_validation
        description: When `true`, only shipments held because their address validation failed; when `false`, only shipments without an address validation error.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_allocation
        description: When `true`, only shipments whose stock could not be allocated in the warehouse.
        schema:
          type: boolean
        required: false
      - in: query
        name: failed_packaging
        description: When `true`, only shipments with a parcel whose shipping label could not be created (sub-status `label_error`).
        schema:
          type: boolean
        required: false
      - in: query
        name: error_resolved
        description: When `true`, only shipments with a parcel whose label error was resolved and that waits to be packed again (sub-status `error_resolved`).
        schema:
          type: boolean
        required: false
      - in: query
        name: container_code
        description: 'For warehouse use: only shipments kept in the warehouse container with this code before packing.'
        schema:
          type: string
        required: false
      - in: query
        name: destination_email
        description: Only shipments to this recipient email address, ignoring case.
        schema:
          type: string
        required: false
      - in: query
        name: is_b2b
        description: When `true`, only B2B shipments; when `false`, only B2C shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: processing_standard
        description: Only B2B shipments that use any of these B2B templates, by template key.
        schema:
          type: array
          items:
            type: string
        required: false
        explode: false
        style: form
      - in: query
        name: is_cod
        description: When `true`, only cash on delivery shipments; when `false`, only other shipments.
        schema:
          type: boolean
        required: false
      - in: query
        name: status
        description: Only shipments in any of these statuses; see `status` on the shipment for the values.
        schema:
          type: array
          items:
            type: string
            enum:
            - new
            - releasing
            - released
            - picking
            - packaging
            - packaged
            - sent
            - delivered
            - returning
            - returned
            - deleted
        required: false
        explode: false
        style: form
      - in: query
        name: sub_status
        description: Only shipments in any of these sub-statuses; needs a `status` filter. With more than one sub-status, send exactly one `status`, and each combination has to be valid.
        schema:
          type: array
          items:
            type: string
            enum:
            - validating_address
            - address_invalid
            - recalled
            - reserved
            - allocating
            - allocated
            - assigned
            - inbounding
            - inbound_error
            - label_error
            - error_resolved
            - autobag_failed
            - fba_details_required
            - fba_box_label_required
            - fba_pallet_label_required
            - label_required
            - label_created
            - label_uploaded
            - pickup_details_required
            - pickup_details_uploaded
            - manual_outbound
            - waiting_for_pickup
            - claim_reported
            - pick_up
            - in_transit
            - out_for_delivery
            - at_pickup_point
            - delayed
            - failed_delivery
        required: false
        explode: false
        style: form
      - in: query
        name: exclude_sub_status
        description: Leaves out shipments in any of these sub-statuses; shipments without a sub-status are kept.
        schema:
          type: array
          items:
            type: string
            enum:
            - validating_address
            - address_invalid
            - recalled
            - reserved
            - allocating
            - allocated
            - assigned
            - inbounding
            - inbound_error
            - label_error
            - error_resolved
            - autobag_failed
            - fba_details_required
            - fba_box_label_required
            - fba_pallet_label_required
            - label_required
            - label_created
            - label_uploaded
            - pickup_details_required
            - pickup_details_uploaded
            - manual_outbound
            - waiting_for_pickup
            - claim_reported
            - pick_up
            - in_transit
            - out_for_delivery
            - at_pickup_point
            - delayed
            - failed_delivery
        required: false
        explode: false
        style: form
      - in: query
        name: missing_documents
        description: When `true`, only shipments blocked because documents they need are missing.
        schema:
          type: boolean
        required: false
      - in: query
        name: priority_range
        description: 'For warehouse use: only shipments whose picking priority is within this range, given as `min,max` from 0 to 50; needs a `status` filter with only released statuses.'
        schema:
          type: array
          minItems: 2
          items:
            type: integer
            minimum: 0
            maximum: 50
        required: false
        explode: false
        style: form
      - in: query
        name: priority
        description: 'For warehouse use: only shipments with exactly this picking priority, from 0 to 50; needs a `status` filter with only released statuses.'
        schema:
          type: integer
          minimum: 0
          maximum: 50
        required: false
      - in: query
        name: destination_countries
        description: Only shipments to any of these countries (ISO 3166-1 alpha-2), for example `DE,AT`.
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
        required: false
        explode: false
        style: form
      - in: query
        name: total_products
        description: Only shipments with exactly this number of different products, not counting bundles themselves; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: total_items
        description: Only shipments with exactly this total number of physical items to pick, counting the contents of bundles; at least 1.
        schema:
          type: integer
          minimum: 1
        required: false
      - in: query
        name: total_picks
        description: 'For warehouse use: only shipments with exactly this number of items to pick, counting a packaging unit as one; needs a `status` filter with only allocated shipments.'
        schema:
          type: integer
          minimum: 1
        required: false
