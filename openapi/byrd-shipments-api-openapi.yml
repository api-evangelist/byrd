      title: Dimensions
    Shipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the shipment (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        b2b_config:
          readOnly: true
          description: 'B2B configuration of the shipment: the B2B template it uses and your answers to it; `null` for B2C shipments.'
          allOf:
          - $ref: '#/components/schemas/B2BConfig'
        checkpoints:
          readOnly: true
          description: Timestamps (ISO 8601, UTC) of the milestones the shipment has reached; a milestone not reached yet is `null`.
          allOf:
          - $ref: '#/components/schemas/Checkpoints'
        container_code:
          type: string
          description: Code of the warehouse container the picked items are kept in until the shipment is packed.
        customs:
          description: Customs details used to generate the export documents; required for international shipments. `null` when none were provided.
          allOf:
          - $ref: '#/components/schemas/Customs'
        destination_address:
          description: Address and contact details of the recipient. For deliveries to a carrier pickup point, see the pickup point guides for how to fill it.
          allOf:
          - $ref: '#/components/schemas/ShipmentDestinationAddress'
        errors:
          readOnly: true
          description: Errors blocking the shipment from progressing, for example a failed address validation or an allocation problem; empty when nothing is blocking it.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        insurance:
          description: Declared value the shipment is insured for; `null` when the shipment is not insured.
          allOf:
          - $ref: '#/components/schemas/Insurance'
        metrics:
          readOnly: true
          description: Item, SKU, pick and packaging-unit counts for the shipment.
          allOf:
          - $ref: '#/components/schemas/Metrics'
        notes:
          description: Free-text notes for your own use and packaging instructions for the warehouse.
          allOf:
          - $ref: '#/components/schemas/Notes'
        options:
          type:
          - object
          - 'null'
          properties:
            branding:
              type:
              - boolean
              - 'null'
              default: null
              description: Whether the shipment is packed with your branded packaging material; defaults to your account setting.
            packaging:
              type:
              - boolean
              - 'null'
              default: null
              description: Whether the warehouse packs the items in packaging material; defaults to your account setting.
            custom_handling:
              type:
              - boolean
              - 'null'
              default: false
              description: Whether the shipment is held for custom handling at the warehouse; it cannot be packed while this is `true`. Read-only for you.
            auto_release:
              type:
              - boolean
              - 'null'
              default: null
              description: Whether the shipment is released to a warehouse automatically once it is created; if `false` or not sent, it normally stays `new` until you release it.
            preferred_carrier:
              type:
              - string
              - 'null'
              default: null
              description: Carrier to send the shipment with, instead of the one byrd selects; see the list of carriers. Use it with caution, as a carrier that cannot serve the shipment leads to shipment errors.
            incoterm:
              type:
              - string
              - 'null'
              default: null
              description: 'Incoterm passed to the carrier for international shipments.


                - `DAP`: delivered at place; the recipient pays import duties and taxes (default)

                - `DDP`: delivered duty paid; you pay them'
            charge:
              type: string
              readOnly: true
              description: Whether byrd charges you for the shipment.
            fragile:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one fragile product.
            organic:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one organic product.
            grs:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one product that complies with the Global Recycled Standard (GRS).
            create_return_label:
              type: boolean
              readOnly: true
              description: Whether a return label is created for each parcel when the shipment is released; send it together with `print_return_label`.
            print_return_label:
              type: boolean
              readOnly: true
              description: Whether the return label is printed and packed with the shipment; requires `create_return_label` to be `true`, and has to be sent together with it.
            economy_fallback:
              type: boolean
              readOnly: true
              description: Whether the shipment is sent with the `standard` service when `economy` is not available for it; set on your account.
            not_before_date:
              type: string
              format: date-time
              readOnly: true
              description: Earliest date the shipment may be sent (ISO 8601, at midnight); `null` when there is no such date.
            not_later_date:
              type: string
              format: date-time
              readOnly: true
              description: Latest date and time the shipment has to be sent by (ISO 8601); `null` when not set.
            pickup_date:
              type: string
              format: date
              readOnly: true
              description: Date the carrier collects the shipment (ISO 8601), for B2B shipments; `null` when not scheduled.
            international:
              type:
              - boolean
              - 'null'
              default: null
              description: Whether the shipment needs a customs declaration because it crosses a customs border; `null` until the shipment is released.
            has_dangerous_goods:
              type: boolean
              readOnly: true
              description: Whether the shipment contains at least one item classified as dangerous goods.
            v3_packaging:
              type: boolean
              readOnly: true
              description: Whether the warehouse packs the shipment with the v3 packing process.
            requires_export_declaration:
              type: string
              readOnly: true
              description: Whether the shipment has to carry an export declaration; always `false` before the shipment is released.
            slam_compatible:
              type: string
              readOnly: true
              description: Whether the warehouse can pack the shipment on its automated labelling line; `null` until the shipment is released.
            autobag_compatible:
              type: string
              readOnly: true
              description: Whether the warehouse can pack the shipment with its automatic bagging machine.
            partial_fulfillment:
              type: string
              readOnly: true
              description: Whether the shipment was split off so that part of an order could be sent while the rest waits.
            expired_stock_allowed:
              type: boolean
              readOnly: true
              description: Whether the shipment may be fulfilled with expired stock; defaults to `false`.
            pickup_date_from:
              type: string
              format: date
              readOnly: true
              description: First day of the window in which the shipment will be collected (ISO 8601), for B2B shipments; set with the schedule pickup endpoint.
            pickup_date_to:
              type: string
              format: date
              readOnly: true
              description: Last day of the window in which the shipment will be collected (ISO 8601), for B2B shipments; set with the schedule pickup endpoint.
            self_pickup_by_customer:
              type: boolean
              readOnly: true
              description: Whether you collect the shipment from the warehouse yourself instead of a carrier, for B2B shipments; set with the schedule pickup endpoint.
            shipping_label_mode:
              type: string
              readOnly: true
              description: 'How the shipping label is obtained.


                - `auto`: byrd creates it with the carrier

                - `manual`: byrd uploads it, for example for `pickup` shipments'
          description: Fulfilment and shipping options set on the shipment.
        origin:
          type: string
          readOnly: true
          description: 'How the shipment was created; `null` for shipments created before this was recorded.


            - `api`: through the API with an API key

            - `manual`: in the byrd dashboard

            - `integration`: by a byrd shop integration'
        byrd_id:
          type: string
          readOnly: true
          description: Short human-readable identifier of the shipment, shown in the dashboard and printed on warehouse documents.
          example: ABCD12345
        priority:
          type: integer
          readOnly: true
          description: Picking priority in the warehouse, from 0 (normal) to 40 (highest); rises automatically once the shipping deadline is reached. `null` until the shipment is released.
          example: 10
        return_address:
          readOnly: true
          description: Address of the fulfilling warehouse that returns are sent to; `null` until the shipment is released.
          allOf:
          - $ref: '#/components/schemas/ReturnAddress'
        service:
          type: string
          enum:
          - economy
          - standard
          - express
          - pickup
          - pickup_point
          description: 'Shipping service the shipment is sent with.


            - `standard`: regular delivery

            - `express`: faster delivery, picked with higher priority

            - `economy`: cheapest, slower delivery

            - `pickup_point`: delivery to a carrier pickup point

            - `pickup`: collected from the warehouse, not shipped'
        shop:
          description: Order references from your shop or order system, such as the order number.
          allOf:
          - $ref: '#/components/schemas/ShipmentShop'
        status:
          type: string
          readOnly: true
          description: 'Current status of the shipment.


            - `new`: created and not yet released to a warehouse

            - `releasing`: being released to a warehouse

            - `released`: released and waiting to be picked

            - `picking`: items are being picked

            - `packaging`: being packed

            - `packaged`: packed and labelled

            - `sent`: handed over to the carrier

            - `delivered`: delivered to the recipient

            - `returning`: a return shipment was created

            - `returned`: the return arrived at the warehouse

            - `deleted`: deleted'
        sub_status:
          type: string
          readOnly: true
          description: 'Detail on the current `status`; `null` when there is none.


            - `validating_address`, `address_invalid`, `recalled`: while `new`

            - `reserved`, `allocating`, `allocated`, `assigned`, `inbounding`, `inbound_error`: while `released`

            - `label_error`, `error_resolved`, `autobag_failed`: while `packaging`

            - `label_required`, `label_created`, `label_uploaded`, `pickup_details_required`, `pickup_details_uploaded`, `manual_outbound`, `waiting_for_pickup`, `fba_details_required`, `fba_box_label_required`, `fba_pallet_label_required`: while `packaged`, mostly for B2B shipments

            - `pick_up`, `in_transit`, `at_pickup_point`, `out_for_delivery`, `delayed`, `failed_delivery`: carrier tracking events while `sent`

            - `claim_reported`: a support claim is open, while `sent` or `delivered`'
        units:
          readOnly: true
          description: Physical parcels or pallets the shipment is packed into, each with its own tracking information.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetail'
        warnings:
          readOnly: true
          description: Problems that do not block the shipment, for example an address validation error on a shipment released anyway, or the reason it was recalled.
          type: array
          items:
            $ref: '#/components/schemas/ShipmentUnitDetailError'
        warehouse:
          readOnly: true
          description: Warehouse fulfilling the shipment; its fields are `null` until a warehouse is assigned.
          allOf:
          - $ref: '#/components/schemas/ShipmentWarehouse'
        user:
          readOnly: true
          description: byrd account the shipment belongs to.
          allOf:
          - $ref: '#/components/schemas/ShipmentUser'
        dangerous_goods:
          readOnly: true
          description: Dangerous goods totals for the shipment.
          allOf:
          - $ref: '#/components/schemas/DGDetails'
        cash_on_delivery:
          description: Amount the carrier collects from the recipient on delivery; `null` when the shipment is not cash on delivery.
          allOf:
          - $ref: '#/components/schemas/CashOnDelivery'
        total_value:
          readOnly: true
          description: Total value of the items (unit price × quantity), converted to EUR.
          allOf:
          - $ref: '#/components/schemas/CashOnDeliveryPrice'
        packaging_materials:
          description: Packaging materials requested or suggested for packing the shipment.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PackagingMaterials'
        user_id:
          type: string
          format: uuid
          writeOnly: true
          description: ID of the byrd account the shipment is created for (UUID); for your requests it is always your own account.
        documents:
          writeOnly: true
          description: Documents the warehouse prints and packs with the shipment, such as delivery notes or invoices.
          type: array
          items:
            $ref: '#/components/schemas/Document'
        warehouse_id:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
          description: ID of the warehouse that has to fulfil the shipment; if omitted, byrd assigns one automatically.
        warehouse_user_id:
          type:
          - string
          - 'null'
          format: uuid
          writeOnly: true
          description: ID of the warehouse worker assigned to pick the shipment.
        pickup_point:
          type:
          - object
          - 'null'
          default: null
          writeOnly: true
          description: Carrier pickup point to deliver to, for `pickup_point` shipments; the fields it needs depend on the carrier.
          additionalProperties: {}
        items:
          description: Products in the shipment and their quantities; at least one.
          type: array
          items:
            $ref: '#/components/schemas/Item'
      required:
      - destination_address
      - items
      title: Shipment
    UndefinedResponse:
      type: object
      description: Generic (expected) response when endpoint doesn't explicitly define one
      properties:
        data:
          type: object
      title: Undefined response
    ProductBarcode:
