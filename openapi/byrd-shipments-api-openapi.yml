            - `product`: a single product (default)

            - `bundle`: a bundle product set up in byrd

            - `custom_bundle`: products packed together, listed in `children`

            - `supplement`: a supplementary product, such as a flyer, added because it is linked to another product in the shipment'
        fragile:
          type: boolean
          default: false
          readOnly: true
          description: Whether the product is fragile, as set on the product.
        organic:
          type: boolean
          default: false
          readOnly: true
          description: Whether the product is organic and needs special shipping conditions, as set on the product.
        grs:
          type: boolean
          default: false
          readOnly: true
          description: Whether the product complies with the Global Recycled Standard (GRS), as set on the product.
        required:
