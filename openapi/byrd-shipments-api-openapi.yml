        goods_type:
          type: string
          description: 'Type of goods in the shipment, declared to customs; defaults to `other`.


            - `document`: documents only

            - `gift`: a gift

            - `sample`: commercial samples

            - `remand`: goods sent back

            - `other`: anything else, such as sold goods'
        export_mrn:
          type:
          - string
          - 'null'
          description: Movement Reference Number (MRN) of the export declaration filed for the shipment, passed to the carrier; up to 18 characters.
        has_electronic_export_notification:
          type:
          - boolean
          - 'null'
          description: Whether an electronic export declaration was filed for the shipment; passed to the carrier.
      title: Customs
    PackagingMaterialsInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: ID of the record (UUID).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601).
        code:
          type: string
          minLength: 7
          maxLength: 7
          description: Unique 7-character code of the packaging material; ask byrd Support for it once the warehouse has validated the material.
        quantity:
          type: integer
          description: Number of units of the packaging material to use.
        override_reason_code:
          type: string
          enum:
          - too_big
          - too_small
          - not_available
          - other
          description: 'Reason a different packaging material was used than the one requested.


            - `too_big`: it was too big for the items

            - `too_small`: it was too small for the items

            - `not_available`: it was not available

            - `other`: another reason, given in `override_reason_text`'
        override_reason_text:
          type: string
          description: Explanation of why a different packaging material was used; required when `override_reason_code` is `other`.
        required:
          type: boolean
          description: Whether the warehouse has to use the packaging material (`true`, default) or may use a different one (`false`); a different one is used anyway when it is out of stock.
        type:
          type:
          - string
          - 'null'
          description: Type of the packaging material, filled in by byrd.
        size:
          type:
          - string
          - 'null'
          description: Size group of the packaging material, filled in by byrd.
      required:
      - code
      title: Packaging materials input
    ReturnShipmentItemPhoto:
